# File: p1_motion.yaml
# Brief: L6 per-process config for xbrain_motion P1 (12 S12)
#
# Description:
#   层:L6(进程私有) 归属进程:`xbrain_motion`(P1)
#   * 权威定义处:`12` §12 配置
#
#   本文件当前是[空骨架]---- 一个键都没有, 本轮未凭空填任何配置值.
#   * 落值时逐键去权威节抄, 不得从本文件或任何别处推断默认值:
#     10 §5.4.2 R-3 逐字"不提供默认值语法......解析不到即 E_CONFIG_INVALID 拒绝启动".
#   未标定的参数留 null(="声明键位但未赋值"), 绝不写 0.0 冒充已赋值.
#   L6 只[取值]不[定义]: 不得出现 common 顶层键,共享值一律写 ${common.xxx}
#     (10 §5.4.2 R-6 / R-1;违反即被 §5.4.4 断言 B 判"疑似复制"而拒绝启动).
# ===========================================================================

# TODO(`12` §12 配置):按该节逐键落值.本文件在落值前会让整栈按设计拒绝启动,这是预期行为.

# ===========================================================================
# P7.2 (2026-09-12) 导航宿主层取值 -- RNS 候选进仲裁 (12 S4.2c). 本段只[取值],
# 共享量一律 ${common.*} 引用 (10 S5.4.2 R-6); 站点原点/整机限幅在 L4/L2 为 null
# 时这里展开为 null, p1 启动即拒绝导航回路并打印键路径 (CLAUDE.md 3.1),
# NO 不写数冒充已标定. relative_move / timeouts_ms 两段逐字抄 12 S12 (P1 私有).
# ===========================================================================
geo:
  enu_origin:                         # 站点 ENU 锚点, 全系统唯一 (11 S9A / 10 S5.4.0 L4)
    lat: ${common.geo.enu_origin.lat}
    lon: ${common.geo.enu_origin.lon}
    alt: ${common.geo.enu_origin.alt}
nav:
  max_vx_mps: ${common.spec.max_vx_mps}         # 速度门 spec 项 (11 S9.6.2)
  max_wz_radps: ${common.spec.max_wz_radps}     # RNS ctx.wz_max (20 S2.5); V-01 未标定 = null
  holonomic: ${common.spec.holonomic}           # vy 通道能力位 (12 S4.7.3 TS-4)
  v_nom_mps: ${common.motion.profiles.patrol.max_mps}   # 任务标称速 = patrol 档 (20 S8.1A)
  v_obstacle_avoid_mps: ${common.motion.profiles.obstacle_avoid.max_mps}  # 11 S3.6 max_profile 降档上限
  degraded_fix_cap_mps: 0.5           # 99 U142 用户裁决 2026-11-06: rtk_float / dgps 与 fixed 同样作业, 限速 0.5 m/s; 99 U180 起只管 dgps
  float_fix_cap_mps: 1.0              # 99 U180 用户裁决 2026-11-13: rtk_float 位置限速 1.0 m/s (与 COG 同步提, 否则 COG 比双天线还快)
  cog_drive_fixed_mps: 2.0            # 99 U178 用户裁决 2026-11-13: 航向 L2 (COG) + rtk_fixed 与双天线一样最快 2.0 m/s (~~1.0~~, 99 U142 2026-11-06 ~ 2026-11-13)
  # 99 U179 用户裁决 2026-11-13: 录制期间键盘移动速度按定位/航向定, 取代语音设定的移动速度;
  # 云端键盘仍按 U150 只受急停与底盘限幅 (录制是人工行为, 看云台视频, 空格键急停, 不加避障)
  recording_teleop_fixed_mps: 2.0     # rtk_fixed + 双天线 (L1) 航向
  recording_teleop_degraded_mps: 1.0  # rtk_float / dgps, 或 COG / 桥接 / 无航向; single / no_fix 不动
  recording_state_stale_ms: 3000      # state/teach (1 Hz) 超过这么久没收到即按非录制 (语音移动速度, <= 1.0)
  bridge_drive_fixed_mps: 1.0         # 99 U178: IMU 桥接 / 航向死锁爬升 + rtk_fixed 保持 1.0 m/s (救命机制; 2 m/s 下里程计航向精度未测); 此前与 cog_drive_fixed_mps 共用
  cog_drive_degraded_mps: 0.6         # 99 U142 用户裁决 2026-11-06: 航向 L2 (COG) + rtk_float / dgps 固定 0.6 m/s (维持 COG 的最低速); 99 U180 起只管 dgps (位置误差约 1.5 m)
  cog_drive_float_mps: 1.0            # 99 U180 用户裁决 2026-11-13: 航向 L2 (COG) + rtk_float 固定 1.0 m/s; 桥接 / 爬升在 float 下取它但不超过 bridge_drive_fixed_mps
  climb_track_seg_m: 1.0              # 99 U151 用户裁决 2026-11-06: 航向死锁时取最后移动 >= 1 m 的位移方向作爬升航向
  climb_max_s: 30.0                   # 99 U151: 爬升最长时间 (同 rtk_driver blind_timeout_s), 超时仍无 GNSS 航向则停车
  heading_bridge_max_s: 30.0          # 99 U152 用户裁决 2026-11-06: GNSS 航向断开时用底盘 IMU yaw 变化量从最后一个可信航向接续的最长时间
  heading_consistency_deg: 20.0       # 99 U152: COG 与 IMU 推算航向之差超过此值即不用该 COG; 爬升轨迹段内 yaw 变化超过此值视为转弯段不用
  cog_blend_tau_s: 1.0                # 99 U152: 通过一致性检查的 COG 以此时间常数把估计航向拉向自己 (不整拍替换, 防低速转弯时滞后的 COG 逐拍带偏锚点); 双天线直接替换
relative_move:                        # 12 S12 的五个有消费者的键 (nav/relmove_intake.py);
                                      #   tolerance_* / a_dec_ratio 属 #20-9 已删的里程计执行器, 随其落地
  max_distance_m: 20.0
  max_yaw_rad: 6.2832
  pure_rotation_eps_m: 0.02           # 12 S4.5.3 纯旋转判定位移阈值 (m)
  default_timeout_s: 20.0             # RM-3
  abort_on_obstacle: true             # 12 S4.5.6 缺省
  cmd_deadzone:                       # 控制死区(本体规格, 用户 2026-11-03 "死区抑制"): 速度指令 <= 本值 = 没有动作
    vx_mps: ${common.spec.min_cmd_vx_mps}
    vy_mps: ${common.spec.min_cmd_vy_mps}
    wz_radps: ${common.spec.min_cmd_wz_radps}
speed_gate:                           # 12 S12: only the keys with a consumer land here. The f table
                                      #   itself is the 11 S9.6.2 U54 constants in gate/speed_gate.py
                                      #   (edges from ${common.motion.profiles[*].require_sense_m} is
                                      #   a registered follow-up, NEXT 8.5 R-5).
  hysteresis:                         # 12 S6.2 hysteresis table / S6.7 (U54): drop instantly; rise only
    speed_up_hold_s: 3.0              #   after d_free >= band edge + d_up_margin_m held this long (T_up)
    d_up_margin_m: 0.5                #   U54 top band 3.5 = 3.0 + 0.5; lower bands extrapolate (12 S6.2)
fence:                                # 12 S7 clipping constants (fence/clip.py). Shared truth keys are
                                      #   [referenced], never copied (11 S9A.6 M-01: the brake constants are
                                      #   the speed gate's own; 12 S12 forbids a private margin_by_fix copy).
                                      #   12 S12's stage_timeout_s / ping_period_s / snapshot_path /
                                      #   compile_in_thread have no consumer yet (two-phase ack path).
  brake_k: ${common.safety.brake.k}                       # 11 S9A.6 k (>= 1.0 by 12 S12.1 S-4)
  brake_a_mps2: ${common.safety.brake.a_mps2}             # 11 S9A.6 a
  t_lat_s: ${common.safety.t_lat_s}                       # 11 S9A.6 t_lat (U54 0.4 s)
  soft_margin_min_m: ${common.fence.soft_margin_min_m}    # 11 S9A.6 (3) declared floor of the soft band
  predict_dt_s: ${common.fence.predict_dt_s}              # 12 S7.3 predicted crossing (S-4a: >= t_lat + 1 tick)
  margin_by_fix:                                          # 12 S7.4 / S6.6 table (1): inset by fix_type;
    rtk_fixed: ${common.fence.margin_by_fix.rtk_fixed}    #   single is not referenced: no autonomous motion,
    rtk_float: ${common.fence.margin_by_fix.rtk_float}    #   no inset there (B6, fence_eval unavailable)
    dgps: ${common.fence.margin_by_fix.dgps}              # 99 U142: dgps now drives, so it is judged with its inset
  projection_iters: 3                                     # 11 S9A.8 POCS rounds (p1 private, 11 S9A.12)
# ===========================================================================
# 旋转许可 (12 S6A) -- 落地 11 S10.3.2 R-3. 本段全部键属[安全参数], 不支持热更新
# (CFG-31). 本段[没有] enabled 开关 -- 裁决 RC-D7: 一个 enabled:false 就是一条
# "远程解除旋转保护"的通道.
# NO r_robot 不在本段重复定义 -- 唯一定义处 = rns 膨胀段 (12 S12), 本段写了会被
#    10 S5.4.4 断言 B 判"疑似复制"而拒绝启动. 消费方 runtime/nav_cfg.py 去 rns 树读.
# wz_blind_radps 在本段是一个[引用], 真源仍是 11 S3.1.5.6 的
#    common.motion.free_space.blind.wz_blind_radps (L1 configs/common.yaml).
#    2026-09-29 之前本段没有这一行, 理由是"写成 ${common.*} 会被断言 A 判未解析
#    (该键未进 10 S5.4.5 共享参数对照表)" -- [已不成立]: 该键当日落值 0.3(用户裁决),
#    而 10 S5.4.2 R-2 对引用的唯一要求是路径以 common. 开头, refs.resolve 在合并后的
#    树里查路径, 没有"可达 common.* 路径白名单"这回事. 断言 A 查的是[残留 ${ / 查不到
#    的路径 / null], 三者都不命中.
#    NO 不得在本段写字面量 0.3 -- 那会变成第二份真源, 正是 10 S5.4.4 断言 B 要拦的形态.
# 下面三个 0 不是"未标定占位" -- 12 S12 把 0 定为本键的[最严]取值(任一占据格即拒,
#    未知格不设容差, 内半径 0 = 整圆盘). CLAUDE.md 3.1 禁的是拿 0 冒充已赋值的
#    标定量, 与此不同.
# ===========================================================================
rotation_clearance:
  data_source:            memory_grid  # 裁决 RC-D2 (2026-09-29 改判): 当前唯一合法值.
                                       #   原 lidar_grid 已作废 -- 整机无 LiDAR, 该 key
                                       #   无生产者 (12 S6A.3.1 订正框).
                                       #   NO 本键当前无代码消费者, 是声明不是门.
  margin_rot_m: ${common.safety.d_safe_m}   # U54 规则(3); 冻结线 MR-1 断言两者严格相等
  r_self_mask_m:          0.0          # 整圆盘; 必须 < r_robot + margin_rot (RCG-2)
  rot_occ_max:            0            # 任一占据格即拒 (11 S13.8 (8) 键名)
  rot_unknown_max_cells:  0            # RCG-3: 未知格不设容差, 改大即 fail-open.
                                       #   2026-09-29 语义变了取值没变: 现在是[限速触发阈],
                                       #   超过它走盲向限速而不是拒绝 (12 S6A.3.3 订正框).
  rot_unknown_ratio_max:  0.5          # 整帧 sanity check, 与 11 S3.9 同源
  grid_age_max_ms:        200          # RC-3: 比 T-05 的 500 更严, 理由见 12 S6A.5.
                                       #   换 MemoryGrid 后它还多管一件事: 环带统计里
                                       #   FREE 格超过这个龄期即降级为 UNKNOWN (12 S6A.3.2
                                       #   新鲜度分层) -- 记忆不参与放行, 只参与拒绝.
  recheck_ticks:          3            # RC-2: 已被 RCG-4 第二项买单; age=200 时上限 8
  wz_eps_radps:           0.05         # spin_like 第一合取项 (12 S6A.4.1)
  k_rot:                  0.5          # spin_like 曲率半径系数; 待实机整定 (12 S15 #25)
  r_robot_fallback_m:     0.60         # 只进 spin_like 触发判据, NO 绝不进 r_check
  ped_speed_mps:          1.5          # RCG-4 公式的行人速度; 待评审
  allow_visual_override:  false        # 缺省 false (RC-D4); 出口层无 cmd_id 可留名,
                                       #   置 true 时 rotation/rcg.py 直接拒绝构造
  wz_blind_radps: ${common.motion.free_space.blind.wz_blind_radps}
                                       # 盲向角速上限 (11 S3.1.5.4/S3.1.5.6, 现值 0.3).
                                       #   RCG-3 改向后这是[常走路径]: 身后恒未观测 =>
                                       #   每个 spin_like 拍都被限到这个值.
                                       #   读不到时仍按 12 S12 落地方案(2): 限幅退化为
                                       #   否决 + 一次 rotation_clearance_unconfigured.
timeouts_ms:                          # 12 S12 中本批有消费者的三键 (runtime/nav_wiring.py / nav/health_factor.py);
                                      #   感知计龄按 11 S3.1B T-50/T-51 (freshness/degradation.CAM_THRESH), NO 不用本段
                                      #   的 perception 键 (12 S12 的 200 与 11 的 300/1000 不一致, 契约为准; 待 12 收口);
                                      #   lidar_* / robot_state / nav2_* / teleop_* 随各自消费者落地
  gnss: 200                           # rt/gnss 缓存龄期 > 此值 = 无定位 / 无航向 (12 S3.3 gnss 行)
  health_degrade: 3000                # 11 S3.6: 3 s -> speed_factor 0.3 + warn
  health_dead: 10000                  # 11 S3.6: 10 s -> allow_motion false
