# File: query_templates.yaml
# Brief: L6 P4 query answer templates (16 S8.4 + S8.2.1 QT-1..QT-11)
#
# Description:
# G-class query answer templates. 16 S8.2.1 CMD-40: query answers are
# generated by DETERMINISTIC code (take real state -> fill template ->
# TTS); the LLM never produces data, at most polishes wording (and that
# polish is off by default, 16 S8.4). Placeholders {soc} etc take their
# value from the state topic ORIGINAL value; the template only phrases,
# it never infers (S8.2.1 note: {on_off} is decided by b7 ALONE, QT-2).
#
# Branch keys are the exact 16 S8.4 branch names; query_engine.py
# _QT_REQUIRED_BRANCHES (GWY-P4-34) asserts at load that the QT-1..QT-11
# multi-branch templates carry every required branch. Text is verbatim
# from 16 S8.4 with CJK punctuation transliterated to ASCII per the
# 2026-08-11 iron rule (docs keep CJK punct, yaml is ASCII).
#
# render_reply (query_engine) selects the branch (the CALLER decides
# which branch from state) and substitutes {placeholders}; it does NOT
# infer the branch or the values.

query_battery:
  ok:    "当前电量{soc}%,剩余续航约{range_km}公里"
  low:   "电量只有{soc}%了,建议尽快充电"
query_faults:
  none:  "系统正常,没有发现故障"
  some:  "发现{count}个问题:{items}"
query_events_recent:
  none:  "最近{window}没有事件"
  some:  "最近{window}有{count}条事件,其中{alarm_count}条报警"
query_detection:
  none:  "前方没有发现目标"
  some:  "前方{dist}米有{count}个{class}"

# -- QT-1 / QT-2 (G26 query_light_state) --
# on_off decided by b7 ALONE (QT-2); chassis has no readback, so it can
# only say "sent X, chassis does not report" -- NEVER "on" (QT-1).
query_light_state:
  payload:  "补光灯{on_off}"
  chassis:  "底盘灯我已经下发{req},但底盘不回报灯的状态"
  all:      "补光灯{on_off};底盘灯我已经下发{req},底盘不回报状态"

# -- QT-3 (G28 query_strobe_state) -- shadow only, cannot read back --
query_strobe_state:
  shadow:   "警灯是{on_off}的(按我方记录;本机暂不能直接回读该位)"

# -- QT-4 (G30 query_speaking) -- count carries 'about', 4s/sentence est --
query_speaking:
  idle:     "现在没有在喊话"
  speaking: "正在喊第{preset}条,大约还剩{n}遍"
  queued:   "正在喊第{preset}条,大约还剩{n}遍,后面还排着{q}条"

# -- QT-5 (G32 query_ptz_pose) -- position readback is a fake value --
query_ptz_pose:
  unknown:        "云台朝向读不回来,我不知道现在对着哪边"
  unknown_moving: "云台朝向读不回来;不过它现在正在转"

# -- QT-6 (G33 query_ptz_zoom) -- step only, never fold to a ratio --
query_ptz_zoom:
  step_only:      "已放大到第{step}档,一共三档"

# -- QT-7 (G37 query_ptz_owner) -- stale must answer unknown --
query_ptz_owner:
  held:           "云台现在被{holder}占着({note})"
  stale:          "云台归谁控我暂时不知道,仲裁状态读不回来"

# -- QT-8 (G39 query_active_fence) -- must compare intent vs effective --
query_active_fence:
  agree:          "现在生效的是{name}"
  disagree:       "本来要用{want},但实际生效的还是{actual}--下发了没生效"

# -- QT-9 (G41 query_fence_relation) -- fence_state + fence_eval paired --
query_fence_relation:
  ok_in:          "在{name}里面,离边界还有{dist}米"
  ok_out:         "已经在{name}外面了"
  degraded:       "按上次判定是在{state},但这次围栏判定不可信({why}),距离未知"

# -- QT-11 (G42 query_fence_detail) -- timeout fallback, never silent --
query_fence_detail:
  ok:             "{name}是{shape},{n}个点,当前{state}"
  timeout:        "暂时查不到那个围栏的详情"
