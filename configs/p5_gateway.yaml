# File: p5_gateway.yaml
# Brief: L6 per-process config for xbrain_gateway P5 (17 S10.1)
#
# Description:
#   层:L6(进程私有) 归属进程:`xbrain_gateway`(P5)
#   * 权威定义处:`17` §10.1("本段即现行规范",2026-08-07 逐键抄入,GWY-P5-17)
#
#   未定值一律 null(拒绝启动是预期行为):
#     hmi.bind / delivery.ftp.listen_address 里的 LAN2 口 ---- 网段待 U-15;
#     wifi 口本机 IP ---- 待部署定值;cloud.rtb_s ---- U-05 未定;
#     approval.expires_s ---- 甲方决策(17 Q-P5-19, 不得填工程猜测值).
#   hmi.bind 逐口显式绑定, 禁 0.0.0.0(17 §10.2:绑宽 = 被接管的
#     布控球可直接点急停; 禁出现在 LAN1/LAN3/LAN4 任一口上).
#   L6 只[取值]不[定义]: 不得出现 common 顶层键.
# ===========================================================================


# -- 站点显示时区(common.timezone,唯一真源)------------------------------
# HMI 底部时钟按此时区显示本地时间. 与 p4(G24 语音报时)同源, 一处改整栈切.
#   * 纯[显示]值, 不碰安全: 内部墙钟恒 UTC, 一切超时/周期用单调钟(CLK-C1).
#   * freeze 线展开 ${common.timezone}; 运行期读解析产物顶层 timezone 键.
#   * 消费侧 xbrain/p5_gateway: 放进 ui_config(前端加载读一次), 底部时钟本地 tick;
#     sync/source 徽标仍走每帧 snapshot 的 clock 组. HMI 必须常起(W-1 观察窗),
#     故时区不可解析时只告警回落浏览器时区, 不拒绝启动(与 p4 不同).
timezone: ${common.timezone}


event:
  db:                                 # 库定义在 15 §12 的 db 段, 此处只引用
    name:  record                     # data/record.db, 唯一写者 = P5 (15 §9.0/§9.10)
    table: events
    # PRAGMA/WAL/busy_timeout 不在此处配置 -- 四库一致且冻结, 见 15 §9.1
  batch_commit_ms:  100
  batch_commit_max: 50
  # 2026-10-08: 由字面量 90 改为引用. 原写 "retention_days: 90" 并把
  #   task(30) <= event(90) <= command_log(180) 三个值抄在同一行注释里.
  #   为何不再成立: 10 S5.4.5 把这三个键的唯一定义处定在 sites/{site_id}.yaml,
  #   而本行是同一个物理量的第二份定义 -- 改 L4 的 event_days 本进程仍按 90 清,
  #   且断言 C 的递增校验走 overlay, 看不见本层这份. 抄进注释的三个数同样会过期
  #   (CLAUDE.md S3.7).
  #   现在: 引用轴由冻结线一次性展开(CFG-FZ-18), 本进程读产物里的展开值.
  retention_days:   ${common.retention.event_days}
                                      # * 单值(GWY-P5-17 (5)); 递增关系由
                                      # 10 S5.4.4 断言 C-1 在启动期保证.
                                      # delivered != 1 的行不受保留期约束 (17 §3.5.4)
  need_ack_rule:    union             # channel='alarm'  union  sev in {alarm,fault} (17 §3.3 (2))
  ack_timeout_s:    5.0               # 与 11 §1.6 T-45 一致 (v0.7 定案 5.0)
  max_deliver_tries: 5

backfill:
  key_prefix:       event/replay      # 专用 key, 绝不重放原 key (17 §3.5.3 R-2/R-3)
  rate_eps_total:   20                # [建议] 待实测; 对账重发与重连补发共用本闸 (RC-4)
  weight:           { alarm: 4, normal: 1 }   # 双通道加权轮转 (U18 互不阻塞); 权重待实测
  freeze_upper_bound: true            # 批次开始冻结上界, 新事件走实时路径
  cursor_table:     event_cursor      # 跨重启保序 (SEQ-3)
  max_backlog:      50000             # 超出 -> 17 §3.7 背压, 只丢 normal 通道
  avg_event_bytes:  1024              # state/link.backlog.bytes 估算系数 (BL-3) [建议] 待实测

recon:                                # 17 §3Y.3 事件送达对账 (三层送达保证的 L3)
  enabled:      true                  # 云端是否支持未定 (Q-P5-17)
  period_s:     300                   # 缺省 5 min, 待与云端协商 (Q-P5-17)
  key_req:      event/recon/req       # 未登记 -> CR-EVT-1
  key_rsp:      event/recon/rsp       # 未登记 -> CR-EVT-1
  max_resend:   200                   # 单次对账重发上限 (RC-5)
  max_ranges:   64                    # missing_ranges 条数上限

startup:
  pending_keys:                       # ** 17 §3.5.6 过渡约定 -- 自检对且仅对这三条放行,
    - event/replay                    #   并强制落 warn/system{key_pending_registration}
    - event/recon/req                 #  CR-EVT-1 落笔后必须清空本列表
    - event/recon/rsp                 #   (回归测试断言它为空数组)

approval:                             # 17 §3.8 L3 待批准队列 (CMD-33 / 11 §7.17)
  max_pending: 8                      # 满时新 L3 -> rejected + E_BUSY (AV-6)
  publish_hz: 1                       # state/approval 保底频率
  expires_s: null                     # WARN: 审批等待上限待甲方 (Q-P5-19); null = 不超时
                                      #  不得填工程猜测值, 也不得套用 CT-3 的 30s
  rebuild_on_start: true              # 启动时从 record.db pending 重建 (AV-8),  不得 false
  exempt_from_backpressure: true      # approval.requested/expired 不进丢弃面 (待 Q-P5-11)

backpressure:
  queue_high_watermark: 0.60          # 丢 info
  queue_critical: 0.80                # 丢 info + warn
  queue_emergency: 0.95               # 仅留 alarm/fault
  report_drops: true                  # 丢弃必须显式上报

telemetry:
  rate_hz: 1
  degraded_rate_hz: 0.2
  perf_aggregate_s: 5
  local_buffer_s: 3600

delivery:                             # 17 §5.0 交付台账
  db:
    name:  record                     # 与 events/commands 同库同 writer (17 §5.0.1)
    table: delivery                   # 15 §9.0 尚未登记本表 -> CR-DB-2/Q-P5-25
  ftp_rate_limit_mbps: 15             # vsftpd local_max_rate 的回显; 生效处是 /etc/vsftpd.conf
  ack_timeout_s: 60
  retry_backoff_s: [60, 300, 900]     # 只 3 档而 max_retries=5: 第 4/5 次用 900 (17 §5.0.5)
  max_retries: 5
  normal_priority_when: [parked, charging]   # 仅驻车/充电时传普通数据 (COM-53)
  resume_batch:   200                 # 重启恢复一次扫描上限 (DP-3) [建议] 待实测
  # 2026-10-08: 同上, 由字面量 90 改为引用同一个键. 本行注释原逐字
  #   "与 events 一致" -- 那正是"应当引用它"的说法, 而字面量做不到:
  #   两个 90 各自独立, 改一个不会带动另一个.
  retention_days: ${common.retention.event_days}
                                      # state 非 {acked,reclaimed} 不删 (DP-8)
  outbox_dir:     outbox              # 相对 disk.data_root; 无同名 .meta.json 不进交付 (DP-6)
  ftp:
    listen_address:                   # ** COM-43: vsftpd 亦须逐口绑定,  禁 0.0.0.0
      - null                          #   LAN2 口 -- 网段待 U-15, 定值后填 "<LAN2_IP>"
      - null                          #   wifi 口 -- 本机 IP 待部署定值 "<WIFI_IP>"
    chroot_to_data_root: true         # 只读账号 + chroot (17 §5.5)
    ssl_enable: false                 # COM-43 明文; 升 FTPS/SFTP 待甲方 (Q-P5-23)

disk:
  data_root: /data/xbrain
  watermark: { reclaim: 0.70, aggressive: 0.85, block_normal: 0.95 }
  check_interval_s: 60

hmi:
  # 逐口显式绑定, 禁止 0.0.0.0 (17 §10.2; 承 11 §1.1.9 NET-C9 同一理由).
  #  不得出现在 LAN1(底盘段)/LAN3(GZH-2)/LAN4(布控球)任一口上.
  # 绑窄的代价是某段连不上 HMI(现场立即发现); 绑宽的代价是被接管的第三方
  # 相机能点急停(不会被发现) -- 不对称, 取保守侧.
  bind:
    # LAN2 (99 U92, 2026-10-25): 甲方自组网 192.168.188.0/24, 本机 .200.
    #   交付后唯一的对外口; wifi 不在时 p5 跳过 wifi 那项, 本项照常服务.
    - "192.168.188.200:18083"         # LAN2 上云通道口 (U92)
    # *** 本行跟着 ORIN 的 wifi IP 走: 设备换网络/换地点就要改.
    #   2026-09-01 办公室 192.168.1.19 -> 2026-09-04 居家 192.168.1.8
    #   -> 2026-10-24 机器狗主控 .1.26 (192.168.1.26).
    #   NET-C9 禁 0.0.0.0(见上), 所以只能写死具体地址, 没法自适应;
    #   写错的表现是[本机 HMI 的 LAN 访问失效], 云端面不受影响
    #   (Zenoh router 那侧由 run_stack_cloud.sh 自动探测 LAN_IP).
    - "192.168.1.26:18083"            # wifi IP (调试口, U92: 交付关闭; 不在时被跳过); 逐口非 0.0.0.0
    - "127.0.0.1:18083"               # 本机调试
  state_push_hz: 5                    # RTK 20Hz 降频
  link_probe_hz: 1
  link_rtt_degrade_ms: 200
  link_down_misses: 3
  estop_fast_path: true               # 独立任务, <=10 ms
  # -- W9 解锁后自动站立 (99 U181, 用户 2026-11-13). HMI 解锁发出后, state/robot 读回
  #    两把锁都清掉 (= 按钮变绿) 就发一次 cmd/chassis/ctrl{stand}; 本窗口内没解开 (例如
  #    硬件急停还按着) 就不站. 已经站着 (stand / rl_control) 不再发. 代码里没有默认值:
  #    缺了只关掉自动站立, 解锁照常.
  unlock_stand_window_ms: 5000
  # -- W2 点击导航 (11 S12.1.1 W2; 用户 2026-11-10). 只能点路径上的点或关键点.
  #    点关键点按 waypoint_id 下发, 到点半径取该关键点自己的 arrival_radius;
  #    点路径上的点按 lat/lon 下发, 路径点没有半径, 用下面这个值随帧带给 P3
  #    (P3 对坐标型 goto 不收无半径的帧, 不替它编一个, route_push_runtime).
  #    取 1.0 = 现有 4 个关键点的 arrival_radius, 两种点到点判据一致.
  #    安全相关, 代码里没有默认值: 缺了 HMI 的路径点导航整类拒收.
  goto:
    arrive_radius_m: 1.0

  # -- HMI web server UI params (17 §6.10; user 2026-08-12). These are UI
  #    presentation values, NOT safety params -- defaults allowed (3.1 only
  #    governs common.spec.*/common.safety.*). Port default 18083 = AI service
  #    port (LLM 18082) + 1, supersedes old 8080; carried in bind IP:port above.
  web:
    port: 18083                       # U7: default = AI service port succession; also in bind
    push_hz: 2                        # W6: WS state_snapshot server-push rate (Hz)
    static_dir: "hmi/static"          # index.html/hmi.css/hmi.js under xbrain/p5_gateway/
    map:
      grid:
        minor_m: 1.0                  # U1: minor grid cell = 1 m (kept for schema; not drawn)
        major_m: 5.0                  # U1: legacy single major cell (superseded by cell_options_m)
        # U1 (user 2026-08-18): the grid cell (metres) is ADAPTIVE + yaml-driven.
        # The frontend picks the smallest of these whose on-screen size stays big
        # enough (never a pinprick sieve) at the current zoom. Add/remove values
        # here to tune -- no cell size is hard-coded in the frontend.
        # 用户 2026-11-10: 比例尺只在 1~10 m 之间. 缩到连 10 m 格也挤成一团时
        # 网格隐藏 (比例尺显示"网格 已隐藏"), 不画成一片灰.
        # ~~cell_options_m: [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000]~~ (被替代 2026-11-10)
        cell_options_m: [1, 2, 5, 10]
        # 用户 2026-11-10: 网格线屏幕粗细固定, 不随缩放变. 取原 10 m 网格时的
        # 可见线宽 (约 2 px, 原 0.7 m 线宽在图案边上被裁掉一半).
        line_px: 2
        # 用户 2026-11-11: 网格线颜色再黑一倍 -- 亮度减半, ~~#555555~~ -> #2a2a2a.
        line_color: "#2a2a2a"
      viewbox: "-100 -65 240 145"     # ENU meters; from customer sample
      # U4. 用户 2026-11-10: 网格要能放大到 1 m. 1 m 格须在屏上 >= 42 px, 即地图宽
      # <= 屏宽/42 (1000 px 宽约 24 m), 从 240 m 的基础视窗要放大约 10 倍, 取 16 留余量.
      # wheel_step 改为每格滚轮的放大比例 (x1.12); 按钮每次 x1.25 (前端常数).
      # ~~zoom: { min: 0.65, max: 2.8, wheel_step: 0.12 }~~ (被替代 2026-11-10, 原为加法步进)
      zoom: { min: 0.65, max: 16, wheel_step: 0.12 }
    font:                             # U2: family + size_px per panel; size_px = 2x sample (user 2026-08-14)
      map:    { family: '"Microsoft YaHei","PingFang SC",sans-serif', size_px: 24 }
      legend: { family: '"Microsoft YaHei","PingFang SC",sans-serif', size_px: 22 }
      plan:   { family: '"Microsoft YaHei","PingFang SC",sans-serif', size_px: 24 }
      status: { family: '"Microsoft YaHei","PingFang SC",sans-serif', size_px: 22 }
      coord:  { family: '"Microsoft YaHei","PingFang SC",sans-serif', size_px: 22 }
    layout:                           # U3: panel sizes (css px) -- customer sample
      plan_panel: { width_px: 370, max_height_px: 420 }
      status_bar: { height_px: 39 }
    fence:                            # U5: fence line by TYPE (17 S6.10.2A, user 2026-08-13)
      # 99 U183 (用户 2026-11-13): 围栏线宽 = 已录制路径的 1.5 倍. 路径屏幕 7 px (配置 3.5),
      # 围栏屏幕 10.5 px, lineStroke 按配置值 x2 画, 所以写 5.25 (~~2.4~~).
      active: { line: { style: "solid", color: "#2f88ff", width_px: 5.25 } }  # allow -> 活动区域: 亮蓝粗实线
      forbid: { line: { style: "solid", color: "#ff2020", width_px: 5.25 } }  # forbid -> 禁入区域: 亮红粗实线
      alarm:  { line: { style: "solid", color: "#ff2020", width_px: 5.25 } }  # zone -> 报警区域: 亮红粗实线
      speed:  { line: { style: "solid", color: "#22c5ff", width_px: 5.25 } }  # speed_limit -> 限速区域: 亮蓝实线
      # 99 U183: 未启用的围栏(任何类型)一律灰色虚线, 名字后加 (未启用)
      disabled: { line: { style: "dashed", color: "#9a9a9a", width_px: 5.25 } }
    route:                            # U5: route line styles (17 S6.10.2A)
      # 用户 2026-11-12: 路径只画折线, 不再画采样点圆点; 屏幕线宽 = 原来路径上绿色圆点的直径 7 px.
      # 注意 hmi.js lineStroke 把所有线宽按配置值 x2 画 (2026-08-18 规则), 所以这里写 3.5.
      recorded: { line: { style: "solid", color: "#2ecc40", width_px: 3.5 } }  # 已录制路径: 亮绿实线 (~~1.0~~)
      realtime:                       # 实时行走轨迹: 亮黄粗实线
        line: { style: "solid", color: "#ffd400", width_px: 2.4 }
        show_after_complete: true     # 巡逻完成后是否仍显示黄色轨迹(false=隐藏)
    waypoint:                         # U6: 位置点 (用户 2026-11-11): 亮白实心正圆 + 亮红外框, 两者之间无镂空
      fill_color: "#ffffff"           # 圆点填充: 亮白
      ring_color: "#ff1f1f"           # 外框: 亮红
      # 外径 12 px: 用户先要旧版 (外径 4 px) 的 1.5 倍 = 6 px, 同日再要大一倍 = 12 px;
      # 2026-11-12 再大一倍 = 24 px, 红框加粗一倍 (2 -> 4 px): 22 + 4/2 = 24
      radius_px: 22.0                 # 圆心到外框中线, 屏幕像素 (~~5.0~~ ~~11.0~~)
      ring_px: 4.0                    # 外框粗细, 屏幕像素 (~~2.0~~); 压在圆周上, 一半在内, 所以与白点之间无缝
      # 用户 2026-11-12: 充电站/桩 (type dock) 黄色圆饼, 内写名字里的编号 (1号充电站 -> 1);
      # 返航终点站 (type home) 绿色圆饼; 其余白内红外. 三类一样大 (外径 = radius_px + ring_px/2).
      # 黄 / 绿饼加 1 px 深色描边 (画在同一外径内), 压在黄色实时轨迹上也看得清.
      dock_fill_color: "#ffd400"      # 充电站 / 充电桩: 黄
      home_fill_color: "#22c55e"      # 返航终点站: 绿
      disc_outline_color: "#1a1a1a"   # 黄 / 绿饼的描边: 深色
      disc_outline_px: 1.0            # 描边粗细, 屏幕像素
      number_color: "#000000"         # 黄饼里编号的颜色
      # 用户 2026-11-12: 航点名称在圆饼右侧, 与圆饼水平居中对齐, 紧挨着圆饼;
      # 这是圆饼外沿到第一个字的间距, 屏幕像素, 不随缩放变 (~~名称在点上方 2 m, 左对齐~~)
      label_gap_px: 4
      # ~~recorded / unrecorded: { shape, color, size_px }~~ 2026-11-11 起不再区分, 统一上面的样子
    robot:                            # U9: 机器人当前位置三角 (用户 2026-11-11): 亮红
      color: "#ff1f1f"
      # 用户先要旧版 (9 px) 的 3 倍 = 27 px, 同日再缩小一半 = 13.5 px, 再加大三分之一 = 18 px;
      # 2026-11-12 再大一倍 = 36 px
      size_px: 36                     # 三角半长, 屏幕像素 (~~27~~ ~~13.5~~ ~~18~~), 不随缩放变
    teach:                            # U10 录制中轨迹 (17 S6.10.2, 用户 2026-11-12)
      # 粉色折线本身沿用 route.recorded.line 的线宽; 这里只配用户从演示里选定的 "流光":
      # 一段亮光沿录制折线从起点流到机器人三角, 循环. 长度/线宽按屏幕像素, 不随缩放变.
      flow:
        color: "#ffffff"              # 流光颜色: 亮白, 带同色光晕
        width_px: 4                   # 流光线宽, 屏幕像素 (压在 7 px 粉线上)
        length_px: 60                 # 亮光段长度, 屏幕像素
        period_s: 1.4                 # 从起点流到机器人一趟的时长, 秒
    goto:                             # W2 点击导航的界面参数 (用户 2026-11-10)
      # 用户 2026-11-12: 闪烁的目的地圆饼与位置点圆饼一样大 (外径 24 px -> 直径 48 px)
      pin_diameter_px: 48             # 目标点圆点直径, 屏幕像素, 不随缩放变 (~~20~~)
      snap_px: 14                     # 点击处离路径点多近 (屏幕像素) 算点中; 关键点为整个圆饼 (至少本值)

cloud:                                # 17 §7.1A state/link 阈值来源 (thresholds 回显)
  heartbeat_timeout_s: 5              # -> thresholds.degraded_s = 5.0 (L0->L1)
  disconnect_timeout_s: 15            # -> thresholds.down_s = 20.0 (L1->L2)
  rtb_s: null                         # WARN: U-05 未定; null = L3 不启用, 系统停在 L2
                                      #  实现不得自行取一个数 (11 §4.6.4)
  link_stable_s: 10                   # -> thresholds.stable_s 重连迟滞 (LNK-3) [建议] 待实测
  dscp_control_plane: 46              # EF, 控制面标记

uplink:                               # 17 §7.3 上行带宽账本 (U50/C28.3)
                                      # * 2026-08-05 取消云台码率控制后只剩[账本]:
                                      #   不驱动任何行为, 只回显到 state/link.uplink
  budget_mbps:        48              # 一律按低端判 (B-1); 高端 64 仅作余量参考
  # 流清单 -- 全部为文档估算, 待 T-BW-1 实测后回填 (Q-P5-14).只用于算账.
  flows:
    ptz_visible:   { normal_mbps: 6.0 }   # C28.3 实测: 6144kbps 配置封顶 6.4Mbps
    ptz_thermal:   { normal_mbps: 6.0 }   # 估算; 11 §1.1.8 未登记该流 (CR-BW-3)
    chassis_front: { normal_mbps: 6.5 }
    chassis_rear:  { normal_mbps: 6.5 }   # 估算; 归属未定 (Q-P5-12)
    delivery_ftp:  { normal_mbps: 15.0 }  # "事件+遥测+交付"合计口径 (U50)

media:                                # v2.0 S4.6 state/media 端点 (2026-10-24 .1.26 联调落值)
  # PTZ 经 NAT 对外 (10 NAT-1): Qt 连 <本机对外 IP>:554 -> 可见光 192.168.66.13:554,
  #   :8554 -> 热成像 192.168.66.108:554 (DNAT + SNAT, 只放行 Qt 源地址, MED-C2).
  #   NAT 规则本身在系统层 (deploy/net/), 本段只登记[对外]端点与探测目标.
  # * url 的主机 = 本机 LAN2 地址 (99 U92, 2026-10-25 由 wifi 192.168.1.26 迁到
  #   甲方自组网 192.168.188.200); 必须与 deploy/net/med-nat.env 的 EXT_IP 一致.
  # * url 禁带 user:password@ (S4.6); 口令只在 Qt 侧, 按 credential_ref 取.
  # * probe = 相机内部 host:port, 仅 TCP 握手判可达 (不认证, 见 media_probe.py);
  #   它不出现在报文里.
  # * max_bitrate_mbps = 相机编码器配置的码率上限 (LAPI Channels/0/Media/VideoEncode).
  #   2026-10-24 用户定: 可见光 main 由 16384 恢复 6144 kbps / I 间隔 50 (ptzkey2
  #   调高后未恢复); 可见光 sub (StreamID 1) 由 720x576 改 1920x1080 / 2000 kbps.
  #   可见光 sub 契约上限 2.0 (S4.6), 投影处强制. 热成像两路为经 NAT 实测上取整.
  probe_period_s: 5.0
  down_after_s: 15.0
  endpoints:
    - { id: cam_ptz_vis, stream: main, url: "rtsp://192.168.188.200:554/media/video1",
        credential_ref: robot_gj001_ptz_vis, max_bitrate_mbps: 6.2,  probe: "192.168.66.13:554" }
    - { id: cam_ptz_vis, stream: sub,  url: "rtsp://192.168.188.200:554/media/video2",
        credential_ref: robot_gj001_ptz_vis, max_bitrate_mbps: 2.0,  probe: "192.168.66.13:554" }
    - { id: cam_ptz_ir,  stream: main, url: "rtsp://192.168.188.200:8554/cam/realmonitor?channel=1&subtype=0",
        credential_ref: robot_gj001_ptz_ir,  max_bitrate_mbps: 2.5,  probe: "192.168.66.108:554" }
    - { id: cam_ptz_ir,  stream: sub,  url: "rtsp://192.168.188.200:8554/cam/realmonitor?channel=1&subtype=1",
        credential_ref: robot_gj001_ptz_ir,  max_bitrate_mbps: 0.5,  probe: "192.168.66.108:554" }
