schema_version: 1
# source_note single-line on purpose: the C++ audit reader (chassis_relay,
# yaml_lite) parses nested maps + scalar leaves only -- a folded multi-line
# scalar here refused its startup gate on 2026-09-26.
source_note: generated from 11 S1.1.6 hand tables (perception/p1_motion/chassis_relay) + WL-G1 auto extract from S2.2 (p2_core/p4_agent). CFG-BT-17.
processes:
  perception:
    pub:
    - event/{severity}/perception
    - state/targets
    sub: []
  p1_motion:
    # 2026-09-27 corrected, same defect as chassis_relay below: 11 S1.1.6 (2)
    # put the RT key in the general-key column on P1-20 and P1-24. These lists
    # are the GENERAL-plane surface only (S1.1.6 verbatim: the cross-plane
    # processes may show only these keys ON THE GENERAL PLANE), so:
    #   * P1-20 is RT->GEN forwarding -> pub event/fault/chassis (was missing,
    #     while the sub set carried rt/chassis/fault instead);
    #   * P1-24 is self-consumed on the RT plane with NO general-plane
    #     operation -> it leaves this file entirely.
    # Both rt/* subscriptions stay registered as subscribers on their own rows
    # in 11 S2.2.1, which is the RT-plane half of S1.1.6 rule b.
    pub:
    - cmd/config/ack
    - cmd/fence/ack
    - cmd/motion/relative_move/status
    - event/fault/chassis
    - event/{severity}/arbitration
    - event/{severity}/motion
    - state/arb/{domain}
    - state/clock
    - state/fence
    - state/motion/path_progress
    - state/pose
    - state/teleop
    sub:
    - cmd/chassis/light
    - cmd/chassis/mode
    - cmd/config
    - cmd/estop
    - cmd/fence
    - cmd/motion/behavior
    - cmd/motion/factor
    - cmd/motion/relative_move
    - cmd/motion/route
    - cmd/teleop
  chassis_relay:
    # 2026-09-26 corrected: these are the GENERAL-plane keys the relay
    # PUBLISHES (RT->GEN forwarding, 11 S1.1.6 CR-3..CR-10/CR-12). The nine
    # rt/* keys that sat here came from the doc table's swapped columns --
    # the relay SUBSCRIBES those on the RT plane (registered in 11 S2.2.1),
    # they were never its general-plane pub set.
    pub:
    - cmd/chassis/ctrl/ack
    - cmd/estop/ack
    - event/fault/chassis
    - probe/estop/pong
    - state/chassis_basic
    - state/chassis_device
    - state/chassis_motion
    - state/power
    - state/robot
    sub:
    - cmd/chassis/ctrl
    - cmd/estop
    - probe/estop/ping
  p2_core:
    pub:
    - cmd/arb/{domain}/req
    - cmd/audio/speak
    - cmd/audio/speak/ack
    - cmd/chassis/light
    - cmd/chassis/mode
    - cmd/config/ack
    - cmd/fence/ack
    - cmd/mode/ack
    - cmd/motion/behavior
    - cmd/motion/factor
    - cmd/motion/intent/ack
    - cmd/motion/relative_move
    - cmd/payload/ack
    - cmd/ptz/ack
    - cmd/system/ack
    - health/bit
    - health/summary
    - rt/audio/gate
    - rt/audio/lease
    - rt/audio/mic
    - state/arb/{domain}
    - state/audio
    - state/mode
    sub:
    - audio/broadcast
    - audio/voice_in
    - cmd/arb/{domain}/req
    - cmd/audio/speak
    - cmd/audio/speak/ack
    - cmd/estop
    - cmd/fence
    - cmd/mode
    - cmd/motion/intent
    - cmd/motion/relative_move/status
    - cmd/payload
    - cmd/ptz
    - cmd/system
    - health/ai
    - health/bit
    - rt/audio/play
    - state/chassis_basic
    - state/chassis_device
    - state/chassis_motion
    - state/clock
    - state/fence
    - state/link
    - state/pose
    - state/power
    - state/robot
    - state/targets
  p4_agent:
    pub:
    - cmd/approval
    - cmd/arb/{domain}/req
    - cmd/audio/speak
    - cmd/chassis/ctrl
    - cmd/config/ack
    - cmd/estop
    - cmd/fence/ack
    - cmd/geo
    - cmd/mode
    - cmd/motion/intent
    - cmd/payload
    - cmd/ptz
    - cmd/system
    - cmd/task
    - cmd/teach
    - health/ai
    - rt/audio/play
    - state/arb/{domain}
    - state/voice_turn
    sub:
    - audio/broadcast
    - audio/voice_in
    - cmd/audio/speak/ack
    - cmd/chassis/ctrl/ack
    - cmd/estop/ack
    - cmd/fence
    - cmd/motion/intent/ack
    - cmd/motion/relative_move/status
    - cmd/system/ack
    - cmd/voice_text
    - rt/audio/gate
    - rt/audio/lease
    - rt/audio/mic
    - state/approval
    - state/arbitration
    - state/audio
    - state/fence
    - state/geo/manifest
    - state/link
    - state/mode
    - state/pose
    - state/task
    - state/teach

