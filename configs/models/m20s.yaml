# ===========================================================================
# /opt/xbrain_v6/configs/models/m20s.yaml
#   层:L2(机型层) 归属进程:同型号共用(不是某一个进程的私有文件)
#   * 权威定义处:`11` §9.6"静态规格(配置来源)"
#                 + `11` §9.6.1.1"按步态的速度上限表"(gait_limits 的载体)
#
#   本层只许写 common.spec.* . common.motion.*(`10` §5.4.3"加载器合并规则"L2 行).
#      => 顶层必须是 `common:`. 不得照抄 `11` §9.6 样例里的裸 `spec:` 顶层 ----
#        那会出现一个非 common.* 的顶层键,L2 命名空间校验直接拒绝启动
#        (与 `configs/safety/clock.yaml` 头注记的是同一类样例/命名空间不一致).
#
#   未标定的参数一律留 null(="声明键位但未赋值"), 绝不写 0.0 冒充已赋值:
#      `10` §5.4.5 逐字"不得写 0.0 冒充『已赋值』".0.0 会被 §5.4.4 断言 A 判为
#      已赋值而放行,运行期 v_max = min(..., 0) = 0 => 机器人不动且无任何报错,
#      是 fail-silent;null 才表达"未标定",由断言 A 打印出键路径.
#   => 本文件在五项限幅落值前会让整栈按设计[拒绝启动],这是预期行为,
#       不要为了"让它跑起来"而填数.
#
#   * 断言落点(全部由 xbrain-config-freeze.service 求值, 不在各进程内):
#      SP-1 五项 > 0 . SP-2 spec.max_vx_mps >= max(profiles[*].max_mps) .
#      SP-3 spec.* 只允许来自本文件 . SP-9 gait_limits 键集合 == gait 五值闭集 .
#      SP-10 每步态 0 < max_vx_mps <= spec.max_vx_mps
#      ---- 见 `11` §9.6"启动断言"表与 §9.6.1.1"启动断言"表.
#      => 本文件的机器判据在 tests/configs/test_m20s_spec.py, 判定量不抄进本文件.
#
#   * 本文件[不写]`# PROVENANCE:` 标记 ---- 与 `configs/safety/brake.yaml` 形态不同,
#     理由:brake.yaml 头注称该取值域出自"SET-01 护栏 3",而 `SET-01` 在 docs/ 十一册内
#     零命中(本轮 grep 实测,扫描面 = docs/*.md 的十一册正文)=> 取值域本身是悬空约定.
#     => 此处按"册号 + 章节号 + 可 grep 锚点"写来源(CLAUDE.md §1.1 NUM-4),
#      不自造一个新的 PROVENANCE 取值形态(该约定待 CFG-DC-5 由用户裁定).
# ===========================================================================

common:
  spec:

    # -- 机型能力位 ------------------------------------------------------
    # [配置]`11` §9.6 逐字"M20S 支持横移;履带车须为 false".
    # * 消费者不是速度门,而是[能力门]:`12` §4.7.3 TS-4 与 `20` RNS-ROT-3 在
    #   holonomic == false 时把 vy 分量置零并回 E_CAPABILITY;`13` 侧还用它决定
    #   Odometry 协方差 P_yy 是否置 -1.=> 写错的后果是横移被静默丢弃或静默放行.
    # WARN: `13` §12.1 V-50(逐字锚点"小车移动状态")在问 M20 S 是否为轮足机器人;
    #   若是,轮式模式下 holonomic 与 trust_by_gait 都要重估.本行按现行 §9.6 落 true.
    holonomic: true

    # -- 五项整机限幅(`11` §9.6 SP-1 . `12` §12.1 S-1)--------------------
    # 五项[一律 null]:取值卡在 `11` §15 V-01(云深处 2026-07-30 已答
    #   "未测试过最大同时稳定的制动减速度,如关注该项指标可自行测试")+ 我方台架复核.
    #   => 今天没有任何一项有可落地的实测值, 不得凭空填数.
    # 为什么不是 0.0:见头注.另有一条只在本处成立的理由 ----
    #   SP-1 的求值前置条件逐字要求"先判键存在且为数值,再做 > 0 比较",
    #   null 走的是断言 A(报键路径,现场照着补),0.0 走的是 SP-1(报范围违规,
    #   现场第一反应是去改断言).两道门抓的不是同一件事,失效方向也不同.
    # WARN: 与 `10` §5.4.5 的张力(如实登记, 本轮不代裁):该对照表把
    #   max_vx_mps = 2.0(`99` U54 + 云深处答实际最大 2 m/s)与
    #   max_decel_mps2 = 2.5(工作假设,M-22 / T-DECEL)列为"已有依据的两项",
    #   而 `11` §9.6 现行 yaml 与本项判据都要求五项一律 null.
    #   => 本文件按判据留 null;落 2.0 / 2.5 属[取值落地],须主会话拍板.
    max_vx_mps:     null    # Tier1 硬限幅依据;v_max = min(profile, f(), g(), 本键)
    max_vy_mps:     null    # 横移上限;WARN: V-01 三项"仍无依据"之一(Q16b)
    max_wz_radps:   null    # 旋转上限;WARN: 同上
    max_accel_mps2: null    # 加速上限;WARN: 同上
    max_decel_mps2: null    # SP-5 的右操作数:0 < common.safety.brake.a_mps2 <= 本键

    # -- 地形规格(`11` §9.6 terrain 块)---------------------------------
    # 这三项的"零"恰好是有含义的(爬不了任何坡 / 迈不过任何台阶 / 迈不过任何沟),
    #   => 比其他键更容易被读成真值.null 才表达"未标定",由断言 A 报键路径.
    # * 现无消费者;落值时从<山猫 M20 S>产品规格取(硬件开发手册 §1 未给这三项).
    terrain:
      max_slope_deg:     null
      max_step_height_m: null
      max_gap_m:         null

    # -- 里程计规格(`11` §9.6 odom 块)----------------------------------
    odom:
      # null != 0.0,本行是全文件最不能写 0.0 的一处,理由是它有[实测过的失效链]
      #   (`11` §9.6 逐字):0.0 读作"无漂移",是朝乐观方向的默认值,违反 CON-07
      #   "失效方向单调".=> `12` CD-1 判 `== null` 为假 => 强制外环复核不生效;
      #   CD-7 算 err_pred = 0.0 x t_spin = 0 < yaw_tol => CD-2 静置复核也被跳过
      #   => spin(180°) 之后[零航向复核],而实际漂移未知.
      # * 未标定时 P1 必须走 `11` §10.3.3 的保守分支 CD-1~CD-6(强制外环复核).
      # WARN: 实测项:`11` §15 M-09(T7 + 现场).
      yaw_drift_dps: null

      # [实测]不同步态下里程计可信度,逐字抄自 `11` §9.6 odom 块.
      # * 消费者:`12` §4.6.8 CD-6 / N-2 ---- trust_by_gait[gait] < 0.5 => 拒绝相对位移
      #   委托,回 E_CAPABILITY.stair = 0.3 < 0.5 正是"楼梯步态拒绝委托"的来源.
      # WARN: 两处必须写清, 本轮不代裁的事实:
      #   (1) 本键的键空间是[二值粗分](flat / stair), 不是 §9.2.4 的 gait 五值闭集 ----
      #      照 `12` N-2 的写法 trust_by_gait[gait] 直接按 gait 取键,对
      #      basic / platform / stair_agile / stair_standard 四个步态取不到键.
      #      => 该映射关系(哪几个 gait 归 stair)在十一册内没有逐字落点,归 `11` / `12` 裁.
      #   (2) `11` §15 M-09 把 trust_by_gait 与 yaw_drift_dps 一并列为[实测]待测项,
      #      而 §9.6 只把 yaw_drift_dps 改成了 null,本键仍印着取值.
      #      WARN: flat: 1.0 是朝[乐观]方向的(里程计完全可信),与 yaw_drift_dps 留 null
      #      的理由同形.=> 是否也该留 null 属设计裁决,本轮照录 §9.6 现行取值, 不擅改.
      trust_by_gait:
        flat:  1.0
        stair: 0.3

    # -- 按步态的速度上限表(`11` §9.6.1.1 . 收口 `00` NAV-73b)-----------
    # 键集合必须逐字等于 `11` §9.2.4"模式切换指令"表的 gait 五值闭集:
    #   多一个或少一个都拒绝启动(SP-9).少一个的后果不是"少一条限速"而是
    #   GT-3 把该步态永久判为"未知"并常驻 warn;多一个说明配置里有底盘不存在的
    #   步态名,多半是拼错.
    # 取值 2.0 [不是占位符],是云深处对"各步态最大速度"的直接答复本身
    #   (`11` §9.6.1.1 逐字"云深处答:各步态最大速度 2 m/s").
    #   => 全表同值是[已知事实]而不是[没人查过的空白];`gait` 这一归因项在
    #   当前取值下恒不咬住(2.0 == spec.max_vx_mps 的既定依据值),但代码路径存在且可测.
    # 不因"楼梯步态也能跑 2 m/s 与常识有张力"而自行下调 ---- 那会造出一个
    #   文档比实机更严,且无人知道为什么的限速.若 M-26 实测发现楼梯更慢,
    #   只改本表数值与 `11` §9.6.1.1 一个格子,结构与代码不动.
    # * SP-10:对每个步态 0 < max_vx_mps <= spec.max_vx_mps.
    #   WARN: 右操作数今天是 null => 本条被断言 A 先行阻塞,V-01 到位后才真正可比.
    #    不得因此把某个步态写成 0 或 null:0 会让该步态完全不能动且无报错.
    gait_limits:
      basic:          { max_vx_mps: 2.0 }
      platform:       { max_vx_mps: 2.0 }
      flat:           { max_vx_mps: 2.0 }   # * 默认自主巡逻步态(`11` §9.2.3)
      stair_agile:    { max_vx_mps: 2.0 }   # WARN: 待 M-26 实测:楼梯步态是否确为 2.0
      stair_standard: { max_vx_mps: 2.0 }   # WARN: 同上

# * 本层[不写]的东西,写在这里防止后来者塞错地方:
#   . common.motion.profiles(档位表)---- 真源是 L1 `configs/common.yaml`
#     (`10` §5.4.5 对照表 common.motion.profiles 行).WARN: `13` §8.1 的文件分层表
#     另写"m20s.yaml 内容含 speed_profiles / brake / latency",与 `10` §5.4.3 L2
#     允许命名空间及 §5.4.5 的真源列相矛盾 => 归 `13` / `10` 裁,本轮 不照 `13` 落盘
#     (照落会同时踩上 §5.4.5 别名黑名单里的 speed_profiles / latency.total_s).
#   . common.safety.*(t_lat_s / brake.a_mps2 / brake.k / clock.*)---- L3
#     `configs/safety/`,整层自动 locked.
#   . common.calib.*(外参)---- L4b `configs/calib/{robot_id}.yaml`:外参是每台车
#     独有的实测事实,塞进机型层会让一台车的标定污染全部同型号车.
