# File: chitchat.yaml
# Brief: J-class chitchat + out_of_scope presets (16 S11.5, zero-LLM)
#
# Description:
# 18 S12 / 16 S11.5 / CMD-50..54: chitchat replies are PRESETS, never
# LLM free-form (18 S12.1 reason 2: a 3B model hallucinates freely; reason
# 3: a reply occupies the speaker and reveals the robot's position). The
# only value of chitchat is the LIVENESS signal (18 S12.1): a '你好' that
# gets a reply proves the system is alive AND the USB MIC works.
#
# Closed-set consumers (configs/intents.yaml): J01 greeting, J02 identity,
# I05 help (capability overview). out_of_scope is the catch-all fallback
# for a directed phrase beyond capability. After consecutive_threshold
# out_of_scope hits in one session, the capability overview (help.reply)
# is announced proactively (16 S6.7.10 [5] / 18 S12.5).
#
# DIVERGENCE FROM 16 S11.5 (recorded, 2026-08-11): the S11.5 yaml block
# still lists thanks / farewell / weather as separate presets, but 18 S12.3
# CONVERGED the J class to 2 (J01/J02) and moved thanks/farewell/weather
# INTO out_of_scope with reasons. configs/intents.yaml has no such intents,
# so those presets would be dead config with no consumer (CLAUDE.md 9.3,
# no dangling hooks). This file follows the 18 S12 convergence: only the
# presets an actual closed-set intent routes to are kept.
#
# Q-18-2 is deferred (limited LLM free chitchat?) -- default is NOT
# allowed; the executor's allow_llm_freeform stays false. All text is
# ASCII-punct per the 2026-08-11 iron rule; Chinese words stay.

# -- J01 greeting: liveness signal, may vary by time of day. Multiple
# variants (rotated) so it is not rigid; some carry the robot name 海卫
# (party-A identity, see robot_identity below / configs/prompts/system.txt). --
greeting:
  default:
    - "你好,我是海卫"
    - "在的,有什么需要"
    - "您好,我是海卫,请说"
    - "你好,请讲"
    - "我在,海卫随时待命"
  time_variant:
    morning: ["早上好,我是海卫", "早上好,请说"]
    evening: ["晚上好,我在呢", "晚上好,有什么需要"]

# -- J02 identity: party-A robot name 海卫-风息 / model SNARC-HW-001.
# Multiple variants (rotated) so self-introduction is varied, not rigid.
# Base identity is always "海卫, 巡逻机器人". --
identity:
  replies:
    - "我是海卫,场区巡逻机器人,负责巡检和隐患排查"
    - "我叫海卫,型号SNARC-HW-001,负责场区巡逻和现场情况上报"
    - "海卫,一台巡逻机器人,平时负责巡检,发现隐患就上报"
    - "我是巡逻机器人海卫,全名海卫-风息,有什么可以帮您"
    - "我是海卫,负责这片场区的巡逻值守和隐患发现"

# -- I05 help: capability overview (18 S12.3: J03 capability merged here).
# Grounded in the real command classes (A motion / B patrol / G query /
# E ptz / D payload); no capability the robot lacks (weather/door/carry are
# out_of_scope per 18 S12.3). Hot-updatable wording (16 S11.5). --
help:
  reply: "我能巡逻,前往指定地点,查询当前状态和电量,控制云台和补光灯,还能喊话播报.您可以直接下达任务,或问我当前状态"

# -- out_of_scope: directed but beyond capability; guide back to business --
out_of_scope:
  reply: "抱歉,我只能处理巡逻相关的事情.您可以问我当前状态,下达巡逻任务,或者说\"你能做什么\"了解更多"
  consecutive_threshold: 3    # N consecutive out_of_scope -> announce help.reply
