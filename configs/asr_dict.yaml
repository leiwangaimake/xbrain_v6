# File: asr_dict.yaml
# Brief: L6 ASR hotword dictionary content table for P4 (16)
#
# Description:
#   层:L6 内容表 归属进程:P4(ASR 词典)
#   * 权威定义处:`16`
#
#   内容: `exact:` = 16 S3.2 L1 精确替换表 (2-5 字短语, 最长优先, 一遍替换).
#   * 只收[实测出现过]且 L2 管不到的误识 (L2 = 拼音编辑距离, 只纠同音/近音,
#     见 xbrain/p4_agent/asr_post/three_layer.py L2Pinyin). 每条必须写出处
#     (日期 + 现场原文), 不收推测的错字 -- 一条错的替换会在每句话里改错字.
#   * 运行期 p4 每轮检查本文件 mtime, 变了即重载 (16 S3.2 热更新); 重载失败
#     保留旧表并记 ERROR, 不会把正在用的表清空.
#   * 本文件在热更新白名单内(CFG-30).
# ===========================================================================

exact:
  # 2026-10-24 .1.26 现场: 说"关闭爆闪灯", ASR 出"好的关闭共闪灯".
  #   共(gong) vs 爆(bao) 拼音差 3 个字母, L2 不会纠, 故进 L1.
  "共闪灯": "爆闪灯"
  # 2026-10-24 .1.26 录音重放: 说"将照明灯调到最暗", ASR 出"将照平灯口罩罪案".
  #   平(ping) vs 明(ming) 只差 1 个字母, 但 L2 的目标是 D/E 类关键词整词
  #   ("打开照明灯" / "关闭照明灯" ...), 单独的"照明灯"不是关键词; 句中没有
  #   "打开/关闭"时没有可对齐的窗口, L2 不会纠 (2026-10-25 实测: "照平灯" 与
  #   "将照平灯口罩罪案" 经 L2 原样输出, "打开照平灯" 则被纠). 故进 L1.
  "照平灯": "照明灯"
