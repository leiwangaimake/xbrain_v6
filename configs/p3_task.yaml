# File: p3_task.yaml
# Brief: L6 per-process config for xbrain_task P3 (15 S12)
#
# Description:
#   层:L6(进程私有) 归属进程:`xbrain_task`(P3)
#   * 权威定义处:`15` §12
#
#   本文件当前是[空骨架]---- 一个键都没有, 本轮未凭空填任何配置值.
#   * 落值时逐键去权威节抄, 不得从本文件或任何别处推断默认值:
#     10 §5.4.2 R-3 逐字"不提供默认值语法......解析不到即 E_CONFIG_INVALID 拒绝启动".
#   未标定的参数留 null(="声明键位但未赋值"), 绝不写 0.0 冒充已赋值.
#   L6 只[取值]不[定义]: 不得出现 common 顶层键,共享值一律写 ${common.xxx}
#     (10 §5.4.2 R-6 / R-1;违反即被 §5.4.4 断言 B 判"疑似复制"而拒绝启动).
#   文件名是 `p3_task.yaml`(乙-I1 已裁), 不是 `task.yaml`.
# ===========================================================================

# TODO(`15` §12):按该节逐键落值.本文件在落值前会让整栈按设计拒绝启动,这是预期行为.

# -- 地理原点 (取值, 非定义) ------------------------------------------------
#   P3 是 FenceSet 的组装者(11 S9A.2), 而该结构的 enu_origin 是[必填]字段:
#   "本地 ENU 平面的锚点, 全系统唯一, 来自 common.geo.enu_origin(L4
#   configs/sites/{site_id}.yaml)". 在此之前 p3 从不读配置(本文件是空骨架),
#   于是 build_fence_set 的 enu_origin 形参一直取默认 None, cmd/fence 上
#   这个必填字段恒为 null -- 下游拿不到投影锚点, HMI 有几何数据也画不出来,
#   而 FV-7(顶点距原点 <= 20km)更是连判据都无从谈起.
#
#   NO 不在本文件写坐标值: 11 第 7815 行逐字"各进程不得各自选原点", 单一来源
#   是 L4 场地层. 这里只写引用, 值由冻结线展开.
#   写法: 引用[逐个叶子标量], NO 不能引用整个 mapping.
#   refs.py 的查找在 flatten() 之后的键表上做, 而 flatten 把 mapping 拆成叶子:
#   common.geo.enu_origin 本身不是键, 只有 .lat/.lon/.alt 三个是. 直接引用整个
#   对象会撞 R-3 unresolvable. 既有的 p2_core.yaml 引用 calib 也是这个写法
#   (${common.calib.frames.ptz_base.h_camera_m}).
geo:
  enu_origin:
    lat: ${common.geo.enu_origin.lat}
    lon: ${common.geo.enu_origin.lon}
    alt: ${common.geo.enu_origin.alt}

# -- 录制 (teach) -----------------------------------------------------------
#   * 权威定义处: `15` §12 teach 段; 定值理由见 `18` §0.4.1 PS-6.
#   snap_max_age_ms: 单点录制(F06/F10)随指令携带的位置快照 pose_snap 的最大龄期
#   (首字时刻 -> P4 发出). 超龄回 E_TEACH_QUALITY(item=snap_age), 绝不回退读当前位置.
#   8000 = T4 最坏解析 4.8 s + L1b 播报窗 2.5 s + 裕度, 待现场整定.
teach:
  snap_max_age_ms: 8000
  #   99 U132: 采点规则 (11 S12A.6, U42) 的两个值, 真源在 common.recording.
  #   每 1/sample_hz 秒试采一次; 与上一采样点距离 < min_dist_m 不写库.
  #   缺失 / null / <= 0 时 p3 拒绝启动 (EX_CONFIG 78) 并报本键路径;
  #   代码里没有缺省值 (CLAUDE.md 3.1 同一纪律).
  min_dist_m: ${common.recording.min_dist_m}
  sample_hz: ${common.recording.sample_hz}
  #   99 U162: 一次录制最长多久 (s), 真源 common.recording.session_timeout_s;
  #   到时按开始时的名字自动保存. 录制唯一的限制 (不再有点数上限).
  #   键名不能用 session_timeout_s / max_duration_s (10 S5.4.5 别名黑名单).
  #   缺失 / null / <= 0 时 p3 拒绝启动 (EX_CONFIG 78).
  record_duration_s: ${common.recording.session_timeout_s}
  #   99 U163 (用户 2026-11-11): 到时前多少秒语音提醒剩余时间 (录制中或暂停中,
  #   每次录制每档只提醒一次), 同时发 event/info/teach 上云. 每个值须 > 0 且
  #   < record_duration_s; 缺失 / 空 / 越界时 p3 拒绝启动 (EX_CONFIG 78).
  record_warn_before_s: [600, 60]
  #   ~~99 U176 fence_speed_limit_mps: null (录限速区域围栏用的限速, null 拒录)~~
  #   被替代 (2026-11-12 ~ 2026-11-13): 见下面 fence 段 (99 U185).

# -- 围栏限速值 (99 U185, 用户 2026-11-13) ---------------------------------
#   限速区域围栏的区内限速分三级, 高者优先:
#     1. 该区自带的值 (云端随区域下发 speed_limit_mps);
#     2. 云端下发的统一值 (cmd/geo set_fence_defaults, 存 fence.db, 重启有效,
#        可覆盖, 可删除);
#     3. 下面的 speed_limit_default_mps. 用户裁决: 云端没下发 (缺损) 时为 0.6.
#   这是用户裁决的值, 写在配置里而不是代码里 (CLAUDE.md 3.1 同一纪律).
#   min / max 是云端下发值的合法范围, 超出拒绝 (E_GEO_INVALID).
#   三个键缺失 / null / <= 0 / min > default / default > max 时 p3 拒绝启动 (EX_CONFIG 78).
fence:
  speed_limit_default_mps: 0.6
  speed_limit_min_mps: 0.1
  speed_limit_max_mps: 2.0
  # 99 U191 (用户 2026-11-13 裁决 "1 平方米"): 围栏面积下限, 平方米. 录制保存与
  # cmd/geo 写入 (云端 / 语音 / HMI) 同一个值, 所有类型的围栏都适用 (11 S9A.2
  # FV-5). 低于它不保存, 不下发 (E_FENCE_INVALID, reason area_too_small).
  # ~~11 S12A.7 / FV-5 原写默认 100 m^2 (待现场)~~ 由本裁决取代.
  # 缺失 / null / <= 0 时 p3 拒绝启动 (EX_CONFIG 78).
  min_area_m2: 1.0

# -- 路径推送 (取值, 非定义) ------------------------------------------------
#   示教录制的路径是模式 B 密集折线, 没有逐点到点半径; 15 S2.4.3 规定取
#   common.recording 侧的全局值 (99 U126, 用户 2026-11-05 定 1.0 m).
#   缺失 / null / <= 0 时 p3 拒绝启动 (EX_CONFIG 78) 并报本键路径.
route:
  recorded_arrive_radius_m: ${common.recording.arrive_radius_m}
  #   航点到某条路径折线(线段, 不只是录制点)的距离 <= 本值, 即属于该路径;
  #   去该航点时先就近入路径, 沿路径走到离航点最近处再直走过去 (99 U127,
  #   用户 2026-11-05 定 5 米). 归属关系实时计算, 不存表. 值在 common.geo,
  #   P4 的路径/航点查询引用同一个键 (99 U130), 两边判定永远一致.
  #   缺失 / null / <= 0 时 p3 拒绝启动 (EX_CONFIG 78).
  membership_m: ${common.geo.route_membership_m}

# -- 定位失效 (11 S3.3.4, 99 U142) -------------------------------------------
#   用户 2026-11-06 裁决: 只有 single / no_fix (及无定位) 才算定位失效;
#   rtk_fixed / rtk_float / dgps 照常作业 (后两者 P1 限速 0.5 m/s).
#   失效持续 lost_sustain_s 后: 挂起当前任务 (passive / rtk_degraded, 撤销 P1
#   路线), 暂停派发, 拒收新任务, 发 event/alarm/rtk; 可用定位持续
#   recover_sustain_s 后发 event/info/rtk, 任务不自动续跑 (RL-7).
#   取值即 11 S3.3.3 的 fix_lost 1.0 s / 恢复 2.0 s (工程缺省, 待 T7 标定).
#   缺失 / null / <= 0 时 p3 拒绝启动 (EX_CONFIG 78).
rtk_loss:
  lost_sustain_s: 1.0
  recover_sustain_s: 2.0

# -- 低电回充 (99 U146 / U154 / U157, 用户裁决 2026-11-05 / 11-06 / 11-10) ------
#   soc_pct 低于 trigger_soc_pct: 单次语音报警 + 每 cloud_alarm_period_s 秒向
#   云端上报一次 (持续, 结束条件见下方 U157; 换电 = 某电池槽拔出后重新在位,
#   99 U154); 速度不降 (U117 的 x0.3 已去掉);
#   (旧注释 "直到充电或换电才关闭, 换电门槛 = trigger_soc_pct, 不另设配置项"
#    已被 U157 取代, 2026-11-06 ~ 2026-11-10);
#   导航到最近的 [在某条路径 route.membership_m 内的] 充电桩/充电站航点, 没有则
#   去返航终点站; 续航 remain_mile_km 不够走到也照走, 上报 unreachable;
#   soc_pct 降到 stop_soc_pct 及以下: 停止并趴下, 不再向目标充电点走, 告警继续.
#   99 U172 (用户裁决 2026-11-12): stop_soc_pct 由 5 改为 10 -- 剩余电量走到
#   10 % 就停住, 不再向目标充电站走 (旧值 5, 2026-11-05 ~ 2026-11-12).
#   99 U171 (用户裁决 2026-11-12): 低电或充电中断阶段, 未充电, soc_pct >= trigger_soc_pct
#   且比本轮低电不充电时的最低电量高 >= cold_swap_min_rise_pct, 按换电分档结束
#   (11-11 21:41 热换电 14 -> 100 一步跳变, 在位规则没抓到, 告警刷到 22:51).
#   99 U157 (用户裁决 2026-11-10): 底盘报告充电不再结束低电, 而是转为"充电中"告警
#   (同样每 cloud_alarm_period_s 秒上报), 直到 soc_pct 达到 charge_full_soc_pct
#   才结束; 换电后 soc_pct 不低于 swap_resume_soc_pct 立即结束. 低电期间被打断
#   的任务, 以及低电开始时已在排队 / 定时的任务, 只有结束后才自动恢复 / 派发
#   (人工"继续"不受限). 换电后 soc_pct 在 trigger 与 swap_resume 之间: 告警结束,
#   被打断的任务等人工"继续". 底盘最高只报到 99 % 时把 charge_full_soc_pct 调低.
#   另 (99 U157 补齐 2026-11-11): 底盘报告充电且 soc_pct < charge_full_soc_pct 时,
#   不论有无低电记录, 被抢占的任务都不自动恢复; P3 从记录恢复出低电阶段后首个
#   soc_pct >= trigger_soc_pct, 未充电, 且比记录电量高 >= cold_swap_min_rise_pct,
#   按关机期间换电 (冷换电) 分档结束; 重启时回充任务已失效则重派 (读到电量与定位
#   之后); 低电期间断链返航任务暂缓, 回充任务可抢占同为 95 的断链返航; 再次进入
#   低电阶段时当时所有未终结任务并入暂缓名单, 并再播报一次. 充电与拔电都按
#   plug_confirm_s / unplug_confirm_s 去抖.
#   九个键任一缺失 / null / NaN / <= 0, 或不满足 stop < trigger < swap_resume <= charge_full <= 100
#   时 p3 拒绝启动 (EX_CONFIG 78).
low_battery:
  trigger_soc_pct: 20.0
  stop_soc_pct: 10.0
  cloud_alarm_period_s: 2.0
  charge_full_soc_pct: 100.0
  swap_resume_soc_pct: 80.0
  # 99 U157 (2026-11-11): 电池槽连续空着至少这么多秒, 再插回才算一次换电;
  # 更短的空缺视为在位信号抖动, 忽略. 按插回那一刻的 soc_pct 判定.
  swap_absent_min_s: 5.0
  # 99 U157 (2026-11-11): P3 重启后恢复出低电阶段, 首个 soc_pct 比记录里的电量
  # 至少高出这么多个百分点, 才算关机期间换电 (冷换电); 防 19 -> 20 的抖动误判.
  # 99 U171 (2026-11-12): 同一阈值也用于运行中的回升判换电 (比本轮最低不充电电量高这么多).
  cold_swap_min_rise_pct: 10.0
  # 15 S8.5 CD-1 (99 U157 2026-11-11 采纳): 充电标志去抖. 连续 charging 为真这么多秒
  # 才算开始充电; 连续为假这么多秒才算拔掉. 15 文档建议值, 待 T-CHG-3 实测抖动特性.
  plug_confirm_s: 5.0
  unplug_confirm_s: 5.0
