# File: common_sim.yaml
# Brief: [sim] overlay for common.yaml -- dev / SIL stand-in values for the null leaves (10 S5.4.7)
#
# Description:
#   [sim] variant of common.yaml (10 S5.4.7, user ruling 2026-09-12). An OVERLAY:
#   only keys that are null in common.yaml may appear here, and only with values
#   the simulation / dev stack needs to boot (they were the CHK-0-56 fixture's
#   NULL_OVERRIDES until 2026-09-12). Applied by the freeze line ONLY with
#   --variant sim; the production unit never selects it. A key that later lands a
#   real value in common.yaml must be REMOVED here (tests/configs pins that),
#   otherwise the stale sim value shadows the real one -- exactly how patrol
#   1.5 m/s hid the landed 2.0 m/s on 2026-09-12.
#   Layer rule: L1 may write any common.* except common.safety.* (ENV-2).
#   motion.profiles.*.max_mps are NOT here: landed in common.yaml (2026-09-10).
#   qos.bindings: the four-row dev set the CHK-0-56 fixture always used, NOT the
#   full 11 S2.4.7 table -- that table's 'rt/** -> Q3_cmd' row is refused by
#   freeze assertion F (a5_block_on_rt); the contract-vs-F conflict is a
#   pre-existing item, registered in NEXT.md, not settled here.
#   CORRECTION 2026-09-30 (iron rule 1): the sentence removed from here claimed
#   tests/common/zenoh test_fixture_bindings_are_verbatim "is red for the same
#   reason". It is not. That case compares the json5 block in docs/11 S2.4.7
#   against the golden fixture only -- it never evaluates assertion F and never
#   reads this file, and the 'rt/** -> Q3_cmd' row is present on both sides. Its
#   red was a transcription drift (the contract gained rt/perception/status ->
#   Q2_state and the fixture had not followed); fixed 2026-09-30, measured: 54
#   cases green, and 10 red again when the row is taken back out. Do NOT cite
#   that case as evidence for the F conflict -- the conflict is still open, but
#   nothing in that test file bears on it.
#
common:
  # audio.bypass_keywords: 已从本变体移除 (2026-09-21). 真机文件已落值 (三组并集,
  #   用户裁决), 而变体只许填真机文件里为 null 的键 (10 S5.4.7) -- 且此前这里
  #   的形状 (扁平三词) 与 16 S4 的三组形状不一致, 本就不该被任何测试消费.
  # 2026-10-01 订正: 2026-09-21 那次只删掉了 bypass_keywords 这一行, 把父键
  #   `audio:` 留在原处. yaml 把只带注释的键读成 null, 于是本变体声明了一个
  #   `common.audio: null` 的裸键 -- VAR-2 的 null_value 一档, 即
  #   tests/configs/test_config_variants.py 报的那一条. 变体的语义是 [填值],
  #   一个 null 什么也不填: 它既不覆盖真机值, 又让 _leaves() 把这一支算作本
  #   变体赋了值的叶子. 所以键名整条降为注释, 保留痕迹但不再进 yaml 树.
  calib:
    calib_rev: unspecified
    frames: {}
    gate: {}
    lat_err_ref_m: 0.05
  # cmdset 四键 . db 四库与 pragma 三键: 已从本变体移除 (2026-09-29). 真机文件
  #   已按 16 S12.4 / S14 与 15 S9.0 / S9.1 落值, 而变体只许填真机文件里为 null
  #   的键 (10 S5.4.7 VAR-2), 留着即 shadow.
  #   移除时顺带带走了三处本变体自己的偏差, 逐条记下来, 它们都不是等价替换:
  #     1. missions_dir 本变体写 /opt/xbrain_v6/configs/missions, 而 16 S14 逐字是
  #        /opt/xbrain_v6/configs/prompts/missions/ -- 前者在仓库里不存在, 即
  #        --variant sim 跑出来的产物指向一个空目录;
  #     2. pragma.synchronous 本变体写 FULL, 而 15 S9.1 的连接级缺省逐字是 NORMAL
  #        (FULL 是 FS-a ~ FS-f 六类写逐事务提升, 走另一个 writer 连接, 不是缺省档);
  #     3. 四个库路径本变体写 data/<name>.db, 而代码常量与现网都在 data/run/ 下.
  #   cmdset.version 的 v1.0-sim 不再需要: 真机值 1.0.0 取自 16 逐字, 仿真没有
  #   要与之区分的理由(本键是标签, 不进任何判定).
  fence:
    margin_by_fix:
      dgps: 1.5
      rtk_fixed: 0.5
      rtk_float: 1.0
      single: 3.0
    predict_dt_s: 0.45         # 12 S7.3: t_lat_s 0.4 + one 20 Hz tick (S-4a lower bound)
    soft_margin_min_m: 2.0     # 11 S9A.6 declared floor of the soft band
  motion:
    profiles:
      obstacle_avoid:
        require_sense_m: 0.3
        sensors:
        - lidar
        - rgbd
        up_enter_mps: 0.4
      patrol:
        require_sense_m: 1.0
        sensors:
        - lidar
        - rgbd
        - odom
        up_enter_mps: 1.2
  priority:
    task:
      auto: 30
      charge: 80
      cloud: 60
      local: 40
      wecom: 50
  qos:
    bindings:
    - match: xbrain/*/cmd/estop
      profile: Q0_safety
    - match: xbrain/*/probe/estop/**
      profile: Q0_safety
    - match: xbrain/*/rt/**
      profile: Q1_rt
    - match: xbrain/*/**
      profile: Q3_cmd
    profiles:
      Q0_safety:
        congestion_control: drop
        express: true
        handler:
          depth: 8
          kind: ring
        priority: real_time
        reliability: reliable
      Q1_rt:
        congestion_control: drop
        express: true
        handler:
          depth: 1
          kind: ring
        priority: real_time
        reliability: best_effort
      Q2_state:
        congestion_control: drop
        express: false
        handler:
          depth: 4
          kind: ring
        priority: data_high
        reliability: reliable
      Q3_cmd:
        congestion_control: block
        express: false
        handler:
          depth: 256
          kind: fifo
        priority: data
        reliability: reliable
      Q4_stream:
        congestion_control: drop
        express: false
        handler:
          depth: 0
          kind: ring
        priority: interactive_high
        reliability: best_effort
  recording:
    fence_close_tol_m: 1.0
    max_fences: 5
    min_dist_m: 0.5
    sample_hz: 1.0
    session_timeout_s: 300.0
  retention:
    command_log_days: 180
    event_days: 90
    task_days: 30
  robot_id: dev
  site_id: sim
  zenoh:
    # gen_connect / rt_endpoint: 已从本变体移除 (2026-09-29). 真机文件已按
    #   10 S5.4.5 左列与 11 S1.1.2 / S1.1.4 落值(同值), 留着即 shadow.
    #   gen_listen 留在这里: 真机文件仍为 null(站点网段未冻结, 见该键注释),
    #   而 SIL 台架只需要一个回环口就能起 router.
    gen_listen:
    - tcp/127.0.0.1:7447
