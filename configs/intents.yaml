  query_ptz_preset: { id: G35, keywords: ["在哪个预置位", "现在是几号位"], slots: [], route: fastpath, auth: L0 }
  query_ptz_presets: { id: G36, keywords: ["有哪些预置位", "能看哪几个方向"], slots: [], route: fastpath, auth: L0 }
  query_ptz_owner: { id: G37, keywords: ["云台谁在控", "我为什么转不动云台"], slots: [], route: fastpath, auth: L0 }
  query_fences: { id: G38, keywords: ["有哪些围栏", "都设了什么围栏"], slots: [], route: fastpath, auth: L0 }
  query_active_fence: { id: G39, keywords: ["现在用的哪个围栏", "生效的是哪个"], slots: [], route: fastpath, auth: L0 }
  query_fence_health: { id: G40, keywords: ["围栏还管用吗", "保护降级了吗"], slots: [], route: fastpath, auth: L0 }
  query_fence_relation: { id: G41, keywords: ["我在围栏里吗", "离边界还有多远"], slots: [], route: fastpath, auth: L0 }
  query_fence_detail: { id: G42, keywords: ["围栏什么情况", "围栏多大"], slots: [fence], route: fastpath, auth: L0 }

  # -- H 系统 (H01/H03 carry auth_by_slot; see header) --
  run_bit: { id: H01, keywords: ["做个自检", "自检一下", "检查系统", "做个深度自检", "全面检查一遍"], slots: [scope], route: fastpath, auth: L1a, auth_by_slot: { scope: { quick: L1a, deep: L2 } } }
  generate_report: { id: H02, keywords: ["报告", "汇报", "说说情况"], slots: [scope, date_range], route: llm, auth: L1a }
  set_time_sync: { id: H03, keywords: ["校时", "同步时间"], slots: [force_step], route: fastpath, auth: L1b, auth_by_slot: { force_step: { false: L1b, true: L2 } } }
