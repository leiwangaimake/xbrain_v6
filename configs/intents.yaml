  query_speaking: { id: G30, keywords: ["在喊话吗", "还剩几遍", "喊的哪条"], slots: [], route: fastpath, auth: L0 }
  query_speak_presets: { id: G31, keywords: ["能喊哪些", "有哪些预设语句"], slots: [], route: fastpath, auth: L0 }
  query_ptz_pose: { id: G32, keywords: ["云台朝哪", "现在看哪边"], slots: [], route: fastpath, auth: L0 }
