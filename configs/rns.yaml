# File: rns.yaml
# Brief: L6 per-process config for RNS module in xbrain_motion (12 S12.0A)
#
# Description:
#   层:L6(进程私有) 归属进程:`xbrain_motion`(P1) 内的 RNS 模块
#   * 权威定义处:`12` §12.0A(rns.yaml 唯一定义处, #20-3);逐键消费侧语义见 20 对应节
#   * 全仓唯一 rns.yaml(用户 2026-09-10 裁决: SIL 与实机同读本文件, 不允许副本)
#
#   [2026-09-10 SIL 仿真整定落值] 原骨架全 null; 本轮按 SIL 软件在环仿真整定
#   逐键落值, 依据三类(逐行注明): [doc]=文档默认/例值; [geo]=几何推导
#   (M20S 车体 0.82x0.43m, r_eff 取 0.5; 338Le FOV 90deg/盲区 0.59m);
#   [sim]=仿真合理值, 实机需按 #20-4/#20-5 标定复核.
#   D2 约束自检: wall_follow.leave_progress_m 0.4 < 2*r_eff 1.0 (A-CVG-5 过).
#
#   启动断言(config.py, RnsSource 构造时强制): D2 + person 锁死(A-CLS-4);
#   person 不在 class_map(锁死 person_stop, 配置改它即拒启).
# ===========================================================================

rns:
  route:
    lookahead_k: 1.0               # [sim] L = clamp(k*v, min, max)  (20 S2.2)
    lookahead_min_m: 1.0           # [sim] 低速最小前视
    lookahead_max_m: 3.0           # [sim] 高速前视上限
    search_window: 30              # [geo] 0.5m 点距 x30 = 15m 窗, 远超单拍位移 (20 S2.6)
    max_deviation_m: 10.0          # [doc] 用户 2026-09-07 指定默认值  (20 S2.7)
    align_dist_m: 5.0              # [doc] 用户 2026-09-07 指定默认值  (20 S2.5)
    arrival_radius_m: 0.8          # [sim] 到达半径; RTK cm 级下米内合理 (20 S2.5)
    yaw_tol_deg: 10.0              # [sim] 到点航向容差 (20 S2.5 双条件)
    arrival_radius_float_scale: 2.0  # [sim] FLOAT dm 级误差放大 2 倍 (20 S3.2.1)
    k_yaw: 1.5                     # [sim] 对准 P 增益 (20 S2.5)
  speed:                           # 统一系数族 g(x; x0, x1, g_min)  (20 S8.1A)
    dev_e0_m: 0.5                  # [sim] 偏差压速起点
    dev_g_min: 0.15                # [sim] 偏差压速下限系数
    gap_g_min: 0.3                 # [sim] 穿缝最紧时的速度系数
    unk_r0: 0.2                    # [sim] UNKNOWN 占比压速起点
    unk_r1: 0.6                    # [sim] UNKNOWN 占比压速饱和点
    unk_g_min: 0.3                 # [sim] UNKNOWN 压速下限
    align_eta: 0.8                 # [sim] 对准段可行性余量 (<1, 20 S2.5)
    rtk_float_g: 0.5               # [sim] FLOAT 降速系数 (<1, 20 S3.2.1)
  dynamic:
    stop_dist_m: 3.0               # [doc] 用户 2026-09-07 指定默认值  (20 S5.3)
    resume_dist_m: 4.0             # [sim] 必须 > stop_dist (A-DYN-2 迟滞带)
    v_static_thresh_mps: 0.1       # [sim] 静止判据速度阈 (20 S5.5)
    t_static_dwell_s: 2.0          # [sim] 静止判据驻留时长
    wait_budget_s: 20.0            # [sim] 停等预算 (20 S5.3A RNS-N-16)
  watchdog:
    window_s: 20.0                 # [sim] T_w; 8s 对起步转向/绕行 s 停滞太短(实测误报), 20s 覆盖正常停滞段 (20 S7.3A)
    min_progress_m: 0.5            # [sim] delta_w: 一个点距量级
  clearance:
    margin_by_class:               # [geo] 分类型安全余量 (20 S5.6, U54 1m 单向折入)
      vehicle: 0.5
      hazard: 0.6
      unknown_geom: 0.4
      structure: 0.3
      small_object: 0.2
    gate_saturate_ratio: 2.5       # [sim] 宽度收益饱和点 (20 S6.3 RNS-N-10)
  cost_weights:                    # [sim] 候选代价五权重 (20 S6.4)
    clearance: 2.0
    angle: 1.0
    length: 0.5
    unknown: 1.5
    hysteresis: 0.8
  candidate:
    edge_jump_m: 1.0               # [sim] 剖面跳变阈值 (20 S6.1)
    subgoal_extra_m: 0.3           # [sim] clear 富余项 (20 S6.1 v1.11)
    side_hold_ticks: 5             # [sim] 换候选迟滞 5 拍 = 0.25s (20 S6.6)
  wall_follow:
    d_wall_m: 1.0                  # [geo] 保距 = r_eff 0.5 + 0.5 余量; 0.8 时体距墙 0.34 会被记忆栅格 0.25 粒度误差蚀穿(2026-09-10 车角擦碰实测), 余量须 > cell_m (20 S7.7)
    kp_wall: 1.2                   # [sim] 保距 PD
    kd_wall: 0.05                  # [sim] 栅格粒度 0.25m 下 rate 噪声大, kd 压低
    sector_lo_deg: 45.0            # [geo] 侧扇区界 (FOV 90deg 的侧半)
    sector_hi_deg: 135.0
    front_stop_m: 1.35             # [sim] 凹角前向停距 (20 S7.7-3); 约束: 必须 > 宿主速度门 f() 切零线 1.25(12 S6.2 第四段下界), 否则 front 在 [front_stop, 1.25) 死区里 RNS 继续 PD 而宿主钳零 => 贴墙原地摆头永卡(2026-09-10 记录仪实测)
    e_ok_m: 0.3                    # [sim] 回折线判据 (20 S7.3 (1))
    leave_progress_m: 0.4          # [geo] (2)' delta_s; < 2*r_eff=1.0 (D2/S-7 过)
    min_loop_m: 3.0                # [sim] 失败判据(1) 防刚上墙误判
    no_progress_m: 40.0            # [sim] 失败判据(2); 须 > 最大预期绕障周长 -- U 形 ~20m 后又遇 17m 车墙绕行 ~30m(2026-09-10 实测 25 误报), 本质是场景尺度依赖的兜底, 上限由 max_follow 60 收口
    max_follow_m: 60.0             # [sim] 失败判据(3) 兜底
    v_max_mps: 0.5                 # [sim] 贴墙限速
  backup:
    t_backup_memory_s: 3.0         # [sim] 记忆新鲜度上限 (20 S7.5 RNS-N-13)
    max_backup_m: 1.0              # [sim] 后退距离上限
    v_max_mps: 0.2                 # [sim] 后退限速
  memory:
    ttl_static_s: 300.0            # [sim] 静态记忆 TTL; 任务期量级(20 S4A.4): 一次出勤内连发点单共享记忆(G3), 远盖 U 形绕行 ~40s; 幽灵防护靠 A-MEM-3 跳变清空与动态短 TTL
    ttl_dynamic_s: 2.0             # [sim] 动态记忆 TTL (幽灵防护)
    cell_m: 0.25                   # [geo] 分辨率 = r_eff/2 (20 S4.2.1)
    radius_m: 8.0                  # [geo] 滑动窗 > range_max 6m
    reset_jump_m: 1.0              # [sim] 位姿跳变清空阈值 (A-MEM-3)
  guidance:                        # 记忆引导规划层 (20 S4A, v1.24 立项)
    coarse_cell_m: 0.5             # [geo] 规划格 = 2x 记忆格 0.25 (S4A.5)
    domain_margin_m: 15.0          # [sim] 任务包围盒外扩裕量
    domain_cap_m: 60.0             # [sim] 规划域边长上限
    unknown_cost_factor: 2.5       # [sim] attempt 模 UNKNOWN 代价 kappa (S4A.3)
    nodes_per_tick: 150            # [sim] 每拍搜索节点配额; 确定性(非墙钟). Jetson 实测: 400 时建场拍 P99 42ms 挤占 P1 循环 60ms 红线; 150 时 P99 ~17ms, 建场仍 <1s 远快于 replan_period
    replan_period_s: 2.0           # [sim] 周期重规划兜底 (G2 改截断精确触发)
    guide_lookahead_m: 4.0         # [sim] R* 前瞻距离 (S4A.5)
  health:
    invalid_ratio_limit: 0.35      # [sim] RNS-I-2 强制限速阈 (20 S3.1.8)
  perception:
    seg_stale_ms: 300              # [doc] 与 T-50 同量级 (20 S3.1.11)
    no_seg_speed_cap_mps: 0.5      # [sim] 仅几何 FREE 时限速
    seg_recover_frames: 5          # [sim] T 通道恢复确认帧数
    raw_velocity_policy: reject    # [doc] 本期唯一合法值 (20 S3.1.5)
  class_map:                       # class_name -> 行为类; person 锁死在代码 (20 S5.1.1)
    car: vehicle_dynamic
    truck: vehicle_dynamic
    bus: vehicle_dynamic
    motorcycle: vehicle_dynamic
  follow:                          # 预留段, 本期无运行期消费者 (20 #20-13)
    target_min_dist_m: 1.0         # [doc] 用户 2026-09-07 指定默认值
    lost_extrapolate_s: 1.0        # [sim] 预留
    lost_timeout_s: 3.0            # [sim] 预留
    reacquire_min_frames: 5        # [sim] 预留
