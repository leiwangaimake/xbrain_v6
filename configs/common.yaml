# File: common.yaml
# Brief: L1 shared namespace -- sole definition site for common.* (10 S5.4.5)
#
# Description:
#   层: L1 (共享命名空间的唯一定义处) 归属进程: 无归属 (全部进程经 freeze 读快照)
#   键位清单的真源: 10 S5.4.5 "共享参数唯一定义处对照表" -- 该表[左列]逐行
#     给出的 common.* 路径, 就是本文件必须声明的键位集合 (10 S5.4.4 断言 M 逐字:
#     "清单 = S5.4.5 对照表的全部左列").
#   层允许面: 10 S5.4.3 L1 行逐字 "只能是 common.*, 出现其他顶层键即拒绝".
#
#   本文件是[键位骨架]: 左列每个路径在这里都有键位, 值[一律 null].
#   为什么不"能填的先填":
#     - 本轮交付的是键位, 不是取值. 取值分别卡在 11 V-01 (五项限幅) /
#       M-22 与 T-DECEL (制动减速度) / U-01 (enu_origin 现场标定) /
#       M-24 (calib 门限) / U-15 与部署 (通用面网口地址) 上, 逐条见各段注释.
#     - 10 S5.4.2 R-3 逐字 "不提供默认值语法 ... 解析不到即 E_CONFIG_INVALID
#       拒绝启动". null 的语义是"声明键位但未赋值": 它让启动断言 A 报出[键路径],
#       而键整个缺失则由断言 M 报出[缺在哪一层]. 两者抓的不是同一件事, 少了 A
#       退化成一条范围报错, 少了 M 退化成"L0 默认值兜住, 整栈照常启动".
#     - 因此本文件在落值前会让整栈按设计拒绝启动, 这是预期行为, 不是缺陷.
#
#   三条写法禁令, 每条都是本项目实测过的坑:
#     1. 未标定的参数一律 null, 绝不写零值冒充"已赋值". 零值会被断言 A 判为已赋值
#        而放行, 运行期 v_max = min(..., 0) = 0, 机器人不动且无任何报错 (fail-silent,
#        比 fail-safe 差一个量级; 10 S5.4.5 spec 行逐字, CLAUDE.md 3.1).
#        同理: 空列表与空映射也是"已赋值", 不得拿来当占位符 -- 一个"监听空列表"的
#        通用面 router 和一个没配的 router 长得一样, 但前者不报错.
#     2. 唯一定义处不在本文件的键 (下面逐段标注), 在这里[只声明键位, 不落值].
#        两个文件各写一份值, 正是 10 S5.4.4 断言 B 要拦的"疑似复制".
#     3. 不得用 YAML 锚点 & / * 表达共享 (10 S5.4.2 R-7). 锚点不跨文件, 却给人
#        "已经共享了"的错觉, 且与 ${} 引用轴两套机制并存.
#
#   本文件[不]做什么:
#     - 不写任何进程私有键. 进程私有键在 L6 的 {proc}.yaml 里, 只能引用不能定义.
#     - 不写 10 S5.4.5 的[反例]arbitration.priorities (P1 七个运动源的优先级).
#       它只有 P1 一个读者, 留在 p1_motion.yaml; 与 14 S11 的资源域仲裁同名不同物,
#       合并进 common 只会制造更大的混乱.
#     - 不做类型与范围校验. 那是 freeze 的 schema 校验与启动断言 G 的活.
# ==========================================================================

common:

  # -- 标识 ----------------------------------------------------------------
  # robot_id: 唯一定义处就是本文件顶层 (可被 XBRAIN_ROBOT_ID 覆盖, L5 白名单三项之一).
  #   用于填 Zenoh key 的 {rid} 段, 全部进程读. 权威: 11 S2.1.
  #   现无任何 yaml 定义它而各处默认"存在" -- 10 S5.4.5 该行的现状列逐字如此,
  #   本行就是补上那个键位.
  robot_id: null

  # site_id: 唯一定义处是 sites/{site_id}.yaml, 文件名即值 (L4).
  #   本文件只声明键位, 不落值; 落值见 CFG-CF-7.
  site_id: null

  # -- Zenoh 端点 (10 S5.4.5 zenoh 两行; 权威 11 S1.1.2 / S1.1.4 / NET-C9) --
  zenoh:
    # rt_endpoint: RT 面 router 的地址, RT 面封闭集 9 个进程 (11 S1.1.3 R-3) 与
    #   zenohd -l 启动参数共用同一个值. 现状是硬编码在 11 正文与 systemd 脚本两处,
    #   本键位存在的意义就是把那两处收成一处.
    #   TODO(11 S1.1.2): 落值时逐字抄该节, 不要凭记忆写端口号.
    rt_endpoint: null

    # gen_listen: [列表, 不是标量]. NET-C9 要求逐口显式绑定并禁用通配绑定,
    #   所以它是一组逐口地址 (LAN2 / WIFI / 本机回环), 键的形状随之由标量改列表.
    #   TODO(U-15 与部署): 网口地址由 deploy/net/{hw_profile}.network 提供并经
    #     GATE-6 校验一致, 未定前留 null.
    #   注意: 留 null 而不是留空列表 -- 空列表是"已赋值且监听零个口", 起得来但谁也连不上.
    gen_listen: null

    # gen_connect: 机内参与者连通用面 router 用的单个地址 (标量).
    #   TODO(11 S1.1.4): 与 gen_listen 的本机回环项同源, 落值时一起抄.
    gen_connect: null

  # -- QoS (10 S5.4.5 qos 行; 权威 11 S2.4.7) -------------------------------
  # 属安全参数: 热更新一律 E_CONFIG_LOCKED.
  qos:
    # profiles: 各 QoS 档位的定义 (映射).
    profiles: null

    # bindings: key 表达式到档位的绑定表. [有序, 首个匹配生效],
    #   且按 10 S5.4.2 R-5 整表替换, 不做元素级合并 -- 元素级合并会把上层条目
    #   排到兜底条目之后, 于是急停 key 落进带阻塞拥塞控制的档位, 而没有任何报错.
    bindings: null

  # -- 整机静态规格 (10 S5.4.5 spec 行; 权威 11 S9.6) -----------------------
  # 唯一定义处是 models/m20s.yaml 的 spec 段 (L2), 该行逐字 "common.yaml 只声明
  # 键位 = null". 落值见 CFG-CF-3.
  # 读者: P1 硬限幅 + 速度门 / P2 准入 / quadruped Tier 1.
  # 五项里已有依据的两项 (最大速度与最大制动减速度) 也[不在本文件落值], 理由同上:
  # 值落在 L2, 本文件落值就成了同一个键的第二份定义.
  # TODO(11 V-01): 横移 / 旋转 / 加速三项仍无依据, 落值前一律 null.
  spec:
    max_vx_mps: null
    max_vy_mps: null
    max_wz_radps: null
    max_accel_mps2: null
    max_decel_mps2: null

  # -- 速度档位表 (10 S5.4.5 motion.profiles 行; 权威 11 S9.6.1) ------------
  # 唯一定义处[就是本文件]: 11 S9.6.1 的档位块标题逐字 "L1 共享层:
  # /opt/xbrain_v6/configs/common.yaml", 且 10 S5.4.5 的来源列同样写 common.yaml.
  # 读者: P1 profiles / P2 health.profile_admission / P3 charge.low_batt_profile /
  #       P4 GBNF 枚举 / HMI.
  # 两档而且只有两档: cruise 与 transit 已由 U33 删除, schema 校验必须拒绝这两个字符串.
  # 每档四个键位取自 11 S9.6.1 的 L1 块 (10 S5.4.5 的括注只点了 max_mps 一个,
  # 那是举例不是键集); 键位齐全才不会出现"契约里有, 真源文件里没有"的键.
  # TODO(99 U54): 本表取值 U54 已重定标, 落值时逐档去 11 S9.6.1 抄, 并同批复核
  #   11 S9.6 SP-6 (f(require_sense_m) == max_mps) -- 段界与档位表是互为逆运算的
  #   两张表, 改一张不改另一张会让 freeze 拒绝整栈启动.
  motion:
    profiles:
      obstacle_avoid:
        max_mps: null
        # up_enter_mps: 升入本档的门槛. 最低档无门槛, 落值时按 11 S9.6.1 处理.
        up_enter_mps: null
        # require_sense_m: f() 四段定标表的档位下沿, 是制动学推导量.
        #   与 p1_motion.yaml 的 speed_gate.g_person_dist_m [同值但不同源]:
        #   后者是行人降速的策略量. 10 S5.4.5 别名表末行是[反向条目],
        #   逐字禁止把两者写成别名或互相引用 -- 焊死之后, 把行人降速距离调大
        #   (更保守的方向) 会连带改掉 f() 的段界, 于是 SP-6 不成立, 整栈开不了机.
        require_sense_m: null
        # sensors: 本档的传感器准入清单 (列表), 值为设备 ID.
        sensors: null
      patrol:
        max_mps: null
        up_enter_mps: null
        require_sense_m: null
        sensors: null

  # -- 安全常数 (10 S5.4.5 safety 两行) -------------------------------------
  # 唯一定义处是 safety/brake.yaml 与 safety/clock.yaml (L3, 整层自动 locked,
  # 且永不跟随 XBRAIN_CONFIG_DIR). 本文件只声明键位.
  # 这三个安全常数在历史文档里有三套写法, 别名已进 10 S5.4.5 别名表黑名单,
  # 进程私有配置里出现别名即拒绝启动 -- 真源键名逐字就是下面这三个.
  safety:
    # t_lat_s: 速度门 f() 与软围栏 d_stop 共用的同一个延迟常数 (11 M-01 逐字
    #   "速度门与围栏软带宽共用同一常数", 所以必须单点).
    #   这一行是 10 S5.4.4 断言 M 变异体点名的那一行: 把它[直接删掉](不是写 null)
    #   必须让整栈拒绝启动, 并报出键路径与"缺在哪一层".
    t_lat_s: null

    # d_safe_m: 全系统统一安全距离. 10 S5.4.5 对照表 (99 U67, 2026-08-06 用户拍板) 已把它
    #   登记为 common.safety.d_safe_m 的独立叶子, 真源值 1.00 m 落在 L3 safety/brake.yaml.
    #   本层 (L1) 只声明键位并留 null; 断言 N (10 S5.4.4) 的右操作数是它的引用轴展开值.
    d_safe_m: null

    brake:
      # a_mps2: 制动减速度. TODO(M-22 / T-DECEL): 现行取值是工作假设, 未实测.
      a_mps2: null
      # k: 安全系数. U54 之后 f() 改为显式减安全距离而不是除以安全系数,
      #   k 的现行用途只剩软围栏带宽; 10 S5.4.5 该行逐字登记"k 是否保留待评审",
      #   评审结论未出前保留键位.
      k: null

    clock:
      # 时钟未同步时的硬速度上限, 与"未同步是否放行自主运动"的开关.
      # 读者: P1 速度门 / P2 健康度 / rtk_driver. 权威 11 S1.5.5.
      # 命名空间分歧已裁 (99 U73, 2026-08-06 用户确认 7b): 键路径 = common.safety.clock.*
      #   (10 S5.4.5 已登记, 11 S1.5.5 yaml 样例已对齐嵌套到 common.safety.clock).
      # 本层 (L1) 只声明 10 S5.4.5 左列命名空间下逐字点名的这两个键位; clock 段的完整七键
      #   (加 sync_timeout_s / offset_threshold_ms / ref_max_age_s / rtc_trusted / step_notify_ms)
      #   落在 L3 configs/safety/clock.yaml, 本文件不据此扩键.
      unsynced_max_speed_mps: null
      # allow_unsynced_motion: 实验室联调开关. 它是安全参数, 一旦可热更新就等于
      #   给了一条"远程解除时钟安全约束"的通道 -- 10 S5.4.4 断言 E 要求五组安全
      #   命名空间与热更新白名单的交集为空.
      allow_unsynced_motion: null

  # -- 围栏 (10 S5.4.5 fence 两行; 权威 11 S9A.7 / S9A.12) ------------------
  fence:
    # margin_by_fix: 按 RTK 定位质量分档的围栏内缩量, 四个定位状态各一项.
    #   读者: P1 围栏内缩 / P2 U34 降级判定 / HMI 三线叠加.
    #   TODO(11 V-03 与 U-01): 取值待车体半宽与道路宽度确定; 落值后其单调性由
    #     12 S12.1 S-6 断言 (定位越差内缩越大), 落值时必须让四项满足该单调性.
    margin_by_fix:
      rtk_fixed: null
      rtk_float: null
      dgps: null
      single: null

    # soft_margin_min_m / predict_dt_s: 软围栏最小带宽与预测步长.
    #   读者: P1 软围栏 / P3 录制校验 / HMI 绘制.
    #   注意 12 S12 用另一个名字写同一个量, 该别名已进 10 S5.4.5 黑名单;
    #   真源键名是下面这两个, 进程私有配置里写别名即拒绝启动.
    soft_margin_min_m: null
    predict_dt_s: null

  # -- 地理原点 (10 S5.4.5 geo 行; 权威 11 S7.8.4 / S9A.12) -----------------
  # 唯一定义处是 sites/{site_id}.yaml 的 geo 段 (L4), 本文件声明键位待现场标定.
  # 这个键位就是 10 S5.4.3 null 行的样例本身: L1 声明 null, L4 填实值, 而 null
  # [不覆盖]下层, 所以这一行永远不会把现场标定结果洗掉.
  # TODO(11 U-01): 现场标定后在 sites/ 落值, 不在本文件落值.
  geo:
    enu_origin: null

  # -- 标定 (10 S5.4.5 calib 行; 权威 11 S10.1.1 / S10.4) -------------------
  # 唯一定义处是 calib/{robot_id}.yaml (L4b), 每台车实测后填. 本文件只声明键位.
  # 为什么 L4b 必须独立成层: 外参是每台车独有的实测事实, 塞进机型层会让一台车的
  # 外参污染全部同型号车, 塞进场地层会让换场地时外参跟着变.
  # frames 与 gate 在这里只声明容器键位而不展开子键: 帧名与门限是每台车一份的
  # 实测数据, 展开就等于在 L1 替 L4b 决定了有哪些帧.
  # TODO(M-24): 门限值仍是占位; 落值见 CFG-CF-7.
  calib:
    frames: null
    gate: null
    lat_err_ref_m: null
    calib_rev: null

  # -- 数据库 (10 S5.4.5 db 两行; 权威 15 S9.0 U46) -------------------------
  # 四库, 不是两库: P3 写 task / fence / geo 三库, P5 写 record 库, P1 与 RNS 只读,
  # P4 只读. 启动断言查四库, 关机 checkpoint 也是四库, 少一个库第一次开机就拒绝启动.
  db:
    task_db: null
    record_db: null
    fence_db: null
    geo_db: null

    # pragma: 四库共用的连接级缺省 (含只读连接), 权威 15 S9.1.
    #   这里只声明 10 S5.4.5 左列逐字点名的三个键位; 该行以省略号结尾, 说明键集
    #   在 15 S9.1 那边是开放的, 且 15 S9.1 的超时键名不带单位后缀而本表带 --
    #   两处键名不一致的裁决归 15 册主, 本文件按 10 的左列写, 不代它统一.
    #   TODO(15 S9.1): 落值时连同 FULL 清单一起看 -- 该节的默认同步档只管清单之外
    #     的写, 照默认档理解会以为掉电最多丢一个采点.
    pragma:
      journal_mode: null
      synchronous: null
      busy_timeout_ms: null

  # -- 保留期 (10 S5.4.5 retention 行; 权威 15 S9.11) -----------------------
  # 唯一定义处是 sites/{site_id}.yaml 的 retention 段 (L4), 键位在本文件.
  # 读者: P3 清理 / P5 清理 / 启动断言 C 的递增校验.
  # TODO(15 与 17 两方裁决): 事件保留期一处按单值写, 一处按告警级分级写, 两者不可
  #   同真; 断言 C 只能对单值求值. 未裁前本文件只声明键位.
  retention:
    task_days: null
    event_days: null
    command_log_days: null

  # -- 录制 (10 S5.4.5 recording 行; 权威 99 U42 / U44) ---------------------
  # 唯一定义处就是本文件. 读者: P3 采点落库 / P4 录制会话 / 11 S12A 的录制状态上限.
  # 同一批物理量在 15 / 16 / 11 三处各写过一份别名, 别名已进黑名单; 真源键名是下面五个.
  # TODO(99 U42 / U44): 落值时逐键去决策记录抄, 不要从三份别名里挑一份.
  recording:
    min_dist_m: null
    session_timeout_s: null
    sample_hz: null
    max_fences: null
    fence_close_tol_m: null

  # -- 指令集 (10 S5.4.5 cmdset 行; 权威 16 S12.4 / 18 S16) -----------------
  # 唯一定义处就是本文件. 读者: P4 意图与 Prompt 与 GBNF / P5 HMI 展示 / 18 指令集.
  # TODO(16 S12.4): 16 S14 在同一个文件里把意图表路径写了两遍 (一遍在关键词规则段,
  #   一遍在 cmdset 段), 落值时只认本文件这一份, 另一份按重复定义处理.
  cmdset:
    version: null
    intents_file: null
    missions_dir: null
    query_templates: null

  # -- 语音旁路词 (10 S5.4.5 audio 行; 权威 18 A01) -------------------------
  # 唯一定义处就是本文件. 读者: P4 旁路匹配 / 18 A01-A03 / HMI 帮助页.
  # 这是安全类词表 (急停 / 趴下 / 站立三组), 不允许存在两份: 16 S14 与 18 A01
  # 现在各有一组且不是同一组, 落值时必须收成这一处.
  # 键位按 10 S5.4.5 [左列]写 bypass_keywords; 该行的来源列把段写作 audio.bypass,
  # 左列与来源列的这处措辞差异归 10 册主, 本文件按断言 M 求值的那一列 (左列) 写.
  # TODO(18 A01): 三组词表落值前留 null.
  audio:
    bypass_keywords: null

  # -- 任务优先级 (10 S5.4.5 priority.task 行; 权威 15 S4.2) ----------------
  # 唯一定义处就是本文件: 目前仅 P3 定义, 但 HMI 已需要展示, 故上提到 common.
  # 读者: P3 调度 / P5 上报展示 / HMI.
  # 五个来源各一项. 它属于 common.*, 没有热更新语义 -- 共享值只在冻结线展开一次.
  priority:
    task:
      cloud: null
      wecom: null
      local: null
      auto: null
      charge: null
