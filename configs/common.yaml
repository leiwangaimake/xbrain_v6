# File: common.yaml
# Brief: L1 shared namespace -- sole definition site for common.* (10 S5.4.5)
#
# Description:
#   层: L1 (共享命名空间的唯一定义处) 归属进程: 无归属 (全部进程经 freeze 读快照)
#   键位清单的真源: 10 S5.4.5 "共享参数唯一定义处对照表" -- 该表[左列]逐行
#     给出的 common.* 路径, 就是本文件必须声明的键位集合 (10 S5.4.4 断言 M 逐字:
#     "清单 = S5.4.5 对照表的全部左列").
#   层允许面: 10 S5.4.3 L1 行逐字 "只能是 common.*, 出现其他顶层键即拒绝".
#
#   本文件是[键位骨架]: 左列每个路径在这里都有键位, 值[一律 null].
#   为什么不"能填的先填":
#     - 本轮交付的是键位, 不是取值. 取值分别卡在 11 V-01 (五项限幅) /
#       M-22 与 T-DECEL (制动减速度) / U-01 (enu_origin 现场标定) /
#       M-24 (calib 门限) / U-15 与部署 (通用面网口地址) 上, 逐条见各段注释.
#     - 10 S5.4.2 R-3 逐字 "不提供默认值语法 ... 解析不到即 E_CONFIG_INVALID
#       拒绝启动". null 的语义是"声明键位但未赋值": 它让启动断言 A 报出[键路径],
#       而键整个缺失则由断言 M 报出[缺在哪一层]. 两者抓的不是同一件事, 少了 A
#       退化成一条范围报错, 少了 M 退化成"L0 默认值兜住, 整栈照常启动".
#     - 因此本文件在落值前会让整栈按设计拒绝启动, 这是预期行为, 不是缺陷.
#
#   三条写法禁令, 每条都是本项目实测过的坑:
#     1. 未标定的参数一律 null, 绝不写零值冒充"已赋值". 零值会被断言 A 判为已赋值
#        而放行, 运行期 v_max = min(..., 0) = 0, 机器人不动且无任何报错 (fail-silent,
#        比 fail-safe 差一个量级; 10 S5.4.5 spec 行逐字, CLAUDE.md 3.1).
#        同理: 空列表与空映射也是"已赋值", 不得拿来当占位符 -- 一个"监听空列表"的
#        通用面 router 和一个没配的 router 长得一样, 但前者不报错.
#     2. 唯一定义处不在本文件的键 (下面逐段标注), 在这里[只声明键位, 不落值].
#        两个文件各写一份值, 正是 10 S5.4.4 断言 B 要拦的"疑似复制".
#     3. 不得用 YAML 锚点 & / * 表达共享 (10 S5.4.2 R-7). 锚点不跨文件, 却给人
#        "已经共享了"的错觉, 且与 ${} 引用轴两套机制并存.
#
#   本文件[不]做什么:
#     - 不写任何进程私有键. 进程私有键在 L6 的 {proc}.yaml 里, 只能引用不能定义.
#     - 不写 10 S5.4.5 的[反例]arbitration.priorities (P1 七个运动源的优先级).
#       它只有 P1 一个读者, 留在 p1_motion.yaml; 与 14 S11 的资源域仲裁同名不同物,
#       合并进 common 只会制造更大的混乱.
#     - 不做类型与范围校验. 那是 freeze 的 schema 校验与启动断言 G 的活.
# ==========================================================================

common:

  # -- 标识 ----------------------------------------------------------------
  # robot_id: 唯一定义处就是本文件顶层 (可被 XBRAIN_ROBOT_ID 覆盖, L5 白名单三项之一).
  #   用于填 Zenoh key 的 {rid} 段, 全部进程读. 权威: 11 S2.1.
  #   现无任何 yaml 定义它而各处默认"存在" -- 10 S5.4.5 该行的现状列逐字如此,
  #   本行就是补上那个键位.
  #
  # [2026-09-29 复核: 不可落值] 本键的唯一定义处确实就是本文件(10 S5.4.5 该行
  #   逐字 "common.yaml . 顶层(可被 XBRAIN_ROBOT_ID 覆盖)"), 但没有任何权威
  #   给出过一个 rid 的值 -- 11 S2.1 给的是格式 [a-z0-9_-]{1,32}, 不是取值,
  #   而 rid 本来就是一车一个.
  #   deploy/env/robot.env 已把这条坑逐字写下来: "a bogus rid (e.g. CHANGE-ME)
  #   would let rtk_driver + p1 start and publish under an id the cloud does not
  #   know -- fail-silent". 在本层写一个占位 rid, 后果与那句话描述的完全一样,
  #   且更糟: L1 的值对每一台车都生效, 而 L5 至少只影响一台.
  #   => 落值归部署(写 deploy/env/robot.env 的 XBRAIN_ROBOT_ID), 不归本文件.
  #
  # [2026-09-30 订正两处, 不改本键的 null]
  #   1. 路径: 原写 /etc/xbrain/robot.env, 用户 2026-09-30 裁决"不要放 /etc 下,
  #      放 xbrain_v6/deploy 下", 文件现在是 deploy/env/robot.env, 单元直接读它.
  #   2. 原写"该模板里 XBRAIN_ROBOT_ID 是刻意注释掉的" -- 已不成立: 同一裁决定了
  #      rid 取值 gj-001, 该行已取消注释. *** 但这不改变本键仍须为 null:
  #      L5 覆盖 L1 是分层设计本身(10 S5.4.3), rid 在 L5 落值恰恰是为了不让 L1
  #      的一个值对每台车生效. 这两句话同时成立, NO 不要据此来给本键填值.
  robot_id: null

  # site_id: 唯一定义处是 sites/{site_id}.yaml, 文件名即值 (L4).
  #   本文件只声明键位, 不落值; 落值见 CFG-CF-7.
  #
  # [2026-09-29 复核: 不可落值, 且本层写了也进不去] 两条:
  #   1. L4 的命名空间允许面不含本键 -- xbrain/common/config/layers.py 的 L4 行
  #      逐字 ("common.geo.", "common.site.", "common.retention."), 没有
  #      common.site_id. 即"文件名即值"这半句在加载器里没有执行体: 站点文件的
  #      名字不会被写进这个键. 实际供值口只有 L5 的 XBRAIN_SITE_ID
  #      (ENV_KEY_MAP 里逐字 "XBRAIN_SITE_ID": "common.site_id").
  #   2. tests/configs/test_config_variants.py 的
  #      test_loader_ignores_sim_files_without_a_variant_and_overlays_with_it
  #      逐字断言 _get(plain["L1"], "common.site_id") is None -- 本层落值即红.
  #   => "site_id 到底由谁供" 是设计未定(L1 缺省 / L5 必填 / 断言 A 豁免 三选一),
  #      按 CLAUDE.md S9.1 停下问用户, 已登记 docs/NEXT.md. 本文件不自行裁.
  site_id: null

  # 站点显示时区 (IANA 名, 如 Asia/Shanghai / Asia/Tokyo). 本地时间[显示]的唯一
  #   源: HMI 时钟 / TTS G24 (几点了) / CHS-A Time 字段. 纯显示值 -- 所有超时/
  #   控制用单调钟 (CLK-C1), 内部墙钟恒 UTC, 故本值[不影响安全]. 按部署站点设置
  #   (国际化售卖). 默认中国 (主力市场). 消费方: p4 (G24) / p5 (HMI) 经 ${common.timezone}.
  timezone: "Asia/Shanghai"

  # -- Zenoh 端点 (10 S5.4.5 zenoh 两行; 权威 11 S1.1.2 / S1.1.4 / NET-C9) --
  zenoh:
    # rt_endpoint: RT 面 router 的地址, RT 面封闭集 9 个进程 (11 S1.1.3 R-3) 与
    #   zenohd -l 启动参数共用同一个值. 现状是硬编码在 11 正文与 systemd 脚本两处,
    #   本键位存在的意义就是把那两处收成一处.
    #
    # [2026-09-29 落值] tcp/127.0.0.1:7449. 不是自拟, 三处独立出处逐字一致:
    #   1. 10 S5.4.5 对照表本行左列逐字 "common.zenoh.rt_endpoint = tcp/127.0.0.1:7449";
    #   2. 11 S1.1.2 的 json5 配置块逐字 connect: { endpoints: ["tcp/127.0.0.1:7449"] },
    #      同节 zenohd 启动行逐字 "zenohd -l tcp/127.0.0.1:7449 --no-multicast-scouting";
    #   3. 部署事实: configs/zenoh/router_rt.json5 的 listen 段即此地址, 且
    #      configs/chassis_relay.yaml / quadruped.yaml / perception.yaml 三个 L6
    #      文件各自硬抄了同一个字面量 -- 本键落值就是把那三份收成一处的前提.
    #
    # 为什么本值与 gen_listen 不同, 可以现在就落: 它是 lo 上的固定回环地址,
    #   11 S1.1 平面表逐字 "RT 面 = tcp/127.0.0.1:7449 跑在 lo 上 -- 与下列物理口
    #   全无关", 不依赖任何站点网段分配. gen_listen 依赖的 LAN2_IP / WIFI_IP 则
    #   至今没有可抄的事实(见该键注释), 两者不可一起落.
    rt_endpoint: "tcp/127.0.0.1:7449"

    # gen_listen: [列表, 不是标量]. NET-C9 要求逐口显式绑定并禁用通配绑定,
    #   所以它是一组逐口地址 (LAN2 / WIFI / 本机回环), 键的形状随之由标量改列表.
    #   TODO(U-15 与部署): 网口地址由 deploy/net/{hw_profile}.network 提供并经
    #     GATE-6 校验一致, 未定前留 null.
    #   注意: 留 null 而不是留空列表 -- 空列表是"已赋值且监听零个口", 起得来但谁也连不上.
    #
    # [2026-09-29 复核: 仍然不可落值] 本轮逐条查过三处可能的事实来源, 三处都没有值:
    #   1. configs/hw_profile/PROD.yaml.template 的 lan2.ipv4 / wlan0.ipv4 全是 null,
    #      且该文件头注逐字 "Do NOT commit 127.0.0.1 or 0-value placeholders here";
    #   2. deploy/net/PROD.network 写的是 ${LAN2_IP} / ${WIFI_IP} 占位, 由部署期从
    #      /etc/xbrain/hw_profile 代入, 仓库内无实值;
    #   3. deploy/env/network.env (2026-09-30 前在 deploy/etc-xbrain/) 两个地址都是
    #      127.0.0.1 的 fail-safe 占位(其头注逐字说明这是"degraded, never dangerous"
    #      的兜底, 不是站点地址). 该文件 2026-09-30 随裁决移出 /etc/xbrain, 但两个值
    #      一个未动 -- 与 robot.env 的 rid 不同, 这两个键没有任何已裁决的取值可抄,
    #      U-15 仍开(见本键下方), 填一个数进去正是 CLAUDE.md 3.6 铁律 3 禁的那件事.
    #   连带: configs/zenoh/router_gen.json5 头注逐字 "NET-C9 will move it to
    #   explicit-per-port bind after the LAN/host allocation freezes; until then
    #   loopback" -- 网段分配尚未冻结, 这正是本键没有事实可抄的原因.
    #   => 只落回环那一项也不行: 那是"已赋值且只监听 lo", 远端 HMI 与云端桥连不上
    #      而 router 照常起来, 与上面那句空列表的坑是同一个形状.
    gen_listen: null

    # gen_connect: 机内参与者连通用面 router 用的单个地址 (标量).
    #
    # [2026-09-29 落值] tcp/127.0.0.1:7447. 三处出处逐字一致:
    #   1. 10 S5.4.5 对照表本行左列逐字 "common.zenoh.gen_connect = tcp/127.0.0.1:7447
    #      (机内参与者用)";
    #   2. 11 S1.1.4 部署形态行逐字 "单 router 星型: zenohd mode:router, 所有本机
    #      参与者 connect tcp/127.0.0.1:7447";
    #   3. 部署事实: configs/zenoh/router_gen.json5 的 listen 段即 tcp/127.0.0.1:7447.
    #
    # 注意本键与 gen_listen 不是同一件事, 不要因为 gen_listen 未定就一起压着:
    #   gen_listen 是 router 监听哪些口(要站点网段), gen_connect 是本机参与者往哪儿
    #   连(恒为回环). NET-C9 管的是前者; 后者不受网段分配影响, 故可单独落值.
    gen_connect: "tcp/127.0.0.1:7447"

  # -- QoS (10 S5.4.5 qos 行; 权威 11 S2.4.7) -------------------------------
  # 属安全参数: 热更新一律 E_CONFIG_LOCKED.
  qos:
    # profiles: 各 QoS 档位的定义 (映射).
    profiles: null

    # bindings: key 表达式到档位的绑定表. [有序, 首个匹配生效],
    #   且按 10 S5.4.2 R-5 整表替换, 不做元素级合并 -- 元素级合并会把上层条目
    #   排到兜底条目之后, 于是急停 key 落进带阻塞拥塞控制的档位, 而没有任何报错.
    bindings: null

  # -- 整机静态规格 (10 S5.4.5 spec 行; 权威 11 S9.6) -----------------------
  # 唯一定义处是 models/m20s.yaml 的 spec 段 (L2), 该行逐字 "common.yaml 只声明
  # 键位 = null". 落值见 CFG-CF-3.
  # 读者: P1 硬限幅 + 速度门 / P2 准入 / quadruped Tier 1.
  # 五项里已有依据的两项 (最大速度与最大制动减速度) 也[不在本文件落值], 理由同上:
  # 值落在 L2, 本文件落值就成了同一个键的第二份定义.
  # TODO(11 V-01): 横移 / 旋转 / 加速三项仍无依据, 落值前一律 null.
  spec:
    max_vx_mps: null
    max_vy_mps: null
    max_wz_radps: null
    max_accel_mps2: null
    max_decel_mps2: null

  # -- 速度档位表 (10 S5.4.5 motion.profiles 行; 权威 11 S9.6.1) ------------
  # 唯一定义处[就是本文件]: 11 S9.6.1 的档位块标题逐字 "L1 共享层:
  # /opt/xbrain_v6/configs/common.yaml", 且 10 S5.4.5 的来源列同样写 common.yaml.
  # 读者: P1 profiles / P2 health.profile_admission / P3 charge.low_batt_profile /
  #       P4 GBNF 枚举 / HMI.
  # 两档而且只有两档: cruise 与 transit 已由 U33 删除, schema 校验必须拒绝这两个字符串.
  # 每档四个键位取自 11 S9.6.1 的 L1 块 (10 S5.4.5 的括注只点了 max_mps 一个,
  # 那是举例不是键集); 键位齐全才不会出现"契约里有, 真源文件里没有"的键.
  # TODO(99 U54): 本表取值 U54 已重定标, 落值时逐档去 11 S9.6.1 抄, 并同批复核
  #   11 S9.6 SP-6 (f(require_sense_m) == max_mps) -- 段界与档位表是互为逆运算的
  #   两张表, 改一张不改另一张会让 freeze 拒绝整栈启动.
  motion:
    profiles:
      obstacle_avoid:
        # [2026-09-10 落值] U54-b 重定标区间 0.2-0.5 取上限(14 S8.3);
        # 本轮只落 max_mps(速度键), 其余键落值须同批复核 SP-6 段界, 另批.
        max_mps: 0.5
        # up_enter_mps: 升入本档的门槛. 最低档无门槛, 落值时按 11 S9.6.1 处理.
        up_enter_mps: null
        # require_sense_m: f() 四段定标表的档位下沿, 是制动学推导量.
        #   与 p1_motion.yaml 的 speed_gate.g_person_dist_m [同值但不同源]:
        #   后者是行人降速的策略量. 10 S5.4.5 别名表末行是[反向条目],
        #   逐字禁止把两者写成别名或互相引用 -- 焊死之后, 把行人降速距离调大
        #   (更保守的方向) 会连带改掉 f() 的段界, 于是 SP-6 不成立, 整栈开不了机.
        require_sense_m: null
        # sensors: 本档的传感器准入清单 (列表), 值为设备 ID.
        sensors: null
      patrol:
        # [2026-09-10 落值] U54-b 重定标区间 1.0-2.0 取上限 = 底盘物理极限
        # (models/m20s.yaml spec.max_vx_mps, SP-2 约束 spec >= 本值).
        max_mps: 2.0
        up_enter_mps: null
        require_sense_m: null
        sensors: null

    # -- 盲向旋转限幅 (11 S3.1.5.6) -----------------------------------------
    # 为什么这个键存在: sectors 只有 13 条, 覆盖 +-90 度前半圈, 后半圈无数据.
    # S3.1.5.6 的处置表逐字: 后向/侧向 covered == false 时该扇区 dist_m = null,
    # 而 "存在 null 扇区时旋转按盲向处理" -- wz 限本值 + L1 确认.
    #
    # 注意它[不是]"看不见就不许转". 契约对看不见的方向给的是限速 + 确认,
    # 拒绝是另一条路径 (12 S6A 的 RCG 许可判据) 的事, 两者处置不同.
    #
    # [2026-09-29 落值] 取 11 S3.1.5.6 的[建议]0.3 rad/s, 用户裁决
    # "按你的建议设置实施". 在此之前本键全仓 configs 零命中, 而 12 S12 落地
    # 方案 2 是"拿不到限幅值就不放行" => rns_avoid 那一支退化为否决, 而
    # rns/source.py 的接触保险丝在 0.7m 内正是[刻意]压零 v 保留转向
    # (源码逐字 "turn continues; upper layers re-plan"), 那一拍恰是 spin_like
    # => 机器人会停在障碍前转不开. 这是落值的直接动因.
    free_space:
      blind:
        wz_blind_radps: 0.3

  # -- 安全常数 (10 S5.4.5 safety 两行) -------------------------------------
  # 唯一定义处是 safety/brake.yaml 与 safety/clock.yaml (L3, 整层自动 locked,
  # 且永不跟随 XBRAIN_CONFIG_DIR). 本文件只声明键位.
  # 这三个安全常数在历史文档里有三套写法, 别名已进 10 S5.4.5 别名表黑名单,
  # 进程私有配置里出现别名即拒绝启动 -- 真源键名逐字就是下面这三个.
  safety:
    # t_lat_s: 速度门 f() 与软围栏 d_stop 共用的同一个延迟常数 (11 M-01 逐字
    #   "速度门与围栏软带宽共用同一常数", 所以必须单点).
    #   这一行是 10 S5.4.4 断言 M 变异体点名的那一行: 把它[直接删掉](不是写 null)
    #   必须让整栈拒绝启动, 并报出键路径与"缺在哪一层".
    t_lat_s: null

    # d_safe_m: 全系统统一安全距离. 10 S5.4.5 对照表 (99 U67, 2026-08-06 用户拍板) 已把它
    #   登记为 common.safety.d_safe_m 的独立叶子, 真源值 1.00 m 落在 L3 safety/brake.yaml.
    #   本层 (L1) 只声明键位并留 null; 断言 N (10 S5.4.4) 的右操作数是它的引用轴展开值.
    d_safe_m: null

    brake:
      # a_mps2: 制动减速度. TODO(M-22 / T-DECEL): 现行取值是工作假设, 未实测.
      a_mps2: null
      # k: 安全系数. U54 之后 f() 改为显式减安全距离而不是除以安全系数,
      #   k 的现行用途只剩软围栏带宽; 10 S5.4.5 该行逐字登记"k 是否保留待评审",
      #   评审结论未出前保留键位.
      k: null

    clock:
      # 时钟未同步时的硬速度上限, 与"未同步是否放行自主运动"的开关.
      # 读者: P1 速度门 / P2 健康度 / rtk_driver. 权威 11 S1.5.5.
      # 命名空间分歧已裁 (99 U73, 2026-08-06 用户确认 7b): 键路径 = common.safety.clock.*
      #   (10 S5.4.5 已登记, 11 S1.5.5 yaml 样例已对齐嵌套到 common.safety.clock).
      # 本层 (L1) 只声明 10 S5.4.5 左列命名空间下逐字点名的这两个键位; clock 段的完整七键
      #   (加 sync_timeout_s / offset_threshold_ms / ref_max_age_s / rtc_trusted / step_notify_ms)
      #   落在 L3 configs/safety/clock.yaml, 本文件不据此扩键.
      unsynced_max_speed_mps: null
      # allow_unsynced_motion: 实验室联调开关. 它是安全参数, 一旦可热更新就等于
      #   给了一条"远程解除时钟安全约束"的通道 -- 10 S5.4.4 断言 E 要求五组安全
      #   命名空间与热更新白名单的交集为空.
      allow_unsynced_motion: null

  # -- 围栏 (10 S5.4.5 fence 两行; 权威 11 S9A.7 / S9A.12) ------------------
  fence:
    # margin_by_fix: 按 RTK 定位质量分档的围栏内缩量, 四个定位状态各一项.
    #   读者: P1 围栏内缩 / P2 U34 降级判定 / HMI 三线叠加.
    #   TODO(11 V-03 与 U-01): 取值待车体半宽与道路宽度确定; 落值后其单调性由
    #     12 S12.1 S-6 断言 (定位越差内缩越大), 落值时必须让四项满足该单调性.
    margin_by_fix:
      rtk_fixed: null
      rtk_float: null
      dgps: null
      single: null

    # soft_margin_min_m / predict_dt_s: 软围栏最小带宽与预测步长.
    #   读者: P1 软围栏 / P3 录制校验 / HMI 绘制.
    #   注意 12 S12 用另一个名字写同一个量, 该别名已进 10 S5.4.5 黑名单;
    #   真源键名是下面这两个, 进程私有配置里写别名即拒绝启动.
    soft_margin_min_m: null
    predict_dt_s: null

  # -- 地理原点 (10 S5.4.5 geo 行; 权威 11 S7.8.4 / S9A.12) -----------------
  # 唯一定义处是 sites/{site_id}.yaml 的 geo 段 (L4), 本文件声明键位待现场标定.
  # 这个键位就是 10 S5.4.3 null 行的样例本身: L1 声明 null, L4 填实值, 而 null
  # [不覆盖]下层, 所以这一行永远不会把现场标定结果洗掉.
  # TODO(11 U-01): 现场标定后在 sites/ 落值, 不在本文件落值.
  geo:
    # 三个分量各自声明为 null 占位 (FV-ORG-3: L1 只许放三个 null 占位; 断言 A 对
    # 这三条叶子路径豁免, 由 L4 sites/{site_id}.yaml 填值). NO 不能写成整节 null:
    # 那时 A 报的键路径是 common.geo.enu_origin, 不在豁免表里, 即使站点文件齐全
    # 也过不了冻结线 (2026-09-12 配置变体制落地时实测).
    enu_origin:
      lat: null
      lon: null
      alt: null

  # -- 标定 (10 S5.4.5 calib 行; 权威 11 S10.1.1 / S10.4) -------------------
  # 唯一定义处是 calib/{robot_id}.yaml (L4b), 每台车实测后填. 本文件只声明键位.
  # 为什么 L4b 必须独立成层: 外参是每台车独有的实测事实, 塞进机型层会让一台车的
  # 外参污染全部同型号车, 塞进场地层会让换场地时外参跟着变.
  # frames 与 gate 在这里只声明容器键位而不展开子键: 帧名与门限是每台车一份的
  # 实测数据, 展开就等于在 L1 替 L4b 决定了有哪些帧.
  # TODO(M-24): 门限值仍是占位; 落值见 CFG-CF-7.
  calib:
    frames: null
    gate: null
    lat_err_ref_m: null
    calib_rev: null

  # -- 数据库 (10 S5.4.5 db 两行; 权威 15 S9.0 U46) -------------------------
  # 四库, 不是两库: P3 写 task / fence / geo 三库, P5 写 record 库, P1 与 RNS 只读,
  # P4 只读. 启动断言查四库, 关机 checkpoint 也是四库, 少一个库第一次开机就拒绝启动.
  #
  # [2026-09-29 落值] 四个路径. 库名逐字取 15 S9.0 "四个数据库文件(U46 修订)"表的
  #   首列(data/task.db . data/record.db . data/fence.db . data/geo.db); 绝对化到
  #   /opt/xbrain_v6/data/run/ 取的是部署事实, 不是我选的一个"合理位置":
  #     * 四个库文件现就在 /opt/xbrain_v6/data/run/ 下且在用(fence.db 带 -wal/-shm);
  #     * xbrain/p3_task/runtime/main_wiring.py 的 DEFAULT_TASK_DB / DEFAULT_GEO_DB /
  #       DEFAULT_FENCE_DB 三个常量逐字就是 /opt/xbrain_v6/data/run/<name>.db;
  #     * scripts/dev/run_stack_dev.sh 与 run_stack_cloud.sh 的 XBRAIN_RECORD_DB
  #       同样指向 $REPO_ROOT/data/run/record.db.
  #
  # WARN 一处文档与部署的差, 落值时必须知道: 15 S9.0 与 10 S5.2 的框图都把路径写作
  #   data/<name>.db (没有中间的 run/), 而代码与现网都在 data/run/ 下. 本文件取
  #   data/run/ 的理由是失效方向, 不是"代码更新":
  #     照 data/<name>.db 落值 => 那四个文件不存在 => SQLite 会静默新建四个空库,
  #     现有的围栏/地理/任务数据当场变成"看不见"且不报任何错(fail-silent);
  #     照 data/run/ 落值 => 与今天进程实际打开的文件完全一致, 行为零变化.
  #   这一处 data/ 与 data/run/ 的取舍归 15 与 10 两册主裁(是放哪儿的决定, 不是
  #   表述缺陷), 已登记 docs/NEXT.md, 本文件不代裁, 也不改那两册的表.
  db:
    task_db: "/opt/xbrain_v6/data/run/task.db"
    record_db: "/opt/xbrain_v6/data/run/record.db"
    fence_db: "/opt/xbrain_v6/data/run/fence.db"
    geo_db: "/opt/xbrain_v6/data/run/geo.db"

    # pragma: 四库共用的连接级缺省 (含只读连接), 权威 15 S9.1.
    #   这里只声明 10 S5.4.5 左列逐字点名的三个键位; 该行以省略号结尾, 说明键集
    #   在 15 S9.1 那边是开放的, 且 15 S9.1 的超时键名不带单位后缀而本表带 --
    #   两处键名不一致的裁决归 15 册主, 本文件按 10 的左列写, 不代它统一.
    #
    # [2026-09-29 落值] 三项逐字取 15 S9.1 的 "PRAGMA -- 连接级缺省(四库一致, 冻结)"
    #   代码块, 该块逐字四行:
    #     journal_mode  = WAL         writer 不阻塞 reader
    #     synchronous   = NORMAL      连接级[缺省] -- 仅用于下方"FULL 清单"之外的写
    #     foreign_keys  = OFF         引用完整性由应用层维护(见 DBF-2)
    #     busy_timeout  = 5000        5 s 后才抛 OperationalError
    #   本文件只落 10 S5.4.5 左列逐字点名的三个键位; foreign_keys 不在左列, 故
    #   不据此扩键(该行以省略号结尾, 键集在 15 S9.1 那边是开放的).
    #
    # WARN synchronous: NORMAL 只是[连接级缺省], 不是全部写的同步档. 15 S9.1 的
    #   "逐事务提升为 synchronous = FULL 的清单"(FS-a ~ FS-f)要求 patrol_progress
    #   进度落盘 . tasks.status 每一次状态迁移 . commands.approval_state .
    #   alarm/fault 级事件 . 地理要素 upsert . task_route_snapshot 六类写走 FULL.
    #   照本行的 NORMAL 理解整个持久化层, 会以为掉电最多丢一个采点 -- 而 11 PWR-3
    #   逐字写的是 NORMAL 下 commit 只进 WAL 不 fsync, 掉电"丢的可能不是一个
    #   waypoint, 而是最近十分钟". FULL 那一半不是本键能表达的: PRAGMA 是连接级的,
    #   15 S9.1 推荐做法 1 是每个关键库另开一个 synchronous=FULL 的 writer 连接
    #   (w_full), 归 P3/P5 的持久化层实现, 不是这里再加一个键.
    #
    # 键名的一处已知分歧(不在本文件裁): 15 S9.1 写 busy_timeout(无单位后缀),
    #   10 S5.4.5 左列写 busy_timeout_ms. 本文件按断言 M 求值的那一列(左列)写,
    #   值 5000 的单位就是毫秒, 与 15 那行的 "5 s" 一致.
    pragma:
      journal_mode: "WAL"
      synchronous: "NORMAL"
      busy_timeout_ms: 5000

  # -- 保留期 (10 S5.4.5 retention 行; 权威 15 S9.11) -----------------------
  # 唯一定义处是 sites/{site_id}.yaml 的 retention 段 (L4), 键位在本文件.
  # 读者: P3 清理 / P5 清理 / 启动断言 C 的递增校验.
  # TODO(15 与 17 两方裁决): 事件保留期一处按单值写, 一处按告警级分级写, 两者不可
  #   同真; 断言 C 只能对单值求值. 未裁前本文件只声明键位.
  #
  # [2026-09-29 复核: 仍然不可落值] 注意卡点不是"没有数". 15 S9.11 的保留与清理表
  #   逐字给了三个数(tasks 终态行 30 天 . events 90 天 . commands 180 天),
  #   同节并逐字 "task(30) <= events(90) <= commands(180) (三项)". 压着不落的是
  #   另外两件事:
  #     1. 唯一定义处在 L4 -- 10 S5.4.5 本行的"唯一定义处"列逐字
  #        "sites/{site_id}.yaml . retention(键位在 common.yaml)". 在本层落值
  #        就是同一个键的第二份定义, 正是断言 B 要拦的"疑似复制";
  #     2. 15 与 17 的分歧未裁 -- 10 S5.4.5 本行逐字 "15 S12 按单值断言
  #        event = 90, 17 S10 却按 sev 分级 {info:7, warn:30, alarm:365, fault:365}
  #        ... 两者不可同真 ... 归 15 / 17 两方裁决". 照单值落, 分级那一支一旦
  #        被采纳, 断言 C 的递增判据本身要改(info:7 < task:30 会误报).
  #   连带一个结构问题(已登记 docs/NEXT.md): build_overlay 不合并 L4(选 L4 需要先
  #   有 site_id), 而断言 A 的 null 豁免表只有 enu_origin 三项 => 本段三个键即使
  #   由 L4 站点文件供值, 也仍会在断言 A 处被判 null. 这一条归冻结线, 不在本文件解.
  retention:
    task_days: null
    event_days: null
    command_log_days: null

  # -- 录制 (10 S5.4.5 recording 行; 权威 99 U42 / U44) ---------------------
  # 唯一定义处就是本文件. 读者: P3 采点落库 / P4 录制会话 / 11 S12A 的录制状态上限.
  # 同一批物理量在 15 / 16 / 11 三处各写过一份别名, 别名已进黑名单; 真源键名是下面五个.
  # TODO(99 U42 / U44): 落值时逐键去决策记录抄, 不要从三份别名里挑一份.
  recording:
    min_dist_m: null
    session_timeout_s: null
    sample_hz: null
    max_fences: null
    fence_close_tol_m: null

  # -- 指令集 (10 S5.4.5 cmdset 行; 权威 16 S12.4 / 18 S16) -----------------
  # 唯一定义处就是本文件. 读者: P4 意图与 Prompt 与 GBNF / P5 HMI 展示 / 18 指令集.
  # TODO(16 S12.4): 16 S14 在同一个文件里把意图表路径写了两遍 (一遍在关键词规则段,
  #   一遍在 cmdset 段), 落值时只认本文件这一份, 另一份按重复定义处理.
  #
  # [2026-09-29 落值] 四项逐字取 16 S12.4 "版本管理"的 yaml 块与 16 S14 的 cmdset
  #   段(两处字面量一致), 三个路径并经实地核对存在:
  #     configs/intents.yaml . configs/prompts/missions/ . configs/query_templates.yaml
  #   三者均在仓库内, missions 目录下有 M1~M10 共 11 个 .txt.
  cmdset:
    # WARN 如实登记, 本文件不代裁(与 configs/p4_agent.yaml 的 cmdset 段同一条警告):
    #   16 S12.4 与 16 S14 两处逐字都写 version: "1.0.0", 而 18 S16.5 的标题逐字是
    #   "本轮 cmdset.version 的单点结论(全文唯一出处, 其余各节一律引用本节)",
    #   其结论行逐字为 "一次 major 递增" 且 "必须评审" -- 但没有写出递增后的数值.
    #   => "1.0.0 是不是那一次 major 之后的值" 两册都没写. 本文件落 16 的逐字值,
    #      评审前必须由人对齐; 不得由实现者按 major+1 自行推一个 2.0.0 出来.
    version: "1.0.0"
    intents_file: "/opt/xbrain_v6/configs/intents.yaml"
    # 末尾斜杠逐字取自 16 S14, 不要顺手去掉: 它是目录不是文件, 同段的
    #   intents_file / query_templates 才是文件.
    missions_dir: "/opt/xbrain_v6/configs/prompts/missions/"
    query_templates: "/opt/xbrain_v6/configs/query_templates.yaml"

  # -- 语音旁路词 (10 S5.4.5 audio 行; 权威 18 A01) -------------------------
  # 唯一定义处就是本文件. 读者: P4 旁路匹配 / 18 A01-A03 / HMI 帮助页.
  # 这是安全类词表 (急停 / 趴下 / 站立三组), 不允许存在两份.
  # 键位按 10 S5.4.5 [左列]写 bypass_keywords; 该行的来源列把段写作 audio.bypass,
  # 左列与来源列的这处措辞差异归 10 册主, 本文件按断言 M 求值的那一列 (左列) 写.
  # 取值: 用户 2026-09-21 裁决, 16 S4 与 18 A01 两组词表取并集 (此前两册各 5 词
  # 且不是同一组, 10 S5.4.5 记为"已漂移"). 依据 16 S4.1: 漏触发的代价远高于误
  # 触发 -- 单字"停"会被"不停/停机坪"误命中, 但误触发急停的代价是一次可恢复的
  # 停车, 漏触发是撞上去; 英文 stop 对中文 ASR 大概率识别不出, 留着无害.
  # 形状按 16 S4 的三组: 不同组走不同动作 (estop 直达 Tier1, prone/stand 经仲裁).
  audio:
    bypass_keywords:
      estop: ["急停", "停止", "紧急停止", "立刻停下", "停", "stop"]
      prone: ["趴下", "卧倒", "趴着"]
      stand: ["站立", "站起来", "起立"]

  # -- 任务优先级 (10 S5.4.5 priority.task 行; 权威 15 S4.2) ----------------
  # 唯一定义处就是本文件: 目前仅 P3 定义, 但 HMI 已需要展示, 故上提到 common.
  # 读者: P3 调度 / P5 上报展示 / HMI.
  # 五个来源各一项. 它属于 common.*, 没有热更新语义 -- 共享值只在冻结线展开一次.
  priority:
    task:
      cloud: null
      wecom: null
      local: null
      auto: null
      charge: null
