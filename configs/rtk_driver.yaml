# File: rtk_driver.yaml
# Brief: L6 per-process config for rtk_driver (11 S3.3 / S3.11 / serial)
#
# Description:
# Runtime config for the rtk_driver process (dual-antenna RTK GNSS -> RT-plane
# GnssHeading). FLAT top-level sections, no proc-name wrapper -- same shape as
# configs/p4_agent.yaml (S22 loosened 2026-08-10: L6 only forbids a top-level
# `common` key; multiple flat top-level keys are the norm). The CODE carries NO
# default for any value here (CLAUDE.md 3.1): the resolver + driver take every
# threshold by injection and refuse to start if one is missing, so this file is
# the single home for the numbers. Runtime reads the freeze PRODUCT
# /run/xbrain/resolved/rtk_driver.yaml, never this source (10 S5.4.1). The
# resolver.* thresholds are the 11 S3.3.1/S3.3.3 ENGINEERING DEFAULTS -- pending
# T7 field calibration (11 S3.3.3 note), not measured; written here so nothing
# is silently defaulted in code.

serial:
  port: "/dev/ttyACM0"       # WCH CH343 USB serial -> Unicore UM982-class module
  baudrate: 115200           # module saved config; 8N1, no flow control
heading_stddev_deg: 1.0      # L1 heading 1sigma. ~0.35 m baseline bench ~1 deg;
                             # a config value until UNIHEADINGA per-solution cov is parsed
gga_timeout_s: 1.0           # a GGA older than this -> fix stale (fix_is_lost)
tra_timeout_s: 1.0           # a TRA older than this -> no dual-antenna heading
rmc_timeout_s: 0.3           # an RMC older than this -> no COG. 99 U189 (2), user 2026-11-13:
                             # was 1.0 -- before a UM982 USB drop the data freezes for up to ~1 s and
                             # the frozen COG stayed valid while the robot turned; 0.3 s = 6 frames
                             # at 20 Hz, normal RMC gaps stay under it. Stale -> P1 IMU bridge.
sync_timeout_ms: 5000        # CLK-A3 envelope ts_sync fail-safe window (T-11 = 5 s)
resolver:                    # 11 S3.3.1/S3.3.3 thresholds -- engineering defaults, T7-pending
  cov_thresh_rad: 0.02       # L1 admission: cov_rad <= this (~1.15 deg)
  age_thresh_s: 0.2          # L1 admission: heading age <= this
  cog_speed_thresh_mps: 0.5  # L2/blind: speed >= this to trust COG
  degrade_sustain_s: 0.5     # L1 -> L2 hold
  recover_sustain_s: 2.0     # any recovery hold (degrade fast, recover slow)
  fix_lost_sustain_s: 1.0    # -> L3 fix_lost / dual_antenna_fail hold
  blind_rise_sustain_s: 0.5  # L2-blind -> L2-active rise (fall is immediate)
  blind_timeout_s: 30.0      # L2-blind + pending autonomous move -> L3
  cov_h_m: 0.05              # horizontal position 1sigma, for the L2 cov estimate
  cog_diff_dt_s: 0.9         # COG differencing window, for the L2 cov estimate (T7)
  i_heading_l1: 1.0          # heading -> speed-gate factor per level (11 S3.3.1)
  i_heading_l2: 1.0          # 99 U142 (2026-11-06, was 0.4): L2 speed is P1's fixed nav.cog_drive_*_mps, not a factor
  i_heading_l3: 0.0
fix_cov:                     # rt/gnss/fix cov_h_m = nominal x max(hdop,1) (11 S3.2, T7)
  rtk_fixed_h_m: 0.02        # cm-level (11 S3.2.1)
  rtk_float_h_m: 0.30        # dm-level
  dgps_h_m: 1.50             # m-level
  single_h_m: 3.00           # single point
  vertical_factor: 1.5       # cov_v_m = cov_h_m x this (vertical ~1.5x horizontal)
diff_age:                    # fix_type cap on stale corrections (11 S3.2A RTG-10, 2026-11-03 ruling).
                             # The UM982 holds rtk_fixed on stale corrections for its RTK TIMEOUT
                             # (600 s); measured 12 cm off at 150 s. Normal age 0.7-2.0 s (Qianxun).
  fixed_to_float_s: 10.0     # rtk_fixed, age_s > this -> rtk_float. Engineering value, pending M-RTCM-3
  to_dgps_s: 60.0            # rtk_fixed / rtk_float, age_s > this -> dgps (no autonomy). Pending M-RTCM-3
clock:                       # rt/clock/status sync judgement (11 S3.11 / S1.5.2)
  offset_threshold_ms: 20.0  # |offset| <= this for rtk/ntp -> sync (S1.5.2)
  ref_max_age_s: 5.0         # PPS rtk staleness (applied to rtk; NTP uses leap, see clock_status.h)
  rtc_trusted: false         # T7: no coin cell confirmed, RTC untrusted (S1.5.2)
rtcm:                        # RTCM differential input (11 S3.2A); design in ros2_ws/sensor/README.md
  # Values are ENGINEERING values pending field measurement (M-RTCM-1 / M-RTCM-4),
  # written here so nothing is defaulted in code (CLAUDE.md 3.1).
  sink:
    queue_max_bytes: 16384   # main-thread write queue and network out queue cap (>= 1029)
    frame_max_age_s: 2.0     # a frame waiting longer than this is dropped
  lan:                       # primary: customer-LAN base station via the bridge box (RTB; Orange Pi Zero since 2026-11-09, was RPi)
    enabled: false           # no bridge on site yet
    host: null               # bridge static IP, numeric only (RTB-1)
    port: null               # bridge fixed port (RTB-1)
    connect_timeout_s: 3.0
    read_timeout_s: 5.0      # streaming and silent this long -> reconnect
    backoff_min_s: 1.0
    backoff_max_s: 30.0
  ntrip:                     # backup: Qianxun CORS (VRS), cold standby (U-RTCM-2)
    enabled: true            # account in service since 2026-11-02; without a fresh fix to
                             # report the link waits and never dials (RTG-7)
    host: "rtk.ntrip.qxwz.com"
    port: 8002               # Qianxun: 8001 ITRF2008 (epoch 2016.0), 8002 WGS84 (epoch 2005.0),
                             # 8003 CGCS2000 (epoch 2000.0). WGS84: the geo layer is WGS84.
    mountpoint: "AUTO"       # Qianxun-recommended mountpoint
    version: 1
    user: "qxyuuh001"        # RTG-9: credentials in this file by the 2026-11-02 ruling;
    password: "1492bcd"      # never logged, never in argv / environ / status / events
    connect_timeout_s: 5.0   # also bounds the DNS lookup
    read_timeout_s: 10.0     # reply header wait, then silence while streaming
    backoff_min_s: 2.0
    backoff_max_s: 60.0
    backoff_auth_s: 300.0    # after 401 / SOURCETABLE: slow, so the account is not locked
    linger_s: 60.0           # cold standby: keep the link this long after returning to LAN
    gga_period_s: 5.0
    gga_max_pos_age_s: 2.0   # a fix older than this is not reported (RTG-7)
    vrs_rebase_km: 10.0      # reconnect when this far from the VRS anchor (RTG-12)
  health:
    obs_window_s: 3.0        # an observation message within this window (RTG-3)
    station_window_s: 30.0   # a 1005/1006 within this window; casters send 1005 every 10 s
  selector:
    hold_up_s: 10.0          # primary valid this long, continuously, before switching back (RTG-5)
    backup_after_s: 15.0     # cold standby: primary invalid this long before dialling backup
