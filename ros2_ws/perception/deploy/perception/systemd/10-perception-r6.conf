# Drop-in for the contract unit xbrain-perception.service (contract_r6
# deploy/systemd/xbrain-perception.service is NOT modified).
# Target path when deployment is approved:
#   /etc/systemd/system/xbrain-perception.service.d/10-perception-r6.conf
#
# Kept from the template unchanged: Requires/After freeze + zenohd-rt/gen,
# ConditionPathExists, Restart=always, RestartSec=2s, StartLimitBurst=5 /
# StartLimitIntervalSec=60s, OOMScoreAdjust=-900, CPUAffinity=2-3, ExecStart.
# Differences introduced here (reply 2026-09-17 Q19):
#   * Description: the template text still says "RGBD + LIDAR"; there is no LiDAR.
#   * Environment: ROS 2 Humble runtime for the executor (TF + capture command
#     only, P19-4). ROS libraries' transitive dependencies are not covered by the
#     binary RUNPATH, so the library path is required.
# Not set here on purpose:
#   * ROS_DOMAIN_ID: a whole-robot deployment value (integrator's drop-in).
#   * Any PERCEPTION_* / RNS_* variable: the service refuses inherited switches.
[Unit]
Description=XBRAIN v6 perception (R6 RGB-D service: profile/objects/status + GEN events)

[Service]
Environment=LD_LIBRARY_PATH=/opt/ros/humble/opt/rviz_ogre_vendor/lib:/opt/ros/humble/lib/aarch64-linux-gnu:/opt/ros/humble/lib
Environment=AMENT_PREFIX_PATH=/opt/ros/humble
# 11 section 1.2 table (ROS 2 platform baseline), row RMW: rmw_cyclonedds_cpp.
Environment=RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
