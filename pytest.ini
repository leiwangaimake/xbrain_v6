[pytest]
# INF-TS-1 -- three-tier hardware marker system.
#
# no_device      test runs on any Linux dev machine with no special hardware.
# needs_orin     test needs an NVIDIA Orin (CUDA / TensorRT / nvidia-smi).
# needs_chassis  test needs the M20S chassis reachable (fake_chassis if
#                available; otherwise skip on dev).
#
# Default filter: `pytest -m no_device` for CI on developer machines.
# The other two markers are opt-in via `-m` on machines that have the
# hardware. strict-markers refuses unknown markers so a typo cannot
# silently make a marker no-op.
markers =
    no_device: runs anywhere (default for pure Python / unit tests)
    needs_orin: requires NVIDIA Orin (CUDA / TensorRT / nvidia-smi)
    needs_chassis: requires the M20S chassis reachable at LAN1

# Strict mode: an unknown marker fails collection instead of being
# silently ignored. Without this, `@pytest.mark.no_devcie` (typo) would
# match nothing and its test would run in every `-m` selection.
# Configured in conftest.py addopts because pytest.ini strict-markers
# alone did not always propagate through the plugin ordering here.

# Chinese-in-string exemption note: pytest.ini is INI, not source
# code. no_chinese_in_log.py only scans .py so it does not fire on
# this file even though descriptions above contain CJK.

# Import mode: importlib (2026-08-21).
#
# *** Without this, `pytest tests/` cannot collect the repo at all.
# tests/integration/ and tests/p4_agent/integration/ are two packages with the
# SAME name, each carrying __init__.py, while their parents (tests/,
# tests/p4_agent/) carry none. Under the default "prepend" import mode both
# resolve to a top-level module named `integration`, and the second one
# imported dies with ModuleNotFoundError. The whole-repo run stopped at
# collection -- "4502 tests collected, 1 error" -- so a full regression had
# never actually completed.
#
# NOTE it goes in `addopts`, not a bare `import-mode` key: pytest exposes this
# only as a command-line flag, and an unknown ini key is a WARNING, not an
# error -- the first attempt here looked applied and silently was not.
#
# importlib gives each test module a unique name derived from its path, so the
# two `integration` packages stop colliding. It is the mode pytest recommends
# for new projects and it changes no test behaviour here (verified: the same
# suites pass either way, per-directory runs included).
#
# The alternative was adding __init__.py to tests/ and tests/p4_agent/, which
# also works but turns `tests` into a package and moves conftest resolution --
# a bigger blast radius for the same fix. Reversible either way: delete this
# line and the collision comes back.
addopts = --import-mode=importlib
