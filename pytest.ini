[pytest]
# INF-TS-1 -- three-tier hardware marker system.
#
# no_device      test runs on any Linux dev machine with no special hardware.
# needs_orin     test needs an NVIDIA Orin (CUDA / TensorRT / nvidia-smi).
# needs_chassis  test needs the M20S chassis reachable (fake_chassis if
#                available; otherwise skip on dev).
#
# Default filter: `pytest -m no_device` for CI on developer machines.
# The other two markers are opt-in via `-m` on machines that have the
# hardware. strict-markers refuses unknown markers so a typo cannot
# silently make a marker no-op.
markers =
    no_device: runs anywhere (default for pure Python / unit tests)
    needs_orin: requires NVIDIA Orin (CUDA / TensorRT / nvidia-smi)
    needs_chassis: requires the M20S chassis reachable at LAN1

# Strict mode: an unknown marker fails collection instead of being
# silently ignored. Without this, `@pytest.mark.no_devcie` (typo) would
# match nothing and its test would run in every `-m` selection.
# Configured in conftest.py addopts because pytest.ini strict-markers
# alone did not always propagate through the plugin ordering here.

# Chinese-in-string exemption note: pytest.ini is INI, not source
# code. no_chinese_in_log.py only scans .py so it does not fire on
# this file even though descriptions above contain CJK.
