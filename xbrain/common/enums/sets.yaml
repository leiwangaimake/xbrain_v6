# File: sets.yaml
# Brief: Machine-readable single source of truth for the non-error closed sets
#
# Description:
# Generated from docs/11-接口契约.md. Every XBRAIN runtime process imports these
# from xbrain/common/enums; CLAUDE.md 3.5 forbids the literals anywhere else,
# for the same reason as the error codes -- a value spelled differently in two
# processes only surfaces during integration.
#
# *** Not every set comes from 11. charge_stage is defined in 15 S8.5, and that
# is not an oversight to tidy up: 11 says in so many words that its own charging
# section 定接口, that 15 S8.5 定判据与阈值, and that 两处不得各写一份阈值
# (CFG-40). The synchronisation column in 11 lists only the stages an event can
# announce and does not carry to_handover at all, so keying charge_stage off 11
# would export a set that is short one member. The source: field of each set
# below records which volume it was taken from, and the metatest reads that
# volume rather than assuming 11.
#
#  Each set is bound to the contract by a symmetric-difference metatest in
# tests/common/test_closed_sets.py. One-directional containment would pass while
# the library is missing a value the contract added, which is how Event.category
# sat at 21 while the contract had moved to 23.
#
# No counts here or in comments (CLAUDE.md 3.7). The contract's own tallies
# have already rotted once: S13.3 still says the error set holds 40.
#
#  order matters for gate_limiter and stop_reason -- both are documented as
#   decision orders, not just membership. The metatest checks order for those two.

sets:
  plane:
    source: "11 S2.1"
    anchor: "| `plane` |"        # the table header / row the parser keys off
    note: "key 空间第二段.xbrain/{robot_id}/{plane}/{domain}/{name}"
    ordered: false
    values:
      - rt
      - state
      - event
      - cmd
      - audio
      - data
      - health
      - probe
  domain:
    source: "11 S7A.0"
    anchor: "| 域 | `domain` |"        # the table header / row the parser keys off
    note: "七域仲裁.domain 5 ptz / 4 payload_light 由 p2_core 裁"
    ordered: false
    values:
      - motion
      - speaker
      - asr
      - payload_light
      - ptz
      - gpu
      - dock
  event_category:
    source: "11 S6.2"
    anchor: "| category | ... | channel |"        # the table header / row the parser keys off
    note: "事件类别.2026-08-05 由 21 扩为 23(补 ptz / voice)"
    ordered: false
    values:
      - intrusion
      - fence
      - speed_limit
      - mode_change
      - arbitration
      - task
      - charging
      - health
      - bit
      - chassis
      - estop
      - comm
      - rtk
      - geo
      - teach
      - teleop
      - perception
      - motion
      - payload
      - data
      - system
      - ptz
      - voice
  severity:
    source: "11 S6.1 / S2.2.11"
    anchor: "`{severity}` | `info`"        # the S2.2.11 W-5 row for the event/{severity}/{category} key segment
    note: "事件严重度.event/{severity}/{category} key 段闭集(S2.2.11 W-5) = Event.sev(S6.1). 4 值 全小写. arbiter 只发 info/warn/fault(S7A.7), alarm 归其他类别(如 intrusion)"
    ordered: false
    values:
      - info
      - warn
      - alarm
      - fault
  fence_role:
    source: "11 S9A.2"
    anchor: "`polygons[].role` | string"        # the S9A.2 FenceSet field-table row
    note: "围栏 role(S9A.2 / S9A.1A). allow 有且仅 1(FS-5A). warning 旧名 zone -- 提取器须滤掉行内 '旧名 zone' 注, 不把 zone 当值"
    ordered: false
    values:
      - allow
      - forbid
      - speed_limit
      - warning
  geo_action:
    source: "11 S7.9.1"
    anchor: "| `action` | 语义 |"        # the S7.9.1 action table header
    note: "cmd/geo GeoCommand 的 action(S7.9.1). 前 4 个是写(权限矩阵 S7.9.5 逐格), 后 4 个是读. resync 与 prune 同格但 prune 是 resync 的参数不是 action"
    ordered: false
    values:
      - upsert
      - delete
      - rename
      - set_state
      - get
      - list
      - refs
      - resync
  geo_origin:
    source: "11 S7.9.5"
    anchor: "云端 `cloud`"        # the S7.9.5 permission-matrix header columns
    note: "cmd/geo 的 origin = 通道, CH-1 唯一权限判据. 真源是 S7.9.5 表头四列(2026-08-20 裁决): S7.9.1 json5 注释曾多 teach 少 wecom, 已订正. teach/factory 是 created_by(S7.8.2)不是通道, 示教保存走 origin=voice"
    ordered: false
    values:
      - cloud
      - wecom
      - hmi
      - voice
  geo_type:
    source: "11 S7.8.2"
    anchor: "| `type` | string |"        # the S7.8.2 common-metadata field row
    note: "四类地理要素(S7.8.1/S7.8.2). geo_id 前缀 r-/w-/f-/d- 与本集一一对应. 物理上 route/waypoint/dock 在 geo.db, fence 在 fence.db(15 S9 双库)"
    ordered: false
    values:
      - route
      - waypoint
      - fence
      - dock
  geo_state:
    source: "11 S7.8.2"
    anchor: "| `state` | string |"        # the S7.8.2 lifecycle field row
    note: "地理要素生命周期(S7.8.2). deleted 是墓碑不物理删(S7.11.4) => 库里 state=deleted 与 tombstone=1 同义, 单写者两列一起改. F15 启用围栏 = set_state -> active"
    ordered: false
    values:
      - draft
      - active
      - disabled
      - deleted
  reason:
    source: "11 S R2.6-e"
    anchor: "task/progress 的 reason 闭集"        # 11 S R2.6-e 补丁行(§13 正表落地后迁锚)
    note: "task/progress 运动/遥控阻塞原因(CFG-CM-16, 11 R2.6-e). rotation_blocked/lateral_clearance = RNS 几何门; teleop_stale/deadman_released = 遥控 deadman(M20S 遥控时基). 我方闭集非底盘上报, 非 suspend_reason. §13 正表未落 => 提取器暂锚 R2.6-e 补丁行"
    ordered: false
    values:
      - rotation_blocked
      - lateral_clearance_unavailable
      - teleop_stale
      - deadman_released
  control_mode:
    source: "11 S R2.6-f"
    anchor: "闭集章补 `control_mode` 一项"        # 11 S R2.6-f: 现仅 jog
    note: "直控模式(CFG-CM-16, 11 R2.6-f). 现仅 jog(点动, 17 S12 直控原语 jog 按住/nudge 单击, 对应 M20S 手动控制). 单值闭集: 传非 jog 必抛, 不做未知值降级解释为 jog"
    ordered: false
    values:
      - jog
  gate_limiter:
    source: "11 S9.6.5"
    anchor: "| 优先级 | `limiter` |"        # the table header / row the parser keys off
    note: "速度门归因. 表序即优先级,estop 最高"
    ordered: true
    values:
      - estop
      - mode
      - health
      - rtk
      - heading
      - clock
      - fence
      - free_space
      - target
      - brake
      - gait
      - profile
      - spec
      - none
  stop_reason:
    source: "11 S4.1"
    anchor: "| `stop_reason` |"        # the table header / row the parser keys off
    note: "本拍零速的唯一归因. 取值顺序即 S9.12.2 的判定顺序"
    ordered: true
    values:
      - none
      - hes
      - timeout
      - soft_estop
      - mode_switching
      - mode_mismatch
      - nan
      - no_source
  task_state:
    source: "11 S4.4"
    anchor: "| 分组 | `state` |"        # the table header / row the parser keys off
    note: "任务状态.12 值 全小写 冻结"
    ordered: false
    values:
      - pending
      - scheduled
      - blocked
      - ready
      - running
      - suspended
      - done
      - failed
      - cancelled
      - interrupted
      - wait_for_power_off
      - needs_review
  cls:
    source: "11 S3.1.1"
    # No '#' in this anchor even though the heading it points at carries four of
    # them. The scalar reader in __init__._load strips a value from its first
    # '#' onwards as a trailing comment, so an anchor written with the heading
    # markers would load as an empty string and the citation would vanish
    # without a word -- the same fail-silent shape this whole package exists to
    # stop. The text below is still literally greppable, which is all NUM-4 asks
    # for.
    anchor: "3.1.1 目标类别取值"
    note: "targets[].cls on state/targets. The S3.1 field table defers here"
    # Membership only. The contract prints these separated by a middle dot with
    # no statement that the sequence carries meaning, so marking this ordered
    # would invent a priority the contract never granted -- and index() would
    # then hand that invented priority out to callers as fact.
    ordered: false
    values:
      - person
      - vehicle
      - bicycle
      - motorcycle
      - animal
      - unknown
  device:
    source: "11 S5.1A"
    anchor: "| 项 | `kind` |"
    # The left operand is the kind column of the self-test spec table, NOT the
    # S0.3 global device ID table. The two overlap enough to be mistaken for one
    # another and are not the same set: S0.3 also registers cam_ptz,
    # cam_chassis_front, imu_chassis, gnss_chassis and payload_svc, none of
    # which are rows here. CS-1 ("frames key must come from the S0.3 table") is
    # about that other table, so wiring CS-1 to this set would reject valid
    # extrinsics and accept nothing in exchange.
    note: "S5.1A rows whose kind column reads device. Not the S0.3 device ID table"
    # Membership only. The table is a specification, not a decision order; the
    # BIT release verdict is driven by the level column, never by row position.
    ordered: false
    values:
      - rtk
      - chassis
      - cam_rgbd
      - lidar
      - ptz
      - mic
      - payload_speaker
      - payload_siren
      - payload_strobe
      - payload_light
  # -------------------------------------------------------------------------
  # The arbitration and task-lifecycle sets. Added together because they are
  # consumed together: the arbitration framework raises three of them and the
  # task machine raises the other three, and every one of them was being
  # spelled as a literal at the call sites that needed it.
  # -------------------------------------------------------------------------
  release_reason:
    source: "11 S7A.1"
    anchor: "| `release_reason` | string |"
    # *** Four values, and mode_switch is NOT one of them today. 14 S13 CR-1
    # asks 11 to add it and 14 S3.2.1 already describes the value as merged,
    # but grep 11 for release_reason and the enumeration that comes back is
    # these four. Exporting the fifth here would make the symmetric-difference
    # metatest go red against the contract as it currently stands, and 14 does
    # not need it to: it gives a transitional instruction in so many words --
    # emit mode_exit and mark detail.note self_held_handover until the change
    # lands. So the self-held handover is expressible, and this set stays equal
    # to the contract. When 11 gains the value, add it here and the metatest
    # will already be pointing at the right table.
    note: "op=release 时必填. 自持换手在 11 合入前走 mode_exit + detail.note"
    ordered: false
    values:
      - done
      - mode_exit
      - user_cancel
      - error
  arb_suspended:
    source: "11 S7A.6.5"
    anchor: "| 类型 | 生效路径 |"
    # Named arb_suspended, not suspended. The contract field is
    # ArbDomainState.suspended, but task_state already exports a VALUE spelled
    # suspended, and a set whose name collides with another set's member is the
    # kind of thing that reads correctly right up to the moment somebody writes
    # parse_enum("suspended", task.state) and gets a plausible-looking raise
    # about the wrong contract. Same convention as gate_limiter for gate.limiter
    # and event_category for Event.category: qualify by the message.
    #
    # !! null is deliberately absent. The field is string|null and null means
    # "not disarmed at all", which is the absence of a value rather than a
    # member of the set. Adding a "null" or "none" string here would let a
    # decoder validate the disarmed case and the normal case through one call
    # and stop distinguishing them -- and 11 G-10 turns on exactly that
    # distinction, because a domain disarmed with soft_estop still forwards.
    note: "ArbDomainState.suspended. null (not a member) means not disarmed"
    ordered: false
    values:
      - soft_estop
      - hes
      - cmd_timeout
  gate_reason:
    source: "11 S8.9.2"
    anchor: "| `reason` 取值 | 含义 |"
    # Membership only. The table is a legend, not a precedence list: P2 is the
    # sole authority for the value and publishes one, so there is nothing here
    # for a consumer to rank. p4_agent in particular must not derive it -- the
    # contract says so directly, on the grounds that P4 cannot know how much
    # audio is still in the speaker buffer.
    #
    # NOTE that open is a member. The set describes why the mic is in its
    # current state, not only why it is shut, so a decoder that treats open as
    # "no reason present" and omits the field breaks the fail-safe on the other
    # side: 11 requires P4 to treat gate silence beyond one second as closed.
    note: "AsrGate.reason on rt/audio/gate. P2 is the only authority"
    ordered: false
    values:
      - open
      - speaker_active
      - tail_hold
      - not_listening
      - asr_not_granted
      - device_fault
      - manual_mute
  suspend_kind:
    source: "11 S4.4"
    anchor: "| `suspend_kind` | 触发 |"
    # Two values, and the contract spends a paragraph on why they may not be
    # collapsed into one: a task suspended for low battery would otherwise be
    # judged resumable the moment the charging task ends, while the battery
    # condition it was waiting for may still not hold. yielding resumes by
    # itself, passive does not.
    note: "必填当且仅当 state == suspended. yielding 自动恢复, passive 不会"
    ordered: false
    values:
      - passive
      - yielding
  suspend_reason:
    source: "11 S4.4"
    anchor: "| `suspend_reason` 闭集 |"
    # *** The contract table has fewer ROWS than the set has VALUES: two of its
    # rows carry a pair of reasons that share one suspend_kind. An extractor
    # that took the first backticked name per row would produce a set that
    # parses, looks sane, and silently rejects energy_unreachable and
    # estop_hes -- both of which are raised by real code paths. The metatest
    # therefore reads every backticked name in the cell for this set, and the
    # count is nowhere written down (CLAUDE.md 3.7).
    #
    # The pairing with suspend_kind is NOT mirrored here. Which reasons are
    # passive and which are yielding is the second column of the same table, and
    # a copy of it in this file is the copy that would drift; a consumer that
    # needs the mapping reads it from the task machine, which owns the
    # transition.
    note: "必填当且仅当 state == suspended. 与 suspend_kind 成对消费"
    ordered: false
    values:
      - low_battery
      - energy_unreachable
      - estop_soft
      - estop_hes
      - clock_unsync
      - rtk_degraded
      - operator_pause
      - unclean_shutdown
      - shutdown_pending
      - preempted
      - mode_takeover
  heading_source:
    source: "11 S3.3"
    anchor: "| `heading_source` | string |"
    # GnssHeading.source (11 S3.3): dual-antenna heading / COG fallback / none, the
    # L1 -> L2 -> L3 degradation. Membership only -- the L1>L2>L3 rank is the level
    # int's job (level == 1/2/3, one-to-one), and marking this ordered would hand
    # index() a second rank that duplicates level. rtk_driver is the sole producer;
    # per 11 H-1 consumers read heading_valid, never branch on this string.
    note: "GnssHeading.source; produced by rtk_driver; consumers gate on heading_valid (H-1)"
    ordered: false
    values:
      - dual_antenna
      - cog
      - none

  charge_stage:
    # *** 15, not 11. See the note at the top of this file: 11 defers the
    # criteria to 15 S8.5 and its own synchronisation column omits to_handover,
    # so keying this set off 11 would export a set missing its first member and
    # the robot would reject its own stage while driving to the handover point.
    source: "15 S8.5"
    anchor: "| 取值 | 含义 | 退出条件 |"
    # Membership only, even though the values read like a sequence. The exit
    # conditions in the same table are not a line: an unplug confirmation sends
    # charging BACK to waiting_plug. Marking this ordered would let index()
    # hand out a progress rank that goes backwards without anything noticing.
    note: "tasks.step_status_json.charge_stage. 拔线确认时 charging 退回 waiting_plug"
    ordered: false
    values:
      - to_handover
      - waiting_plug
      - charging
      - complete
