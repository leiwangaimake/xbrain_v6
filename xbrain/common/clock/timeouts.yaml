# File: timeouts.yaml
# Brief: Committed copy of the 11 S1.6 global timeout / age master table
#
# Description:
# 11 S1.6 is the one place the whole system's timeouts are registered ("全系统
# 所有超时集中于此表"). This file mirrors that table so every process can import
# the same registry and the deployed C++ header is generated from one source.
# The metatest tests/common/clock/test_timeout_table.py is the only thing keeping
# this file and S1.6 equal: it extracts S1.6 fresh and asserts an empty symmetric
# difference in BOTH directions (an id, group, timebase or threshold that drifts
# fails it). See that file for the three mutation cases.
#
# *** threshold is CONTRACT TEXT, not a runtime value. It is the in-force token
# from the S1.6 阈值 cell (decoration stripped, cut at the first <br>; the exact
# rule lives in normalize_threshold in the metatest, and this file is authored to
# match it). It exists for audit and cross-checking, NOT for a control loop to
# divide by. The number a process actually enforces comes from that process's
# own config (e.g. p4_agent.yaml timeout_s for T-40/T-41/T-42, p5_gateway
# event.ack_timeout_s for T-45), where it can be calibrated and, where the
# contract has not fixed a value, left null to refuse startup. Uncalibrated
# entries here are recorded verbatim as the contract wrote them -- "待实测",
# "100–200 ms 待定", "timeout_s" -- and NEVER as a fabricated number (CLAUDE.md
# 3.1): this registry does not invent a value the contract does not state.
#
# timebase is derived from the document's own rule, not a per-row column (S1.6
# has none): group A is 全部单调时钟 with no exception, and T-46 is singled out
# as the one wall-clock entry. The metatest asserts both anchor phrases still
# exist before trusting that derivation.
#
#  Do NOT write a count of rows here or in any comment. S1.6 does not carry one
# and a human-copied tally rots (CLAUDE.md 3.7). The scan-surface metatest is
# what proves nothing was dropped.
#
#  This is NOT configuration. It ships inside the package like codes.yaml, is
# read from the package directory, and must be byte-identical for every process
# -- the resolved config tree deliberately expands per process and cannot offer
# that (10 S5.4.1).

timeouts:
  # --- A group: 11 S1.6.1 . safety loop . all monotonic, no wall clock ---
  - id: T-01
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "200 ms"
  - id: T-02
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "200 ms"
  - id: T-03
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "300 ms"
  - id: T-04
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "1 s"
  - id: T-05
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "500 ms"
  - id: T-06
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "2 s"
  # *** T-50..T-53 supersede T-02..T-06 for the perception inputs.
  #
  # 11 S1.6.1 states the two sets are "两个时代的同一件事" and that the
  # implementation follows T-50..T-53: the older rows judge rt/lidar/* and
  # rt/perception/targets, neither of which RNS subscribes to. They are filed
  # here, beside the rows they replace, rather than after T-46 in numeric order,
  # so a reader arriving at either half sees the relation.
  #
  # The number jumps to 50 because A-group T-13..T-17 are already taken by the
  # S10.3.5 patch block, leaving no run of four free ids inside A; 11 S1.6.1
  # declines to renumber used ids because that would strand references.
  - id: T-50
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "300 ms"
  - id: T-51
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "1 s"
  - id: T-52
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "500 ms"
  - id: T-53
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "3 s"
  - id: T-07
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "3 s 建议收紧 1.5 s"
  - id: T-08
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "10 s 建议收紧 5 s"
  - id: T-09
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "500 ms(本次新增)"
  # T-09a / T-10a: 2026-10-08 随 11 S1.6.1 的"编辑 C"补丁块合入正文(PH-1,
  # 用户裁决三选一取 (a) 合入). threshold 的值不是手写的 -- 是跑
  # tests/common/clock/test_timeout_table.extract_contract_timeouts() 从表体
  # 读出来再照抄的, 否则这里就成了契约的第二份手维护副本.
  #
  # *** 它们与 T-09 / T-10 的差别是[失效后果]而不是阈值: 后者停车, 前者只让
  # wpos 失效(perception 的 RTK 依赖是语义链路, 不是控制链路). 实现不得把 GNSS
  # 超时传导为 PerceptionFrame 停发 -- 那会在 500 ms 后再触发 T-02(targets
  # 200 ms -> 零速), 把一个定位故障放大成停车故障.
  - id: T-09a
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "500 ms"
  - id: T-10
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "1 s(本次新增)"
  - id: T-10a
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "500 ms"
  - id: T-11
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "5 s"
  - id: T-12
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "timeout_s(默认 20 s)"
  # --- B group: 11 S1.6.2 . link, session, health . monotonic ---
  - id: T-20
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "1 s"
  - id: T-21
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "3 s"
  - id: T-22
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "≥ 1 Hz(建议 2 Hz)"
  - id: T-23
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "200 ms"
  - id: T-24
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "3 次 / 3 s"
  - id: T-25
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "2 s"
  - id: T-26
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "2 s"
  - id: T-27
    group: B          # 11 S1.6.2
    timebase: monotonic
    threshold: "1 s"
  # --- C group: 11 S1.6.3 . non-safety loop . monotonic except T-46 ---
  - id: T-40
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "8 s"
  - id: T-41
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "5 s"
  - id: T-42
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "5 s"
  - id: T-43
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "timeout_s"
  - id: T-44
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "100–200 ms 待定"
  - id: T-45
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "5.0 s 后转补发(v0.7 定案,)"
  - id: T-46
    group: C          # 11 S1.6.3
    timebase: wall
    threshold: "≥ 5 s"
  - id: T-ESTOP-CLOUD
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "待实测(M-23／00 COM-56)"
  - id: T-TELEOP-CMD
    group: C          # 11 S1.6.3
    timebase: monotonic
    threshold: "取甲方下发值,缺省 / 越界时用 400 ms(与本地 cmd/teleop 计龄口径同源)"
  - id: T-BCAST-IDLE
    group: C          # 11 S1.6.3 (v1.2, 99 U97: replaces T-BCAST-MAX)
    timebase: monotonic
    threshold: "现行值见 14 §11 mode.b_cast_idle_timeout_s(从最后一帧被放行的有效音频算起;从未收到帧时从进入 B 算起.甲方 v2.0 §8 定 300 s)"
