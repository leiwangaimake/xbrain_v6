# File: timeouts.yaml
# Brief: Committed copy of the 11 S1.6 global timeout / age master table
#
# Description:
# 11 S1.6 is the one place the whole system's timeouts are registered ("全系统
# 所有超时集中于此表"). This file mirrors that table so every process can import
# the same registry and the deployed C++ header is generated from one source.
# The metatest tests/common/clock/test_timeout_table.py is the only thing keeping
# this file and S1.6 equal: it extracts S1.6 fresh and asserts an empty symmetric
# difference in BOTH directions (an id, group, timebase or threshold that drifts
# fails it). See that file for the three mutation cases.
#
# *** threshold is CONTRACT TEXT, not a runtime value. It is the in-force token
# from the S1.6 阈值 cell (decoration stripped, cut at the first <br>; the exact
# rule lives in normalize_threshold in the metatest, and this file is authored to
# match it). It exists for audit and cross-checking, NOT for a control loop to
# divide by. The number a process actually enforces comes from that process's
# own config (e.g. p4_agent.yaml timeout_s for T-40/T-41/T-42, p5_gateway
# event.ack_timeout_s for T-45), where it can be calibrated and, where the
# contract has not fixed a value, left null to refuse startup. Uncalibrated
# entries here are recorded verbatim as the contract wrote them -- "待实测",
# "100–200 ms 待定", "timeout_s" -- and NEVER as a fabricated number (CLAUDE.md
# 3.1): this registry does not invent a value the contract does not state.
#
# timebase is derived from the document's own rule, not a per-row column (S1.6
# has none): group A is 全部单调时钟 with no exception, and T-46 is singled out
# as the one wall-clock entry. The metatest asserts both anchor phrases still
# exist before trusting that derivation.
#
#  Do NOT write a count of rows here or in any comment. S1.6 does not carry one
# and a human-copied tally rots (CLAUDE.md 3.7). The scan-surface metatest is
# what proves nothing was dropped.
#
#  This is NOT configuration. It ships inside the package like codes.yaml, is
# read from the package directory, and must be byte-identical for every process
# -- the resolved config tree deliberately expands per process and cannot offer
# that (10 S5.4.1).

timeouts:
  # --- A group: 11 S1.6.1 . safety loop . all monotonic, no wall clock ---
  - id: T-01
    group: A          # 11 S1.6.1
    timebase: monotonic
    threshold: "200 ms"
