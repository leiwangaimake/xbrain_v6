<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XBRAIN_V6 GPS 网格地图 HMI</title>
<link rel="stylesheet" href="hmi.css?v=banner-1">
</head>
<body>
<main class="hmi">
  <section class="map-shell" aria-label="GPS 网格地图">
    <header class="map-toolbar">
      <div class="map-title">GPS 网格地图</div>
      <!-- ESTOP: 17 S6.10.1 / W1, states per 17 S6.3 (hmi.js estopView):
           ok -> armed; degraded -> still pressable, yellow; down or 2 s
           without any downlink -> greyed (NAV-64). The sentence that goes with
           it ("use the hardware stop") is in the amber banner below the
           toolbar, not beside the button (user 2026-11-11). Starts disabled:
           nothing has proved the path yet. -->
      <button id="estopBtn" class="estop-btn" title="紧急停止" disabled>急停 ESTOP</button>
      <!-- Chassis lock (99 U159): colour and label follow the state/robot
           read-back (hmi.js renderChassisLock). Locked -> deep red, a click arms
           and a second click sends W9 unlock (11 S9.3.4 enable, L2). Unlocked ->
           green, clicks do nothing (the system has no lock command). Starts grey
           and disabled: nothing is known until the first snapshot. -->
      <button type="button" id="chassisLockBtn" class="chassis-lock-btn unknown"
              title="底盘状态未知" disabled>底盘状态未知</button>
      <!-- Battery gauges (99 U160): slot 0 = A, slot 1 = B, from state/power
           list[] (hmi.js renderBattery). Fill colour by level: >= 50 green,
           20-49 yellow, < 20 red. Inside the bar a present pack alternates
           percentage (5 s) and temperature (2 s); an empty slot reads 未插入,
           missing or stale data reads 未知 -- never a fabricated 0%. -->
      <div class="battery-box" id="batteryBox" title="电池电量">
        <div class="battery-cell unknown" id="batteryA">
          <span class="battery-label">A</span>
          <span class="battery-bar"><i class="battery-bg"></i><svg class="battery-svg" viewBox="0 0 150 44" aria-hidden="true"><rect class="bat-frame" x="2" y="2" width="132" height="40" rx="9"/><rect class="bat-nub" x="134" y="11" width="13" height="22" rx="4"/><rect class="bat-fill" x="7.5" y="7.5" width="0" height="29" rx="4.5"/></svg><b class="battery-text">未知</b></span>
        </div>
        <div class="battery-cell unknown" id="batteryB">
          <span class="battery-label">B</span>
          <span class="battery-bar"><i class="battery-bg"></i><svg class="battery-svg" viewBox="0 0 150 44" aria-hidden="true"><rect class="bat-frame" x="2" y="2" width="132" height="40" rx="9"/><rect class="bat-nub" x="134" y="11" width="13" height="22" rx="4"/><rect class="bat-fill" x="7.5" y="7.5" width="0" height="29" rx="4.5"/></svg><b class="battery-text">未知</b></span>
        </div>
      </div>
      <div class="zoom-group">
        <button id="zoomIn" class="zoom-btn" title="放大">＋</button>
        <button id="zoomOut" class="zoom-btn" title="缩小">－</button>
        <button id="zoomReset" class="zoom-btn" title="复位">⟳</button>
      </div>
    </header>

    <!-- Link / ESTOP banner (11 S12.3 reconnect flow, NAV-64): the ONE place
         for link-lost, ESTOP-path down or slow, and "the stop did not go out"
         sentences (hmi.js linkBannerView, one sentence by priority). Visible
         from the start -- until the first frame nothing is known. -->
    <div id="linkBanner" class="link-banner" role="alert">正在连接机器人 ... 网页急停暂不可用, 请使用硬件急停</div>

    <!-- W2 goto banner (hmi.js showBanner). Four kinds: confirm (确认前往 /
         取消), info (hides itself), warn = an invalid target (知道了), fail =
         a failed or refused goto (close cross, stays until closed). Not a
         modal -- a modal would block the map redraw while the robot moves. -->
    <div id="gotoBanner" class="goto-banner" role="status" hidden>
      <span class="goto-text"></span>
      <button type="button" id="gotoSend" class="goto-send">确认前往</button>
      <button type="button" id="gotoCancel" class="goto-cancel">取消</button>
      <button type="button" id="gotoAck" class="goto-ack" hidden>知道了</button>
      <button type="button" id="gotoClose" class="goto-close" title="关闭" aria-label="关闭" hidden>×</button>
    </div>

    <div id="viewport" class="map-viewport" title="拖动平移, 滚轮缩放">
      <svg id="mapSvg" preserveAspectRatio="none">
        <defs>
          <pattern id="minorGrid" patternUnits="userSpaceOnUse">
            <path id="minorGridPath" fill="none" class="map-grid-minor"/>
          </pattern>
          <pattern id="majorGrid" patternUnits="userSpaceOnUse">
            <rect id="majorGridRect" fill="url(#minorGrid)"/>
            <path id="majorGridPath" fill="none" class="map-grid-major"/>
          </pattern>
        </defs>
        <rect id="gridBg" fill="url(#majorGrid)"/>

        <!-- Layers filled by hmi.js from /api/hmi/snapshot. Empty until data. -->
        <g id="keepInLayer"></g>
        <g id="alarmLayer"></g>
        <g id="recordedRouteLayer"></g>
        <g id="realtimeTrajectoryLayer"></g>
        <!-- 录制中的轨迹(11 S12A.5). 会话结束即清空, 交给 geo.db 的权威几何. -->
        <g id="teachLayer"></g>
        <g id="keypointLayer"></g>
        <g id="robotLayer"></g>
        <g id="eventLayer"></g>
        <!-- W2 target dots (picked / on its way), drawn last so nothing covers them. -->
        <g id="gotoLayer"></g>
      </svg>

      <div class="map-overlay legend">
        <div class="legend-row"><i class="legend-mark recorded-route-mark"></i><span>已录制路径</span></div>
        <div class="legend-row"><i class="legend-mark realtime-route-mark"></i><span>实时行走轨迹</span></div>
        <div class="legend-row"><i class="legend-mark teach-mark"></i><span>录制中(近似)</span></div>
        <div class="legend-row"><i class="legend-mark fence"></i><span>活动区域</span></div>
        <div class="legend-row"><i class="legend-mark alarm"></i><span>报警区域</span></div>
        <div class="legend-row"><i class="legend-mark speed"></i><span>限速区域</span></div>
        <div class="legend-row"><i class="legend-mark forbid"></i><span>禁止区域</span></div>
      </div>

      <!-- 机器人本体航向仪(替代原左上角 N+三角指北针). 表盘层旋转 + 指针层固定朝上 +
           中心镂空(见 hmi.js buildDialFace/renderHeading). 数据仅 pose.heading_rad
           本体航向, 非云台朝向(17 S6.6/PTZ-C2 边界). heading 未就位时 no-heading 置灰. -->
      <svg id="headingDial" class="heading-dial no-heading" viewBox="-100 -100 200 200"
           aria-label="机器人航向仪表盘">
        <g id="dialFace"></g>
        <polygon id="dialPointer" points="0,-50 18,28 0,12 -18,28"/>
      </svg>

      <!-- 任务清单(17 S6.8.4): 当前(浅绿) + 历史(浅黄), 数据走 GET /api/tasks.
           历史面板默认折叠堆叠, 点击展开, 10s 无鼠标移动或再点收回. -->
      <section class="map-overlay task-panel" aria-label="任务清单">
        <div class="task-group current-group">
          <div class="task-group-title">当前任务</div>
          <div id="currentTaskList" class="task-list"><div class="task-empty">暂无当前任务</div></div>
        </div>
        <div class="task-group history-group">
          <div class="task-group-title">历史任务</div>
          <div id="historyTaskList" class="task-list history-list"><div class="task-empty">暂无历史任务</div></div>
        </div>
      </section>

      <!-- 录制指示(11 S12A.5, 只读). 无会话时整块隐藏 -- HMI 不能开始/结束/保存录制
           (S12.1.1 白名单 5 类不含 teach), 只显示 P3 正在做什么. -->
      <div class="map-overlay teach-badge" id="teachBadge" hidden>
        <div class="teach-line">
          <span class="teach-dot" id="teachDot"></span>
          <strong id="teachState">录制中</strong>
          <span id="teachKind">路径</span>
          <span id="teachName"></span>
        </div>
        <div class="teach-line teach-stats">
          <span id="teachPoints">0 点</span>
          <span id="teachLength">0 m</span>
          <span id="teachElapsed">0s</span>
          <span class="teach-warn" id="teachWarn" hidden></span>
        </div>
      </div>

      <!-- 事件列表(用户 2026-11-12, 17 S6.6): 底部居中, 风格同历史任务面板. 收起时一条
           (告警数 + 最新一条), 点击上拉到约半个地图高; 10s 无鼠标移动或再点标题收回.
           告警/故障与"持续中"的低电量/定位丢失/云端断链置顶; 点有位置的事件在地图上闪烁. -->
      <section class="map-overlay event-drawer" id="eventDrawer" aria-label="事件列表">
        <div class="ev-bar" id="eventBar" title="点击展开/收起事件列表">
          <span class="ev-title">事件</span>
          <span class="ev-badge" id="eventBarCount">无告警</span>
          <span class="ev-latest" id="eventBarLatest">暂无事件</span>
          <span class="ev-caret" aria-hidden="true"></span>
        </div>
        <div class="ev-body">
          <div class="ev-chips" id="eventChips">
            <button type="button" class="ev-chip" data-filter="alarm">告警/故障</button>
            <button type="button" class="ev-chip" data-filter="warn">警告</button>
            <button type="button" class="ev-chip" data-filter="info">信息</button>
            <button type="button" class="ev-chip on" data-filter="all">全部</button>
          </div>
          <div class="ev-pinned" id="eventPinned"></div>
          <div class="ev-scroll" id="eventList"></div>
        </div>
      </section>

      <!-- 左下角坐标块(客户样例): GPS 一行, ENU 一行含 E/N + 航向 + 速度 -->
      <div class="map-overlay coord">
        <strong>GPS</strong> <span id="coordGps">无定位</span><br>
        <strong>ENU</strong> <span id="coordEnu">E --m &middot; N --m&#12288;航向 --&deg;&#12288;速度 --m/s</span>
      </div>
    </div>

    <!-- 状态栏(用户 2026-08-16 重做): 无前缀圆点; 各状态用文字颜色表状态(亮绿=正常, 红=丢失/断);
         全部同一水平基线, 字体统一(模式不再加粗). 站点本地时钟走 common.timezone 每秒本地 tick. -->
    <footer class="map-footer">
      <span class="mode-text" id="modeText">模式: --</span>
      <span id="clockText">--:--:--</span>
      <span class="stat" id="fixText">定位 --</span>
      <span class="stat" id="hdgText">航向 --</span>
      <span class="stat" id="syncText">授时 --</span>
      <span>精度 <strong id="precText">--</strong></span>
      <span>地图基准 <strong>WGS84 / ENU</strong></span>
      <span>缩放 <strong id="zoomText">1.0x</strong></span>
      <!-- 急停链路: 契约强制(17 S6.6 / NAV-64). 放 scale 前, 让"网格"最右 -->
      <span class="stat" id="linkText">急停链路 --</span>
      <span class="scale" id="scaleText">网格 --</span>
    </footer>
  </section>
</main>
<script src="hmi.js?v=pin-4"></script>
</body>
</html>
