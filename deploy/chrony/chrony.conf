# File: chrony.conf
# Brief: XBRAIN_V6 authoritative chrony (NTP) time-sync configuration
#
# Description:
# This is the wall-clock discipline source. rtk_driver reads it indirectly via
# `chronyc -c tracking` and is the ONLY process allowed to judge
# ClockStatus.sync from it (CLK-A1, 11 S3.11); every other process copies that
# sync verdict (CLK-A2). ClockStatus.sync gates motion (common.safety.clock.
# unsynced_max_speed_mps), so this file is safety-adjacent -- V6 owns it rather
# than shipping Ubuntu's internet-pool default.
#
# What this file does NOT change: the SAFETY loops are untouched by any clock
# step here -- they run on the monotonic clock (CLK-C1). A wrong NTP source only
# affects the DISPLAYED wall time (HMI clock / G24 report), never a timeout.
#
# Install: copy or symlink to /etc/chrony/chrony.conf, then
#   systemctl restart chrony
#
# The four sources in priority order (11 S1.5 source table):
#   [1] RTK PPS refclock       source=rtk  quality=precise   (best; needs PPS wired)
#   [2] site (yingqu) NTP srv  source=ntp  quality=precise   (via DHCP / drop-in)
#   [3] internet NTP           source=ntp  quality=precise   (staging / CN + intl)
#   [4] RTC                    source=rtc  quality=coarse     (last resort)

# ---- source [1]: RTK PPS refclock (11 S1.5 source 1; rtk / precise) ----------
# DEFERRED until the module's PPS + NMEA line is wired to the ORIN. The exact
# refclock syntax depends on that wiring (PPS device vs SHM from a NMEA parser),
# so it is left commented rather than guessed. Uncomment + fill when PPS lands;
# it then becomes the highest-quality source and rtk_driver reports source=rtk
# with the ref_age_s <= 5.0 gate (11 S1.5 table row 1).
#refclock PPS /dev/pps0 lock NMEA refid PPS
#refclock SHM 0 refid NMEA offset 0.0 precision 1e-3

# ---- source [2]: site (yingqu) NTP server (11 S1.5 source 2; ntp / precise) ---
# Provided PER SITE, not hard-coded here: a deployed camp NTP server is injected
# by DHCP (sourcedir /run/chrony-dhcp) or dropped into /etc/chrony/conf.d as a
# site-specific `server` line. NET-C8: in a locked camp network the robot must
# NOT reach the internet, so source [3] below is unreachable there and this is
# the working source. Keeping the sourcedirs means the site can add it without
# editing this file.
confdir /etc/chrony/conf.d
sourcedir /run/chrony-dhcp
sourcedir /etc/chrony/sources.d

# ---- source [3]: internet NTP (staging / internet-available sites) -----------
# China domestic FIRST (user 2026-08-16): for domestic delivery the Ubuntu pools
# can be slow or unreachable, so ship reliable CN servers. International servers
# stay active as a fallback so the same image works overseas (internationalised
# product) without editing this file -- chrony picks the best reachable source
# regardless of listing order. In a locked camp (NET-C8) all of these are simply
# unreachable and ignored; the firewall (deploy/net), not this file, enforces the
# no-outbound rule.
# chrony has NO inline trailing comments -- annotations go on their own line.
# ntp.ntsc.ac.cn: National Time Service Center (authoritative CN).
server ntp.ntsc.ac.cn iburst
# ntp.aliyun.com: Alibaba Cloud. ntp.tencent.com: Tencent Cloud.
server ntp.aliyun.com iburst
server ntp.tencent.com iburst
pool cn.pool.ntp.org iburst maxsources 3
# international fallback (overseas sites / redundancy)
pool pool.ntp.org iburst maxsources 2
server time.cloudflare.com iburst

# ---- local NTP server role (NET-C8: serve LAN3 / LAN4 payload devices) --------
# The robot may serve time to downstream payload devices. Set the SERVED subnet
# per deployment; never open it to 0.0.0.0 (same reason as NET-C9 for the HMI).
# `local stratum 10` lets it serve even before it is itself synced. Commented
# until a deployment needs it.
#allow 192.168.3.0/24
#local stratum 10

# ---- discipline --------------------------------------------------------------
driftfile /var/lib/chrony/chrony.drift
rtcsync
# 11 S1.5.6: allow a wall-clock STEP only for the first 3 updates (cold start,
# dead RTC, cross-site move can be seconds..years off), then SLEW forever after.
# A running-time step would pollute the recording timeline and event ordering;
# the first-3 window matches ClockStatus.step_count in rtk_driver (CLK-C6).
makestep 1.0 3
leapsectz right/UTC
logdir /var/log/chrony
maxupdateskew 100.0
keyfile /etc/chrony/chrony.keys
ntsdumpdir /var/lib/chrony

# ---- offline LAN (no internet AND no site NTP) -- DEFERRED --------------------
# user 2026-08-16: when neither internet NTP nor a camp NTP server is reachable
# (a pure offline LAN), time must come from either the customer's PC acting as a
# local NTP server, or GPS/PPS (source [1]). That path is NOT wired here yet --
# it needs a decision on which of the two the site uses. Documented so a later
# batch adds the source explicitly rather than assuming this file already covers
# the offline case (it does not -- offline today falls through to source [4] RTC,
# which is coarse and, with rtc_trusted=false, yields ClockStatus.sync=false).
