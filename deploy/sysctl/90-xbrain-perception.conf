# File: 90-xbrain-perception.conf
# Brief: kernel socket receive buffer ceiling for the Orbbec 338Le GigE camera
#
# Description:
# perception receives the 338Le depth + colour streams over GigE (lan1). With
# the kernel default rmem_max (212992) the camera SDK cannot get the buffer it
# asks for and frames drop in heavy scenes (ros2_ws/perception/issues.md 6.1).
# Installed to /etc/sysctl.d/ by scripts/install_units.sh; applied at boot by
# systemd-sysctl. Raises a ceiling only -- it does not change any default buffer.
net.core.rmem_max = 4194304
