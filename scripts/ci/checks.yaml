# File: checks.yaml
# Brief: INF-CI-5 registry of CI checks invoked by run_all.sh
#
# Description:
# INF-CI-5 registry of CI checks
#
# Every check that run_all.sh actually invokes MUST appear here, and every
# entry here MUST be invoked by run_all.sh. The bidirectional diff is
# enforced by tests/common/test_ci_registry.py.
#
# Adding a new check:
#   1. Add the script under scripts/ci/ (or point at an existing lint).
#   2. Add an entry here with a `name`, `path`, and `reason`.
#   3. Add an invocation line to scripts/ci/run_all.sh.
# Missing any of (1)/(2)/(3) fails the meta test.
#
# NOT in this registry (deliberately):
#   * Individual scripts/lint/*.py -- they roll up under static_rules.py
#     (INF-CI-1 bundle) which IS registered here as one entry.
#   * scripts/doccheck/*.py individual scripts -- they roll up under
#     tests/common/test_doccheck_coverage.py (INF-CI-4) which itself is
#     invoked via pytest below.
#
# Pytest scan surface -- declared, because an undeclared one is CLAUDE.md 3.2
# form 6 and this registry was living it (NEXT S5 SW-29, fixed 2026-10-01):
#   * The single pytest entry runs `tests` with NO -m filter, so the surface
#     is every test the tree collects.
#   * It used to be three entries naming three directories. The other 30 were
#     invoked by nothing, and nothing here said so -- "run_all.sh is green"
#     and "the tests pass" were different sentences and the file did not
#     admit it.
#   * No -m filter, deliberately. pytest.ini offers `-m no_device` as the CI
#     filter for DEVELOPER machines; this runner is the robot. The real
#     difference is not the hardware tests -- needs_orin and needs_chassis
#     have one case each and both skip unconditionally -- it is the ~2275
#     cases carrying NO marker at all, which every -m selection deselects.
#     Those are exactly the ones that must not be invisible here. (Their file
#     count is ratcheted down by tests/meta/test_marker_coverage.py; counts
#     are not written here, per 3.7.)

checks:

  - name: static_rules
    path: scripts/ci/static_rules.py
    reason: "INF-CI-1 -- 9 CLAUDE.md 8.2 static rules bundle"

  - name: layout_gate
    path: scripts/ci/layout_gate.py
    reason: "CHK-1-52 -- directory layout guard (common/deploy/data etc.)"

  - name: header_lint
    path: scripts/lint/header_lint.py
    reason: "CLAUDE.md 2.5 -- five-field file header + File field mismatch"

  - name: comment_ratio
    path: scripts/lint/comment_ratio.py
    reason: "CLAUDE.md 2.4 -- comment ratio >= 70% for xbrain/"

  - name: no_chinese_in_log
    path: scripts/lint/no_chinese_in_log.py
    reason: "CFG-CM-15 -- log/print/exception message must be English"

  - name: map1_scan
    path: scripts/doccheck/map1_scan.py
    reason: "CFG-DC-1 -- 10 S3.3.6 alignment table diff (may fail on doc drift)"

  - name: null_guard
    path: scripts/ci/null_guard.py
    reason: "INF-DB-2 -- guarded config keys must stay null until 21 debt closes"

  - name: gen_drift
    path: scripts/ci/gen_drift_gate.py
    reason: "CHK-1-49 -- checked-in generated artifacts must equal a fresh run of their generator"

  - name: cpu_affinity
    path: scripts/ci/check_affinity.py
    reason: "CHK-1-03 -- systemd CPUAffinity must equal the 10 S3.2 core table"

  - name: cxx_discipline
    path: scripts/ci/cxx_discipline_audit.py
    reason: "CHK-1-50 -- numbered C++ discipline rules (CRL/DDS/RT-C/CPP/PB-5); most have no scan target yet"

  - name: m5_acceptance
    path: scripts/ci/m5_acceptance.py
    reason: "CHK-1-05 -- M5 exit report generated from test results; hand-written rows are rejected"

  - name: pytest_tree
    path: pytest
    args: ["tests"]
    reason: >-
      the WHOLE test tree, no -m filter. Replaces three entries that named
      tests/common, tests/boot/freeze and tests/configs -- 3 of the 33
      directories under tests/, with the other 30 (p_processes, deps,
      p1_motion, p3_task, meta, ci, repo, sil, ...) invoked by nothing. See
      the scan-surface note in this file's header for why there is no -m here.
