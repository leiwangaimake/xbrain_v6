<!DOCTYPE html>

  UI text is Chinese; punctuation ASCII per repo charset rule.

<html>
<head>
<meta charset="utf-8"><title>RNS SIL</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; display:flex;
         height:100vh; background:#0b1120; }
  #panel { width:250px; background:#111827; padding:14px 12px; overflow-y:auto;
           border-right:1px solid #1f2937; }
  #panel h3 { margin:2px 0 14px; color:#f9fafb; font-size:17px;
              letter-spacing:2px; font-weight:600; }
  .grp { background:#1a2332; border:1px solid #2a3648; border-radius:12px;
         padding:12px 10px; margin-bottom:12px; }
  .grp .lbl { color:#6b7f99; font-size:10px; letter-spacing:3px;
              margin-bottom:10px; text-transform:uppercase; }
  /* graphical obstacle buttons: the button IS the obstacle shape */
  #obsgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .obtn { position:relative; height:64px; border:none; border-radius:10px;
          background:#232f42; cursor:pointer; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:5px;
          transition:background .12s, transform .06s, box-shadow .12s; }
  .obtn:hover { background:#2c3a52; box-shadow:0 0 0 1px #3b4d68 inset; }
  .obtn:active { transform:scale(.96); }
  .obtn.sel { box-shadow:0 0 0 2px #f59e0b inset, 0 0 12px rgba(245,158,11,.35); }
  .obtn span { color:#cbd5e1; font-size:11px; }
  .shape { display:block; }
  .sh-person { width:26px; height:26px; border-radius:50%;
               background:radial-gradient(circle at 35% 30%, #fbbf24, #d97706); }
  .sh-car { width:34px; height:20px; border-radius:5px;
            background:linear-gradient(160deg, #94a3b8, #475569); }
  .sh-wall { width:40px; height:12px; border-radius:3px;
             background:linear-gradient(90deg, #334155, #0f172a);
             box-shadow:0 0 0 1px #475569 inset; }
  .sh-rock { width:28px; height:25px; background:linear-gradient(160deg,#f59e0b,#b45309);
             clip-path:polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .sh-cone { width:22px; height:26px; background:linear-gradient(180deg,#fb7185,#e11d48);
             clip-path:polygon(50% 0, 90% 100%, 10% 100%); }
  .btn { display:block; width:100%; margin:8px 0 0; padding:10px 8px; border:none;
         border-radius:10px; cursor:pointer; font-size:13px; color:#f8fafc;
         font-weight:500; transition:filter .12s, transform .05s; }
  .btn:hover { filter:brightness(1.15); }
  .btn:active { transform:scale(.98); }
  .btn.sel { box-shadow:0 0 0 2px #f59e0b inset; }
  #b_path { background:linear-gradient(135deg,#2563eb,#3b82f6); margin-top:0; }
  #b_wp { background:linear-gradient(135deg,#dc2626,#ef4444); }
  #b_exec { background:linear-gradient(135deg,#059669,#34d399); font-weight:700;
            text-align:center; font-size:14px; padding:13px 8px;
            letter-spacing:1px; }
  #b_reset { background:#374151; text-align:center; }
  /* telemetry */
  #info { font-family:Consolas,Menlo,monospace; font-size:12px; color:#93c5fd; }
  .tr { display:flex; justify-content:space-between; padding:2.5px 0;
        border-bottom:1px solid #1e293b; }
  .tr .k { color:#64748b; }
  .tr .v { color:#e2e8f0; }
  .tr .v.hl { color:#34d399; }
  .tr .v.warn { color:#fbbf24; }
  .tr .v.bad { color:#f87171; }
  #help { font-size:11px; color:#4b5f78; margin-top:10px; line-height:1.7; }
  #cv { flex:1; background:#f4f6fa; cursor:crosshair; }
</style>
</head>
<body>
<div id="panel">
  <h3>RNS SIL</h3>
  <div class="grp">
    <div class="lbl">障碍物</div>
    <div id="obsgrid">
      <button class="obtn" id="b_person"><i class="shape sh-person"></i><span>人</span></button>
      <button class="obtn" id="b_car"><i class="shape sh-car"></i><span>车</span></button>
      <button class="obtn" id="b_wall"><i class="shape sh-wall"></i><span>墙 两点</span></button>
      <button class="obtn" id="b_rock"><i class="shape sh-rock"></i><span>石头</span></button>
      <button class="obtn" id="b_cone"><i class="shape sh-cone"></i><span>雪糕桶</span></button>
    </div>
  </div>
  <div class="grp">
    <div class="lbl">任务</div>
    <button class="btn" id="b_path">放置路径 path</button>
    <button class="btn" id="b_wp">放置位置点 waypoint</button>
  </div>
  <button class="btn" id="b_exec">执行导航测试</button>
  <button class="btn" id="b_reset">重置场景</button>
  <div class="grp" style="margin-top:12px">
    <div class="lbl">RNS 参数</div>
    <div id="info">连接中...</div>
  </div>
  <div id="help">
    选工具后左键放置 / 墙 = 两次左键 /
    路径 = 连点 + 右键结束 / 双击人车切动态 /
    选墙拖端点 + 滚轮调厚 / 无工具点地图即导航
  </div>
</div>
<canvas id="cv"></canvas>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const SCALE = 30;                       // px per meter
let W = 0, H = 0;
function resize(){ W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight; }
window.addEventListener("resize", resize);
function w2s(x, y){ return [W/2 + x*SCALE, H/2 - y*SCALE]; }
function s2w(px, py){ return [(px - W/2)/SCALE, (H/2 - py)/SCALE]; }

let tool = null;                        // person|car|wall|rock|cone|path|wp
let wallStart = null, pathPts = [], selWall = null, dragEnd = null;
let state = null;                       // last websocket state

const tools = {b_person:"person", b_car:"car", b_wall:"wall",
               b_rock:"rock", b_cone:"cone", b_path:"path", b_wp:"wp"};
for (const [id, t] of Object.entries(tools)){
  document.getElementById(id).onclick = () => {
    tool = (tool === t) ? null : t;
    wallStart = null; if (t !== "path") pathPts = [];
    document.querySelectorAll(".btn").forEach(b => b.classList.remove("sel"));
    if (tool) document.getElementById(id).classList.add("sel");
  };
}
document.getElementById("b_exec").onclick = () =>
  fetch("/api/nav/execute", {method:"POST"});
document.getElementById("b_reset").onclick = () =>
  fetch("/api/reset", {method:"POST"});

async function post(url, body){
  return fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
                     body: JSON.stringify(body||{})});
}

cv.addEventListener("contextmenu", e => {           // right click: finish path
  e.preventDefault();
  if (tool === "path" && pathPts.length >= 1){
    post("/api/path", {points: pathPts});
    pathPts = []; tool = null;
    document.querySelectorAll(".btn").forEach(b => b.classList.remove("sel"));
  }
});

cv.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const [x, y] = s2w(e.offsetX, e.offsetY);
  if (tool === "wall"){
    if (!wallStart){ wallStart = [x, y]; return; }
    post("/api/obstacle", {kind:"wall", x:wallStart[0], y:wallStart[1],
                           x2:x, y2:y, thick_m:0.5});
    wallStart = null; return;
  }
  if (tool === "path"){ pathPts.push([x, y]); return; }
  if (tool === "wp"){ post("/api/waypoint", {x:x, y:y}); return; }
  if (tool){ post("/api/obstacle", {kind:tool, x:x, y:y}); return; }
  // no tool: wall endpoint drag? else goto
  if (state){
    for (const o of state.obstacles){
      if (o.kind !== "wall") continue;
      for (const [ex, ey, which] of [[o.x, o.y, "a"], [o.x2, o.y2, "b"]]){
        const [sx, sy] = w2s(ex, ey);
        if ((sx-e.offsetX)**2 + (sy-e.offsetY)**2 < 100){
          selWall = o; dragEnd = which; return;
        }
      }
    }
  }
  post("/api/nav/goto", {x:x, y:y});
});
cv.addEventListener("mousemove", e => {
  if (selWall && dragEnd){
    const [x, y] = s2w(e.offsetX, e.offsetY);
    if (dragEnd === "a"){ selWall.x = x; selWall.y = y; }
    else { selWall.x2 = x; selWall.y2 = y; }
  }
});
cv.addEventListener("mouseup", () => {
  if (selWall && dragEnd){
    post(`/api/obstacle/${selWall.oid}/update_wall`,
         {x:selWall.x, y:selWall.y, x2:selWall.x2, y2:selWall.y2,
          thick_m:selWall.thick});
  }
  dragEnd = null;
});
cv.addEventListener("wheel", e => {                 // thickness on hovered wall
  if (!state) return;
  const [x, y] = s2w(e.offsetX, e.offsetY);
  for (const o of state.obstacles){
    if (o.kind !== "wall") continue;
    const d = distToSeg(x, y, o.x, o.y, o.x2, o.y2);
    if (d < o.thick){
      o.thick = Math.max(0.2, o.thick + (e.deltaY < 0 ? 0.1 : -0.1));
      post(`/api/obstacle/${o.oid}/update_wall`,
           {x:o.x, y:o.y, x2:o.x2, y2:o.y2, thick_m:o.thick});
      e.preventDefault(); return;
    }
  }
});
cv.addEventListener("dblclick", e => {              // toggle dynamic person/car
  if (!state) return;
  const [x, y] = s2w(e.offsetX, e.offsetY);
  for (const o of state.obstacles){
    if (o.kind !== "person" && o.kind !== "car") continue;
    if ((o.x-x)**2 + (o.y-y)**2 < 1.0){
      post(`/api/obstacle/${o.oid}/toggle_dynamic`); return;
    }
  }
});
function distToSeg(px, py, ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay, L2 = dx*dx+dy*dy;
  let t = L2 ? ((px-ax)*dx + (py-ay)*dy)/L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

// ── websocket ──
const ws = new WebSocket(`ws://${location.host}/ws`);
// interpolation buffer: the server ticks at 20 Hz but we render at 60 fps --
// without lerping the robot visibly jumps every 3rd frame ("stutter").
let prevRobot = null, curRobot = null, curAt = 0;
ws.onmessage = ev => {
  state = JSON.parse(ev.data);
  prevRobot = curRobot;
  curRobot = {x: state.robot.x, y: state.robot.y, yaw: state.robot.yaw};
  curAt = performance.now();
};
function lerpAngle(a, b, t){
  let d = b - a;
  while (d >  Math.PI) d -= 2*Math.PI;
  while (d < -Math.PI) d += 2*Math.PI;
  return a + d * t;
}
function robotNow(){
  if (!curRobot) return null;
  if (!prevRobot) return curRobot;
  const t = Math.min(1, (performance.now() - curAt) / 50);
  return {x: prevRobot.x + (curRobot.x - prevRobot.x) * t,
          y: prevRobot.y + (curRobot.y - prevRobot.y) * t,
          yaw: lerpAngle(prevRobot.yaw, curRobot.yaw, t)};
}
setInterval(() => { if (ws.readyState === 1) ws.send("k"); }, 5000);

// ── render loop ──
function draw(){
  requestAnimationFrame(draw);
  if (!W) resize();
  ctx.clearRect(0, 0, W, H);
  // 5 m grid
  ctx.strokeStyle = "#ddd"; ctx.lineWidth = 1;
  const g = 5*SCALE;
  for (let x = (W/2)%g; x < W; x += g){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = (H/2)%g; y < H; y += g){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  if (!state){ return; }
  // path
  if (state.path.length){
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.beginPath();
    state.path.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]);
      i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
    ctx.stroke();
    for (const p of state.path){ const [sx, sy] = w2s(p[0], p[1]);
      ctx.fillStyle = "#8b0000"; ctx.beginPath();
      ctx.arc(sx, sy, 4, 0, 7); ctx.fill(); }
  }
  // in-progress path preview
  if (pathPts.length){
    ctx.strokeStyle = "#888"; ctx.beginPath();
    pathPts.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]);
      i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
    ctx.stroke();
  }
  if (wallStart){ const [sx, sy] = w2s(wallStart[0], wallStart[1]);
    ctx.fillStyle = "#000"; ctx.fillRect(sx-3, sy-3, 6, 6); }
  // waypoints
  for (const p of state.waypoints){ const [sx, sy] = w2s(p[0], p[1]);
    ctx.fillStyle = "#ff5050"; ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 7); ctx.fill(); }
  // obstacles
  for (const o of state.obstacles){
    const [sx, sy] = w2s(o.x, o.y);
    if (o.kind === "wall"){
      const [ax, ay] = w2s(o.x, o.y), [bx, by] = w2s(o.x2, o.y2);
      ctx.strokeStyle = "#000"; ctx.lineWidth = o.thick*SCALE;
      ctx.lineCap = "butt";
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.fillStyle = "#0a0";
      ctx.fillRect(ax-3, ay-3, 6, 6); ctx.fillRect(bx-3, by-3, 6, 6);
    } else if (o.kind === "person"){
      ctx.fillStyle = "#f2e000"; ctx.beginPath();
      ctx.arc(sx, sy, 0.3*SCALE, 0, 7); ctx.fill();
      if (o.dynamic){ ctx.strokeStyle="#f00"; ctx.lineWidth=2; ctx.stroke(); }
    } else if (o.kind === "car"){
      ctx.fillStyle = "#666";
      ctx.save(); ctx.translate(sx, sy);
      ctx.fillRect(-1.0*SCALE, -0.6*SCALE, 2.0*SCALE, 1.2*SCALE);
      if (o.dynamic){ ctx.strokeStyle="#f00"; ctx.lineWidth=2;
        ctx.strokeRect(-1.0*SCALE, -0.6*SCALE, 2.0*SCALE, 1.2*SCALE); }
      ctx.restore();
    } else if (o.kind === "rock"){
      ctx.fillStyle = "#e07820"; ctx.beginPath();
      for (let i = 0; i < 6; i++){
        const a = i*Math.PI/3, hx = sx + 0.5*SCALE*Math.cos(a),
              hy = sy + 0.5*SCALE*Math.sin(a);
        i ? ctx.lineTo(hx, hy) : ctx.moveTo(hx, hy);
      }
      ctx.closePath(); ctx.fill();
    } else if (o.kind === "cone"){
      ctx.fillStyle = "#d22"; ctx.beginPath();
      ctx.moveTo(sx, sy - 0.5*SCALE);
      ctx.lineTo(sx - 0.25*SCALE, sy + 0.15*SCALE);
      ctx.lineTo(sx + 0.25*SCALE, sy + 0.15*SCALE);
      ctx.closePath(); ctx.fill();
    }
  }
  // robot (interpolated pose for smooth 60 fps rendering)
  const r = state.robot;
  const rp = robotNow() || r;
  const [rx, ry] = w2s(rp.x, rp.y);
  // FOV sector, 50 percent alpha
  ctx.save(); ctx.translate(rx, ry); ctx.rotate(-rp.yaw);
  ctx.fillStyle = "rgba(120,180,255,0.5)";
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.arc(0, 0, state.fov.range_m*SCALE,
          -state.fov.half_rad, state.fov.half_rad);
  ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = "#10b981";
  ctx.strokeStyle = "#065f46"; ctx.lineWidth = 2;
  ctx.fillRect(-0.82*SCALE, -0.44*SCALE, 1.64*SCALE, 0.88*SCALE);
  ctx.strokeRect(-0.82*SCALE, -0.44*SCALE, 1.64*SCALE, 0.88*SCALE);
  // yaw arrow (black, along +x of body frame)
  arrow(0, 0, 1.4*SCALE, 0, "#000");
  ctx.restore();
  // detour subgoal marker (purple diamond)
  if (state.nav.subgoal){
    const [gx, gy] = w2s(state.nav.subgoal[0], state.nav.subgoal[1]);
    ctx.fillStyle = "#a855f7";
    ctx.save(); ctx.translate(gx, gy); ctx.rotate(Math.PI/4);
    ctx.fillRect(-6, -6, 12, 12); ctx.restore();
  }
  // target-direction arrow (blue, world frame)
  if (state.nav.target){
    const dx = state.nav.target[0] - rp.x, dy = state.nav.target[1] - rp.y;
    const n = Math.hypot(dx, dy) || 1;
    arrowAt(rx, ry, rx + dx/n*1.4*SCALE, ry - dy/n*1.4*SCALE, "#06c");
  }
  // info panel
  const rows = [
    ["vx", r.vx.toFixed(2) + " m/s", ""],
    ["vy", r.vy.toFixed(2) + " m/s", ""],
    ["wz", r.wz.toFixed(2) + " rad/s", ""],
    ["speed", r.speed.toFixed(2) + " m/s", r.speed > 0.05 ? "hl" : ""],
    ["gnss E", r.gnss[0].toFixed(2), ""],
    ["gnss N", r.gnss[1].toFixed(2), ""],
    ["yaw", (r.yaw * 57.2958).toFixed(1) + " deg", ""],
    ["fix", r.fix, "hl"],
    ["nav", state.nav.state,
      state.nav.state.startsWith("failed") ? "bad"
        : state.nav.state === "arrived" ? "hl" : ""],
    ["rns", state.nav.rns_state,
      state.nav.rns_state === "wall_follow" ? "warn"
        : state.nav.rns_state === "wait_dynamic" ? "warn" : ""],
    ["dir", state.nav.direction > 0 ? "正向" : "反向", ""],
  ];
  if (state.nav.dist_to_target != null)
    rows.push(["距目标", state.nav.dist_to_target.toFixed(2) + " m", ""]);
  if (state.nav.wall){
    rows.push(["贴墙侧", state.nav.wall.side, "warn"]);
    rows.push(["贴墙距", (state.nav.wall.d_side == null ? "--"
               : state.nav.wall.d_side + " m"), ""]);
    rows.push(["贴墙程", state.nav.wall.followed_m + " m", ""]);
  }
  document.getElementById("info").innerHTML = rows.map(x =>
    `<div class="tr"><span class="k">${x[0]}</span>` +
    `<span class="v ${x[2]}">${x[1]}</span></div>`).join("");
}
function arrow(x1, y1, x2, y2, color){
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2-y1, x2-x1);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 9*Math.cos(a-0.4), y2 - 9*Math.sin(a-0.4));
  ctx.lineTo(x2 - 9*Math.cos(a+0.4), y2 - 9*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill();
}
function arrowAt(x1, y1, x2, y2, c){ arrow(x1, y1, x2, y2, c); }
resize(); draw();
</script>
</body>
</html>
